weiter zu KÖRPERDYSMORPHE STÖRUNG)\n\n\nVersuchen Sie etwas gegen diese Gedanken/Handlungen zu unternehmen?     JA____ NEIN____\n\nFalls JA, beschreiben:\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        26"},{"page":27,"name":"p27","pdfPage":15,"side":0,"text":"Körperdysmorphe Störung (F45.22)\n\nHauptmerkmal:  Irgendwann wiederholte Verhaltensweisen oder Gedanken im Zusammenhang mit\n              wahrgenommenem Mangel\nBeispiele:        Verhaltensweisen: Betrachten im Spiegel, exzessive Körperpflege,\n               Rückmeldungen einholen, Skin Picking, Gedanken: mit anderen vergleichen\nWichtig:         Beeinträchtigung/Leiden, ggf. wurden schon chirurgische Eingriffe in Betracht\n                gezogen oder vorgenommen\nBestimme, ob:    Muskeldysmorphie, mit guter/angemessener Einsicht, wenig Einsicht oder ohne\n                  Einsicht/wahnhaften Überzeugungen\n\n\n\n\n\nKörperdysmorphe Störung                                                   Ja     Nein\nExzessive Beschäftigung mit Mängeln im Erscheinungsbild\nWiederholte Verhaltensweisen/mentale Vorgänge\nLeiden oder Beeinträchtigungen\n\n\n\n\n27                     Copyright © 2017 Margraf & Cwik"},{"page":28,"name":"p28","pdfPage":15,"side":1,"text":"         KÖRPERDYSMORPHE STÖRUNG (KDS)\n\nWelche Körperbereiche und Mängel im Erscheinungsbild sind das?\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\nWie beschäftigen Sie sich mit diesen Mängeln im Erscheinungsbild (z. B. vor anderen verstecken,\nBestätigung suchen, häufig im Spiegel betrachten)?\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\n\nRufen diese Gedanken oder Handlungen ausgeprägte Angst oder großes Unwohlsein hervor?\n\n                                                              JA____ NEIN____\n\n            Falls NEIN, weiter zu SCREENING: TRAUMAFOLGESPEKTRUM (S. 30)\n\n\nVersuchen Sie etwas gegen diese Gedanken/Handlungen zu unternehmen?     JA____ NEIN____\n\nFalls JA, beschreiben:\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        28"},{"page":29,"name":"p29","pdfPage":16,"side":0,"text":"29                     Copyright © 2017 Margraf & Cwik"},{"page":30,"name":"p30","pdfPage":16,"side":1,"text":"          SCREENING: TRAUMAFOLGESPEKTRUM\n\nPsychisches Trauma\nTrauma:           z. B. Vergewaltigung, andere Gewaltverbrechen, Naturkatastrophen, Unfälle, Tod\n                   einer sehr nahestehenden Person, grausame Details (Ersthelfer an Unfallort)\nKonfrontation:   Direkte Konfrontation, beobachten, einer nahestehenden Person widerfahren (keine\n                Anwesenheit erforderlich) oder über Medien konfrontiert (nur im Rahmen\n                   beruflicher Tätigkeiten\n\n\n\nHaben Sie schon einmal ein extrem belastendes, lebensbedrohliches oder traumatisches Ereignis\nerlebt oder mitansehen müssen, nach dem es Ihnen sehr schlecht ging, wie z. B. eine Vergewaltigung,\nein Unfall, andere Gewalttaten oder Naturkatastrophen?\n                                                              JA____ NEIN____\n\nIst einer Ihnen nahestehenden Person ein extrem belastendes oder traumatisches Ereignis widerfahren\noder ist sie auf eine grausame Art fast oder tatsächlich ums Leben gekommen?\n                                                              JA____ NEIN____\n\nHaben Sie mehrere solcher belastenden oder traumatischen Ereignisse erlebt?\n                                                              JA____ NEIN____\n\n\nHat das belastende Ereignis innerhalb der letzten 4 Wochen stattgefunden?\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n  Falls eines der Ereignisse innerhalb des letzten Monats stattgefunden hat, weiter zur Akuten\n          Belastungsstörung, sonst weiter zur Posttraumatischen Belastungsstörung.\n\n   Wenn KEIN traumatisches Ereignis erlebt wurde, weiter zu SCREENING: SPEKTRUM\n              PROBLEMATISCHEN ESSVERHALTENS (S. 36)\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        30"},{"page":31,"name":"p31","pdfPage":17,"side":0,"text":"Akute Belastungsstörung (F43.0)\n\nHauptmerkmal:  Spezifische Symptommuster als Folge eines massiven psychischen Traumas\nSymptommuster: Furcht/Vermeidung traumarelevanter Reize, häufigs/intensives intrusives\n                 Wiedererleben (Alptrauma, Tagträume, Flashbacks), negative Gefühle und\n                    gleichzeitig erhöhte Erregung\n                 Mindestens 9 von 14 Symptomen, begonnen oder verschlechtert nach dem letzten\n                  traumatischen Ereignis\nBeeinträchtigung: Symptome müssen klinisch bedeutsames Leiden/Beeinträchtigung verursachen\nVerlauf:          Frühestens 3 Tage und höchstens 1 Monat nach Trauma vergeben\nWichtig:        Die Symptome können direkt nach dem Ereignis auftreten, müssen aber\n                 mindestens bis zum 3. Tag nach dem Ereignis anhalten\n\n\n\n\n\nAkute Belastungsstörung                                                     Ja     Nein\nErleben von Tod/Lebensbedrohung/ernsthafter Verletzung/sexueller Gewalt\nMind. 9 Symptomen aus den 5 Kategorien:\nIntrusionen\nNegative Stimmung\nDissoziative Symptome\nVermeidungssymptome\nArousal Symptome\nDauer: 3 Tage - 1 Monat\nLeiden oder Beeinträchtigungen\n\n31                     Copyright © 2017 Margraf & Cwik"},{"page":32,"name":"p32","pdfPage":17,"side":1,"text":"            AKUTE BELASTUNGSSTÖRUNG\n\nWie fand die Konfrontation statt (Ihnen selbst widerfahren, Zeuge gewesen, einer nahestehenden\nPerson widerfahren, indirekt, über Medien im Rahmen einer beruflichen Tätigkeit)?\n\nSELBST____ BEOBACHTET____ NAHESTEHENDER PERSON____ INDIREKT____\n\nWann hat das belastende Ereignis stattgefunden und worum handelte es sich?\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\nWelche der folgenden Dinge treffen auf Sie zu?\n\nErleben Sie eine deutliche Belastung, wenn Sie an das Ereignis erinnert\nwerden, träumen Sie davon oder haben Sie das Gefühl das Ereignis\nerneut zu durchleben?                                             JA____ NEIN____\n\nFühlen Sie sich anhaltend unfähig, positive Gefühle zu spüren?             JA____ NEIN____\n\nHaben Sie Erinnerungslücken in Bezug auf das Ereignis oder manchmal das\nGefühl einer veränderten Wahrnehmung der Umgebung oder von sich selbst?  JA____ NEIN____\n\nVermeiden Sie es, an das Ereignis erinnert zu werden?                    JA____ NEIN____\n\nLeiden Sie seit dem Ereignis unter Schlafproblemen, Reizbarkeit,\nKonzentrationsschwierigkeiten, erhöhter Wachsamkeit oder Schreckhaftigkeit? JA____ NEIN____\n\n\nWann sind diese Beschwerden (nach dem Ereignis) aufgetreten? TAGE____\n\n   Falls KEIN weiteres Trauma, weiter zu SCREENING: SPEKTRUM PROBLEMATISCHEN\n                      ESSVERHALTENS (S. 36)\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        32"},{"page":33,"name":"p33","pdfPage":18,"side":0,"text":"Posttraumatische Belastungsstörung (F43.1)\n\nHauptmerkmal:  Spezifische Symptommuster als Folge eines massiven psychischen Traumas\nTrauma:           z. B. Vergewaltigung, andere Gewaltverbrechen, Naturkatastrophen, Unfälle\nKonfrontation:   Direkte Konfrontation, beobachten, einer nahestehenden Person widerfahren (keine\n                Anwesenheit erforderlich) oder über Medien konfrontiert (nur im Rahmen\n                   beruflicher Tätigkeiten\nSymptommuster: Furcht/Vermeidung traumarelevanter Reize, häufigs/intensives intrusives\n                 Wiedererleben (Alptrauma, Tagträume, Flashbacks), veränderte Gedanken und\n                 Gefühle und gleichzeitig erhöhte Erregung\nWiedererleben:  mindestens 1 von 5 Symptomen\nVermeidung:     mindestens 1 von 2 Symptomen\nAnhaltende\nÜbererregung:   mindestens 2 von 6 Symptomen\nVeränderungen\nin Gedanken und\nGefühlen:        mindestens 2 von 7 Symptomen\n\nBeeinträchtigung: Symptome müssen klinisch bedeutsames Leiden/Beeinträchtigung verursachen\nVerlauf:          Frühestens 1 Monat nach Trauma vergeben, vorher ist bei vorliegender\n                Symptomatik eine Akute Belastungsstörung in Betracht zu ziehen, eine\n                  Posttraumatische Belastungsstörung mit verzögertem Beginn liegt vor, wenn die\n              Symptome frühestens 6 Monate nach dem Trauma auftreten\nDauer:          Die Symptome müssen mindestens 1 Monat bestehen\nBestimme, ob:    Für eine Posttraumatische Belastungsstörung mit dissoziativen Symptomen müssen\n                   zusätzlich Symptome der Derealisation (z. B. unbeteiligt am eigenen Erleben und\n                  Verhalten fühlen, wie in Watte gepackt fühlen) oder Depersonalisation (z. B. sich\n                    selbst von außerhalb des Körpers beobachten) vorliegen\n\n\n\n\n\nPosttraumatische Belastungsstörung                                           Ja     Nein\nErleben von Tod/Lebensbedrohung/ernsthafte Verletzung/sexuelle Gewalt\nMind. 1 intrusives Symptom\nMind. 1 Vermeidungssymptom\nMind. 2 Symptome veränderter negativer Stimmung/Kognitionen\nMind. 2 Arousal Symptome\nDauer: mehr als 1 Monat\nLeiden oder Beeinträchtigungen\n\n\n33                     Copyright © 2017 Margraf & Cwik"},{"page":34,"name":"p34","pdfPage":18,"side":1,"text":"       POSTTRAUMATISCHE BELASTUNGSSTÖRUNG\n\nWie fand die Konfrontation statt (Ihnen selbst widerfahren, Zeuge gewesen, einer nahestehenden\nPerson widerfahren, indirekt, über Medien im Rahmen einer beruflichen Tätigkeit)?\n\nSELBST____ BEOBACHTET____ NAHESTEHENDER PERSON____ INDIREKT____\n\nWann hat das belastende Ereignis stattgefunden und worum handelte es sich?\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\nWelche der folgenden Dinge treffen auf Sie zu?\n\nErleben Sie eine deutliche Belastung, wenn Sie an das Ereignis erinnert\nwerden, träumen Sie davon oder haben Sie das Gefühl das Ereignis\nerneut zu durchleben?                                             JA____ NEIN____\n\nVermeiden Sie es, an das Ereignis erinnert zu werden?                    JA____ NEIN____\n\nBeobachten Sie bei sich durch das Ereignis vor allem negative Gefühle\noder Gedanken, oder haben Sie Erinnerungslücken in Bezug auf das Ereignis? JA____ NEIN____\n\nLeiden Sie seit dem Ereignis unter Schlafproblemen, Reizbarkeit,\nKonzentrationsschwierigkeiten, erhöhter Wachsamkeit oder Schreckhaftigkeit? JA____ NEIN____\n\n\nHaben diese Beschwerden mindestens 1 Monat angehalten?                JA____ NEIN____\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        34"},{"page":35,"name":"p35","pdfPage":19,"side":0,"text":"35                     Copyright © 2017 Margraf & Cwik"},{"page":36,"name":"p36","pdfPage":19,"side":1,"text":" SCREENING: SPEKTRUM PROBLEMATISCHEN ESSVERHALTENS\n\nDeutliches Untergewicht:  Körpergewicht mindestens 15% geringer als nach dem Body Mass Index\n               (BMI) zu erwarten\nBMI:            Körpergewicht (kg) geteilt durch die quadrierte Körpergröße (m2), d.h.\n               BMI=kg/ m2\n\nFaustregel für die Interpretation von BMI-Werten:\n                                           (BMI)\n    Definitiv anorektisch                        \u003c17\n   Untergewicht (möglicherweise anorektisch)      17–18,49\n   Normalgewicht                                18,5–24,99\n   Übergewicht                                 25–29,99\n   Adipositas Grad I                              30-34,9\n   Adipositas Grad II                              35-39,9\n   Adipositas Grad III                           40\n\nNun werde ich Ihnen einige Fragen zu Ihrem Gewicht stellen.\nWie groß sind Sie und wie viel wiegen Sie?                      ____      ____\n\n(Bei Verdacht auf Essstörung Gewicht objektiv nachprüfen)\nWie war Ihr niedrigstes bzw. höchstes Gewicht im Erwachsenenalter? ____      ____\n\nAN:    Haben Sie zuletzt stark abgenommen oder essen Sie absichtlich wenig, um an Gewicht zu\n         verlieren? Kam das früher vor?\n                                                    JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 38\n\nAN/BN: Haben Sie große Angst davor zu dick zu sein oder zu werden bzw. machen Sie sich große\n        Sorgen um Ihre Figur oder Ihr Gewicht? Kam das früher vor?\n                                                    JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 38/40\n\nAN/BN/BE: Haben Sie Heißhungerphasen oder Essanfälle, d.h. dass Sie sehr viel in sehr kurzer Zeit\n        gegessen? Kam das früher vor?                   JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 38/40\n\n          Falls NEIN, weiter zu SCREENING: SOMATISCHER BELASTUNGEN (S. 42)\n\n\nAbgrenzung Anorexie/Bulimie: Wenn Essanfälle gleichzeitig mit Anorexie auftreten, dann wird\nkeine zusätzliche Bulimie-Diagnose gegeben. Beide Diagnosen können nur gemeinsam gegeben\nwerden, wenn sie sich zeitlich nicht vollständig überlappen.\nAbgrenzung Bulimie/Binge-Eating: Bei Bulimie werden nach Essanfällen kompensatorische\nMaßnahmen vorgenommen (einzelne Diäten allerdings möglich), Binge-Eating mehr Leidensdruck.\n\nBinge-Eating: Essanfall, verbunden mit dem Verzehr einer Nahrungsmenge in einem Zeitraum, die\nerheblich größer ist als die Menge, die die meisten Menschen in dem Zeitraum essen würden.\nWährend des Essanfalls besteht ddas Gefühl die Kontrolle über das Essverhalten zu verlieren.\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        36"},{"page":37,"name":"p37","pdfPage":20,"side":0,"text":"Anorexia Nervosa (F50.0x)\n\nHauptmerkmal:  Signifikant niedriges Körpergewicht oder in Relation zum Energiebedarf\n                  eingeschränkte Gewichtszunahme, die zu signifikant niedrigem Körpergewicht\n                     führt.\nNotwendig:      extreme Furcht vor dem Dickwerden, krasse Körperschemaverzerrungen (trotz\n                 deutlichem Untergewicht zu dick)\nHäufig:           übertriebener Sport, Missbrauch von Abführmitteln oder Appetitzüglern, meist\n                  keine Krankheitseinsicht oder Leugnungstendenz\n                 Weitaus häufiger bei Frauen\nTypus:           Restriktiver Typus (F50.01): Während der letzten 3 Monate der Anorexia\n                Nervosa hat die Person keine regelmäßigen Essanfälle gehabt oder hat kein\n                  „Purging-Verhalten“ (das heißt selbstinduziertes Erbrechen oder Missbrauch von\n                  Laxantien, Diuretika oder Klistieren) gezeigt\n                Binge-Eating/Purging-Typus (F50.02): Während der letzten 3 Monate der\n                 Anorexia Nervosa hat die Person regelmäßig Essanfälle gehabt und hat\n                  Purgingverhalten (d.h. selbstinduziertes Erbrechen oder Missbrauch von Laxantien,\n                  Diuretika oder Klistieren) gezeigt\nBestimme, ob:    Teilweise Remission: nach Erfüllung aller Störungkriterien liegt nur noch Angst\n                 vor Gewichtszunahme oder Körperschemaverzerrung erfüllt\n                 Volle Remission: nach Erfüllung aller Störungkriterien wird kein Störungkriterium\n               mehr erfüllt\n                Schweregrad: leicht (BMI 18,49 - 17 kg/m2), mittelgradig (BMI 16-16,99 kg/m2),\n                schwer (BMI 15-15,99kg/m2), extrem (BMI \u003c 15 kg/m2)\n\n\n\n\n\nAnorexia Nervosa                                                           Ja     Nein\nEingeschränkte Kalorienzunahme mit signifikant niedrigem Körpergewicht\nIntensive Angst vor Gewichtszunahme/Verhinderung von Gewichtszunahme\nStörung in der Körperwahnehmung\n\n\n37                     Copyright © 2017 Margraf & Cwik"},{"page":38,"name":"p38","pdfPage":20,"side":1,"text":"              ANOREXIA NERVOSA (AN)\n\nTun Sie etwas, um einer Gewichtszunahme entgegenzuwirken?              JA____ NEIN____\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\nFühlen Sie sich insgesamt oder an Teilen Ihres Körpers zu dick?            JA____ NEIN____\n\nIst Ihr Gewicht oder Ihre Figur wichtig für Ihren Selbstwert?               JA____ NEIN____\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        38"},{"page":39,"name":"p39","pdfPage":21,"side":0,"text":"Bulimia Nervosa (F50.2)\n\nHauptmerkmal:  wiederholte Essanfälle mit subjektivem Kontrollverlust, ständige Sorge um\n                 Figur/Gewicht\nGegenmaßnahmen:  Erbrechen, Fasten, Abführmittel/Appetitzügler\nHäufigkeits-\nKriterium:       Mindestens 3 Monate lang mindestens 1 Essanfall/Woche\nUntergewicht:   Im Gegensatz zur Anorexia Nervosa nicht notwendig\n                 Häufig depressive Verstimmungen, Verheimlihcung aus Scham, v.a. Frauen\n                   betroffen\nBestimme, ob:    Teilweise Remission: nach Erfüllung aller Störungkriterien wird nur noch ein Teil\n                      erfüllt\n                 Volle Remission: nach Erfüllung aller Störungkriterien wird kein Störungkriterium\n               mehr erfüllt\n                Schweregrad: leicht (1-3 Episoden/Woche), mittelgradig (4-7 Episoden/Woche),\n                schwer (8-13 Episoden/Woche), extrem (14 oder mehr Episoden/Woche)\n\nBinge-Eating Störung (F50.8)\n\nHauptmerkmal:  wiederholte Essanfälle mit subjektivem Kontrollverlust\nHäufigkeits-\nKriterium:       Mindestens 3 Monate lang mindestens 1 Essanfall/Woche\nNotwendig:       Schnelleres Essen, Völlegefühl, über den Hunger essen, alleine Essen aus Scham,\n                  negative Gefühle aufgrund von Essanfällen\nWichtig:         kein kompensatorisches Verhalten\nBestimme, ob:    Teilweise Remission: nach Erfüllung aller Störungkriterien jetzt weniger als 1\n                   Essanfall pro Woche\n                 Volle Remission: nach Erfüllung aller Störungkriterien wird kein Störungkriterium\n               mehr erfüllt\n                Schweregrad: leicht (1-3 Episoden/Woche), mittelgradig (4-7 Episoden/Woche),\n                schwer (8-13 Episoden/Woche), extrem (14 oder mehr Episoden/Woche)\n\n\n\n\n\nBulimia Nervosa                                                            Ja     Nein\nWiederkehrende Binge-Eating Episoden\nKompensationsverhalten (mind. 1 x Woche, mind. 3 Monate)\nSelbstbewertung durch Körperform und Gewicht\nNicht ausschließlich während Anorexia Nervosa\n\n\n\n\nBinge-Eating Störung                                                        Ja     Nein\nWiederkehrende Binge-Eating Episoden\nEssanfälle gemeinsam mit mind. 3 Merkmalen\nLeidensdruck\nDauer: mind. 1 x Woche, mind. 3 Monate\nKeine kompensatorischen Maßnahmen\n\n\n39                     Copyright © 2017 Margraf & Cwik"},{"page":40,"name":"p40","pdfPage":21,"side":1,"text":"    BULIMIA NERVOSA (BN) / BINGE EATING STÖRUNG (BE)\n\nHaben Sie während der Essanfälle das Gefühl, Sie könnten sich nicht mehr kontrollieren?\n\n                                                              JA____ NEIN____\n\nHaben Sie einmal drei Monate lang mindestens ein Mal pro Woche Essanfälle gehabt?\n\n                                                              JA____ NEIN____\n\n\nHaben Sie etwas unternommen, um nicht durch die Essanfälle zuzunehmen?   JA____ NEIN____\n\n             Falls JA: BULIMIA NERVOSA; falls NEIN: BINGE-EATING STÖRUNG\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        40"},{"page":41,"name":"p41","pdfPage":22,"side":0,"text":"41                     Copyright © 2017 Margraf & Cwik"},{"page":42,"name":"p42","pdfPage":22,"side":1,"text":"        SCREENING: SOMATISCHER BELASTUNGEN\n\nAllgemein zu Somatischen Belastungs- und verwandten Störungen\n\nBisherige Versorgung: Patienten mit Störungen aus diesem Störungsbereich sind meist bereits in eine\nmedizinische Versorgung eingebunden, hingegen selten in eine psychiatrische oder\npsychotherapeutische Versorgung.\nAbklärung organischer Ursachen: Nicht immer muss jegliche Beteiligung organischer Faktoren\nausgeschlossen sein, evtl. stehen Beschwerden nur in keinem angemessenen Zusammenhang mit\nobjektivierbaren oragnischen Bedigungen.\n\n\n\n\nHaben Sie gegenwärtig körperliche Beschwerden oder Krankheiten?         JA____ NEIN____\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\nIch möchte Ihnen jetzt einige Fragen zu Ihrem körperlichen Befinden stellen:\n\n\nSBS:   Haben Sie viele körperliche Probleme? Kam das früher vor? JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 44\n\nKAS:   Fürchten Sie öfters, dass Sie eine schwere Krankheit haben oder bekommen könnten? Kam\n        das früher vor?\n\n                                                    JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 46\n\n\n           Falls NEIN, weiter zu SCREENING: ABHÄNGIGKEITSSPEKTRUM (S. 48)\n\n\nFalls körperliche Beschwerden und Krankheitsangst vorliegen, sollte eine Somatische\nBelastungsstörung vergeben werden.\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        42"},{"page":43,"name":"p43","pdfPage":23,"side":0,"text":"Somatische Belastungsstörung (F45.1)\n\nHauptmerkmal:  vorliegen einer oder mehr belastender oder im Alltag beeinträchtigender\n                  körperlichen Beschwerden\nNotwendig:      Mindestens 1 der nebenstehenden 3 Symptome\nDauer:           Typischerweise länger als 6 Monate (somatische Symptome können sich ändern)\nWichtig:       Symptome können auch ohne Zusammenhang zu einem medizinischen\n                  Krankheitsfaktor vorliegen; auf direkte Nachfrage hinsichtlich der Belastung\n                  schreiben einige Betroffene diese anderen Ursachen als den körperlichen\n                Problemen zu\nHäufig:        Hohe Inanspruchnahme medizinischer Versorgung\n\nAbgrenzung:     Krankheitsangststörung: Somatische Belastungsfaktoren müssen vorliegen\nBestimme, ob:   Mit vordergründigem Schmerz: Somatische Belastungsfaktoren verursachen\n                 vorallem Schmerzen\n                Chronisch: Schwere Symptome mit intensiver Beeinträchtigung und langer Dauer\n                (mehr als 6 Monate)\n                Schweregrad: leicht (nur 1 Symptom), mittelgradig (2 oder mehr Symptome),\n                schwer (2 oder mehr Symptome und ein schweres somatisches Symptom oder\n                   multiple somatische Beschwerden)\n\n\n\n\n\nSomatische Belastungsstörung                                                 Ja     Nein\nMind. 1 belastendes/beeinträchtigendes somatisches Symptom\nExzessive Gedanken/Gefühle/Verhalten\nDauer: mind. 6 Monate\n\n43                     Copyright © 2017 Margraf & Cwik"},{"page":44,"name":"p44","pdfPage":23,"side":1,"text":"        SOMATISCHE BELASTUNGSSTÖRUNG (SBS)\n\nHaben Sie aufgrund der körperlichen Probleme Ihren Lebensstil verändert oder Medikamente\neingenommen?\n                                                              JA____ NEIN____\n\nTreffen die folgenden Dinge bezogen auf Ihre körperlichen Probleme zu?\n\n... machen Sie sich häufig Gedanken über die Bedeutung dieser körperlichen Probleme?\n\n                                                              JA____ NEIN____\n\n... haben Sie Angst um Ihre Gesundheit aufgrund der Probleme?             JA____ NEIN____\n\n... investieren Sie viel Energie oder verbringen Sie viel Zeit damit, sich mit\nden körperlichen Problemen oder den Sorgen über diese Probleme zu\nbeschäftigen?                                                    JA____ NEIN____\n\nFalls JA, beschreiben:\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\nHaben diese Beschwerden mindestens 6 Monate angehalten?               JA____ NEIN____\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        44"},{"page":45,"name":"p45","pdfPage":24,"side":0,"text":"Krankheitsangststörung (F45.21)\n\nHauptmerkmal:  Unrealistische, starke Überzeugung/Befürchtung, eine (oder mehrere) schwere\n                   körperliche Erkrankung zu haben\nNotwendig:       starke Angst um und schnelle Verunsicherung in Bezug auf Gesundheit, exzessive\n                 gesundheitsbezogene Verhaltensweisen (z. B. Checking-Behavior) oder\n                  dysfunktionale Vermeidung (z. B. Krankenhäuser, Ärzte oder kranke Personen)\nInterpretation:   Deutung körperlicher Empfindungen/Merkmale als Krankheitszeichen oder –\n                 beweise\nKrankheitsüber-\nzeugung:       Auch durch sorgfältige ärztliche Untersuchung nicht dauerhaft beseitigbar\nAufmerksamkeit: chronische Beschäftigung mit dem eigenen Körper\nVerlauf:         Meist chronisch, Art der Krankheitsbefürchtungen kann wechseln\nAbgrenzung:     Somatische Belastungsstörung: Bei Krankheitsangststörung dürfen somatische\n              Symptome nicht vorhanden sein oder nur in einem geringen Ausmaß. Nicht\n               Symptome, sondern Beschäftigung mit schwerer Krankheit im Zentrum der\n                 Aufmerksamkeit; nicht allgemeine Kränklichkeit, sondern eher einzelne\n                   katastrophale Krankheit (z. B. Krebs, AIDS).\nBestimme, ob:   Aufsuchender Typus:  Häufiges Aufsuchen von medizinischer Maßnahmen oder\n                 Untersuchungen.\n               Vermeidender Typus: Medizinische Maßnahmen werden möglichst vermieden.\n\n\n\n\n\nKrankheitsangststörung                                                      Ja     Nein\nBeschäftigung mit schwerer körperlicher Erkrankung\nKeine somatischen Symptome\nSorge über die Gesundheit\nExsessives gesundheitsverbundenes Verhalten/maladaptives Vermeiden\nDauer: mind. 6 Monate\n\n\n45                     Copyright © 2017 Margraf & Cwik"},{"page":46,"name":"p46","pdfPage":24,"side":1,"text":"          KRANKHEITSANGSTSTÖRUNG (KAS)\n\nSeit wann fürchten bzw. glauben Sie, eine schwere körperliche Krankheit zu haben und um welche\nKrankheit handelt es sich?\n                                                              JA____ NEIN____\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\nSuchen Sie aufgrund dieser Befürchtungen häufiger Ärzte auf?              JA____ NEIN____\n\nVermeiden Sie Ärzte, Krankenhäuser oder Kranke, weil der Kontakt Ihre\nBefürchtungen/Überzeugungen verschlimmern könnte oder Sie eine Gefahr\nbefürchten?                                                     JA____ NEIN____\n\nFühren Sie bestimmte Verhaltensweisen in Bezug auf Ihre Angst immer wieder durch, um sich zu\nberuhigen (z. B. Abtasten, Rückversichern, im Spiegel betrachten, Internetsuche)?\n\n                                                              JA____ NEIN____\nFalls JA, beschreiben:\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        46"},{"page":47,"name":"p47","pdfPage":25,"side":0,"text":"47                     Copyright © 2017 Margraf & Cwik"},{"page":48,"name":"p48","pdfPage":25,"side":1,"text":"         SCREENING: ABHÄNGIGKEITSSPEKTRUM\n\nSSK:   Nehmen Sie irgendetwas, um Ihre Stimmung zu beeinflussen? Ich meine Dinge, wie z. B.\n         Alkohol oder Medikamente oder auch illegale Drogen wie Kokain? Kam das früher vor?\n\n                                                    JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 50\n\nSGS:    Spielen Sie häufiger um Geld, wie z. B. Poker, an Spielautomaten oder bei Sportwetten?\n      Kam das früher vor?\n                                                    JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 52\n\nSSI:     Spielen Sie häufiger und längere Zeit Computerspiele im Internet? Kam das früher vor?\n\n                                                    JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 54\n\n          Falls NEIN, weiter zu SCREENING: SCHLAFSTÖRUNGSSPEKTRUM (S. 56)\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        48"},{"page":49,"name":"p49","pdfPage":26,"side":0,"text":"Störung durch Substanzkonsum (F1x.xx)\n\nHauptmerkmal:  Problematischer Substanzkonsum, der zu deutlichen Beeinträchtigungen oder\n                 Belastungen führt\nNotwendig:      Mindestens 2 Symptome\nDauer:          Mindestens 12 Monate\nWichtig:        Aufgrund geschlechtsbedingter körperlicher Unterschiede sind Frauen vulnerabler\n                    für körperliche Konsequenzen des Konsums (insbesondere bei Alkohol).\nHäufig:         Männer höhere Raten von Störungen durch Alkoholkonsum, Frauen höhere Raten\n                von Störungen durch Medikamentenkonsum (Sedativa, Hypnotika oder\n                   Anxiolytika).\nHinweis:          spezifische Entzugssymptome für die jeweilige Substanz können dem DSM5 ab\n                   Seite 661 entnommen werden.\nBestimme, ob:    In früher Remission: nachdem die Kriterien erfüllt waren, werden sie seit\n                 mindestens 3 Monaten, aber nicht länger als 12 Monate, nicht mehr erfüllt\n               (ausgenommen Verlangen oder Wunsch nach Konsum).\n                 In anhaltender Remission: nachdem die Kriterien erfüllt waren, werden sie über\n                  einen Zeitraum von 12 Monaten oder länger nicht mehr erfüllt (ausgenommen\n                 Verlangen oder Wunsch nach Konsum).\n                 In kontrollierter Umgebung: die Person konsumiert aufgrund der geschützten\n              Umgebung nicht (z. B. geschützte stationäre Unterbringung).\nCodierungen:    Substanzen:\n                 Alkohol: F10.xxx; Opioide: F12.xxx; Sedativa, Hypnotika, Anxiolytika: F13.xxx;\n                   Stimulantien: F14.xxx; Koffein: F15.xxx; Halluzinogene: F16.xxx; Inhalanzien:\n                 F18.xxx; Andere Substanzen: F19.xxx\n                Schweregrade:\n                    leichtgradig: F1x.10; mittelgradig: F1x.20; schwergradig: F1x.30\n                Weitere Codierungen:\n                 Alkoholentzug, mit Wahrnehmungsstörungen: F10.239; Alkoholentzug, ohne\n                Wahrnehmungsstörungen: F10.232\n\n\n\n\n\nStörung durch Substanzkonsum                                               Ja     Nein\nCharakteristische kognitive/verhaltensbesogene/körperliche Symptome &\nFortsetzung des Gebrauchs, trotz Problemen\nPathologisches Muster von Verhaltensweisen (mind. 2)\nSubstanzentzug (nur bei Drogen und Alkohol)\nDauer: mind. 12 Monate\n\n49                     Copyright © 2017 Margraf & Cwik"},{"page":50,"name":"p50","pdfPage":26,"side":1,"text":"        STÖRUNG DURCH SUBSTANZKONSUM (SSK)\n\nTrinken Sie gegenwärtig regelmäßig Alkohol?                           JA____ NEIN____\n\nFalls JA: Art, Dosis und Dauer der Einnahme feststellen\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\nNehmen Sie gegenwärtig irgendwelche Medikamtene regelmäßig ein?        JA____ NEIN____\n\nFalls JA: Art, Dosis und Dauer der Einnahme feststellen\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\nNehmen Sie gegenwärtig irgendwelche Drogen?                         JA____ NEIN____\n\nFalls JA: Art, Dosis und Dauer der Einnahme feststellen\n\n__________________________________________________________________________________\n\nTreffen die folgenden Dinge für Ihren (Alkohol-/Medikamenten-/Drogen-) Gebrauch zu?\n\nNehmen Sie die Substanz mehr oder länger als beabsichtigt ein oder haben\nerfolglos versucht den Gebrauch einzustellen bzw. zu reduzieren?            JA____ NEIN____\n\nVerbringen Sie viel Zeit mit dem Substanzgebrauch, der -beschaffung oder\nder Erholung deren Wirkungen?                                     JA____ NEIN____\n\nVerspüren Sie ein Verlangen nach der Substanz?                         JA____ NEIN____\n\nHaben Sie Konflikte (beruflich oder privat) aufgrund des Gebrauchs oder\nhaben Sie Ihnen wichtige Tätigkeiten oder Personen vernachlässigt?         JA____ NEIN____\n\nKamen Sie schon öfter in Gefahr wegen dem Substanzgebrauch?            JA____ NEIN____\n\nGebrauchen Sie die Substanz weiter, obwohl Sie wissen, dass dies körperliche\noder psychische Probleme nach sich zieht?                             JA____ NEIN____\n\nMüssen Sie als mehr als früher zu sich nehmen, um (betrunken/high/angstfrei...)\nzu werden?                                                      JA____ NEIN____\n\nHaben Sie kröperliche Probleme, wenn Sie versuchen den Gebrauch einzustellen\noder nehmen Sie etwas anderes ein, um diese Probleme zu reduzieren?       JA____ NEIN____\n\nNahmen Sie die Substanz über einen Zeitraum von mindestens 12 Monaten und\nhaben in dieser Zeit die beschriebenen Symptome bei sich beobachtet?\n                                                              JA____ NEIN____\n\nFalls Hinweise auf Störung durch Substanzkonsum, Substanz angeben:\n\n__________________________________________________________________________________\n\n                       Copyright © 2017 Margraf & Cwik                        50"},{"page":51,"name":"p51","pdfPage":27,"side":0,"text":"Störung durch Glücksspielen (F63.0)\n\nHauptmerkmal:  Belastendes, andauerndes und wiederholtes problematisches Glücksspielverhalten\nNotwendig:      Mindestens 4 von 9 Symptomen\nDauer:          Mindestens 12 Monate\nWichtig:         Problematisches Glücksspielverhalten kann auch im Rahmen einer manischen\n                 Episode auftreten\nHäufig:           Finanzielle und soziale Probleme und Sorgen, Männer häufiger betroffen,\n                  Geschlechtsunterschiede hinsichtlich der Art des Glücksspiels (Männer häufiger\n                  Karten, Sport und Pferderennen, Frauen häufiger Spielautomaten und Bingo)\nAbgrenzung:    Manische Episode: wenn problematisches Glücksspielverhalten ausschließlich\n                während der Stimmungsproblematik besteht\nBestimme, ob:    Episodisch: Bei voller Symptomausprägung für mehr als 1 Episode, sinken die\n              Symptome zwischend en Episoden für mindestens einige Monate\n               Andauernd: Die Kriterien der Störung werden über mehrere Jahre erfüllt\n                 In früher Remission: nachdem die Kriterien erfüllt waren, werden sie seit\n                 mindestens 3 Monaten, aber nicht länger als 12 Monate, nicht mehr erfüllt\n                 In anhaltender Remission: nachdem die Kriterien erfüllt waren, werden sie über\n                  einen Zeitraum von 12 Monaten oder länger nicht mehr erfüllt\n                Schweregrad: leicht (4-5 Symptome), mittelgradig (6-7 Symptome), schwer (8-9\n               Symptome)\n\n\n\n\n\nStörung durch Glücksspielen                                                  Ja     Nein\nDauerhaftes, häufig auftretendes problematisches Glücksspielen führt zu\nBeeinträchtigungen oder Leiden, mind. 4 Symptome\nDauer: mind. 12 Monate\n\n\n\n\n51                     Copyright © 2017 Margraf & Cwik"},{"page":52,"name":"p52","pdfPage":27,"side":1,"text":"        STÖRUNG DURCH GLÜCKSSPIELEN (SGS)\n\nTreffen die folgenden Dinge für Ihr Glücksspielverhalten zu?\n\nDenken Sie häufig an Glücksspiele?                                   JA____ NEIN____\n\nSpielen Sie um immer höhere Geldbeträge, um so einen gewünschten\nZustand zu erreichen oder um Verluste auszugleichen?                    JA____ NEIN____\n\nVersuchten Sie schon einmal Ihr Glücksspielverhalten zu reduzieren/kontrollieren\noder waren Sie unruhig/nervos, wenn Sie an eine Reduktion dachten?         JA____ NEIN____\n\nBelügen Sie andere über Ihr Glücksspielverhalten oder hatten deswegen schon\nAuseinandersetzungen mit anderen?                                  JA____ NEIN____\n\nSpielen Sie, um mit belastenden Gefühlen besser zu rechtzukommen?         JA____ NEIN____\n\nDenken Sie, dass Ihr Glücksspielverhalten zu finanziellen Schwierigkeiten\nführen könnte?                                                   JA____ NEIN____\n\nHaben Sie dieses Glücksspielverhalten und die beschriebenen Symptome über einen Zeitraum von\nmindestens 12 Monaten bei sich beobachtet?\n                                                              JA____ NEIN____\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        52"},{"page":53,"name":"p53","pdfPage":28,"side":0,"text":"Störung durch Spielen von Internetspielen\n\nHauptmerkmal:  Andauerndes und wiederholtes ausgeprägter Gebrauch von Internetspielen\nNotwendig:      Mindestens 5 von 9 Symptomen\nDauer:          Mindestens 12 Monate\nBestimme, ob:   Schweregrad: leicht (Erfüllung weniger und leichtere Symptome und weniger\n                   Beeinträchtigung), mittelgradig (ausgeprägte Symptome, stundenweises\n                   Spielverhalten, deutliche Beeinträchtigungen in sozialen Beziehungen, Beruf oder\n                   Schule), schwer (mehr und schwerer ausgeprägte Symptome, Spielverhalten über\n                    viele Stunden, schwere Beeinträchtigungen in sozialen Beziehungen, Beruf oder\n                  Schule)\n\n\n\n\n\nStörung durch Spielen von Internetspielen                                      Ja     Nein\nDauerhafte, wiederkehrende Nutzung des Internets, um Spiele zu spielen, führt zu\nBeeinträchtigung oder Leiden, mind. 5 Symptome\n\n\n\n53                     Copyright © 2017 Margraf & Cwik"},{"page":54,"name":"p54","pdfPage":28,"side":1,"text":"   STÖRUNG DURCH SPIELEN VON INTERNETSPIELEN (SSI)\n\nTreffen die folgenden Dinge für Ihr Internetspielverhalten zu?\n\nDenken Sie häufig an Internetspiele?                                  JA____ NEIN____\n\nFühlen Sie sich schlecht, wenn Sie nicht spielen können oder spielen Sie, um\nmit belastenden Gefühlen besser zu rechtzukommen?                     JA____ NEIN____\n\nSpielen Sie immer länger oder haben Sie Probleme Ihr Spielverhalten zu\nreduzieren/kontrollieren?                                           JA____ NEIN____\n\nHaben Sie Konflikte (beruflich oder privat) aufgrund des Spielverhaltens oder\nhaben Sie Ihnen wichtige Tätigkeiten oder Personen vernachlässigt?         JA____ NEIN____\n\nBelügen Sie andere über Ihr Spielverhalten?                            JA____ NEIN____\n\nHaben Sie dieses Internetspielverhalten und die beschriebenen Symptome über\neinen Zeitraum von mindestens 12 Monaten bei sich beobachtet?            JA____ NEIN____\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        54"},{"page":55,"name":"p55","pdfPage":29,"side":0,"text":"55                     Copyright © 2017 Margraf & Cwik"},{"page":56,"name":"p56","pdfPage":29,"side":1,"text":"        SCREENING: SCHLAFSTÖRUNGSSPEKTRUM\n\nIch möchte Ihnen nun einige Fragen zu Ihrem Schlaf stellen:\n\nAllgemeine Fragen zum Schlaf:\nGehen Sie regelmäßig zur gleichen Zeit schlafen?                  JA ____ NEIN ____\n\nWann gehen Sie normalerweise zu Bett?  _________________\n\nWann stehen Sie normalerweise auf?  _________________\n\nWie lange schlafen Sie normalerweise pro Nacht?\nEffektive Schlafzeit pro Nacht (Stunden): _________________\n\n\nINS:    Haben Sie andauernd Beschwerden wegen schlechtem Schlaf? Kam das früher vor?\n\n                                                    JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 58\n\nHYS:   Sind Sie oft sehr müde oder schlafen mehr als gewohnt? Kam das früher vor?\n\n                                                    JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 60\n\n\n\n                Falls NEIN, weiter zu SCREENING: IMPULSKONTROLLE (S. 62)\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        56"},{"page":57,"name":"p57","pdfPage":30,"side":0,"text":"Insomnie (F51.01)\n\nHauptmerkmal:  Andauernde Unzufriedenheit mit der Schlafqualität- oder quantität\nNotwendig:      Mindestens 1 der nebenstehenden 3 Symptome in mindestens 3 Nächten pro\n              Woche\nDauer:          Mindestens 3 Monate\nWichtig:         Deutliche Belastungen oder Beeinträchtigungen bei kognitiven, sozialen,\n                   beruflichen oder anderen wichtigen Funktionsbereichen durch die Schlafprobleme\nHäufig:          Frauen häufiger als Männer, insbesondere in Verbindung mit Geburt eines Kindes\n                 oder höheren Alters (Achtung: Studien deuteten bei älteren Frauen auf eine\n                  bessere Schlafeffektivität hin)\nAbgrenzung:     Schlafprobleme können im Rahmen verschiedener alltäglicher Belastungen\n                    auftreten, wie z. B. bei Schichtarbeit\n                 Restless-Legs-Syndrom: Drang die Beine zu bewegen und unangenehme\n                  Sensationen in den Beinen\n               Atmungsbezogene Schlafstörung: Lautes Schnarchen, Atempausen und\n                  ausgeprägte Schläfrigkeit während des Tages\n                 Narkolepsie: Ausgeprägte Schläfrigkeit während des Tages, Kataplexie,\n                  Schlafparalyse und schlafbezogenen Halluzinationen\n                Parasomnie: Ungewöhnliche Verhaltensweisen oder Ereignisse während des\n                   Schlafs, die zu Schlafunterbrechungen führen\nBestimme, ob:   Mit Komorbidität zu einer anderen nicht schlafbezogenen psychischen\n                Störung: Insomnie tritt zusammen mit einer anderen psychischen Störung auf\n               Mit Komorbidität zu einer medizinischen Störung: Insomnie tritt zusammen mit\n                   einer körperlichen Erkrankung auf\n               Mit anderer Schlafstörung: Insomnie tritt zusammen mit einer anderen\n                   Schlafstöriung auf\n                 Episodisch; Die Symptome dauern mindestens 1 Monat aber weniger als 3 Monate\n                 an\n               Andauernd: Die Symptome dauern mindestens 3 Monate an\n               Wiederkehrend: Mindestens 2 Episoden innerhalb des selben Jahres\n\n\n\n\n\nInsomnie                                                                   Ja     Nein\nUnzufriedenheit mit Schlafqualität oder –quantität, mind. 1 Symptom\nLeiden oder Beeinträchtigungen\nDauer: mind. 3 Nächte pro Woche, mind. 3 Monate\nTrotz adequater Gelegeneheit zu schlafen\n\n\n57                     Copyright © 2017 Margraf & Cwik"},{"page":58,"name":"p58","pdfPage":30,"side":1,"text":"                   INSOMNIE (INS)\n\nTreffen die folgenden Dinge in Bezug auf Ihre Schlafprobleme zu?\n\n... können Sie schlecht einschlafen?                                   JA____ NEIN____\n\n... haben Sie Durchschlafprobleme?                                   JA____ NEIN____\n\n... wachen Sie morgens früh auf, ohne wieder einschlafen zu können?         JA____ NEIN____\n\nWie häufig pro Woche leiden Sie unter diesen Schlafproblemen?  NÄCHTE/WOCHE: __________\n\nSeit wann leiden Sie unter diesen Schlafproblemen?          MONATE: __________\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        58"},{"page":59,"name":"p59","pdfPage":31,"side":0,"text":"Hypersomnie (F51.11)\n\nHauptmerkmal:  Selbstberichtete ausgeprägte Schläfrigkeit, trotz einer mindestens 7 Stunden\n                 andauernden Schlafphase\nNotwendig:      Mindestens 1 der nebenstehenden 3 Symptome in mindestens 3 Nächten pro\n              Woche\nDauer:          Mindestens 3 Monate\nWichtig:         Deutliche Belastungen oder Beeinträchtigungen bei kognitiven, sozialen,\n                   beruflichen oder anderen wichtigen Funktionsbereichen durch die Schlafprobleme\nAbgrenzung:     Schlafprobleme können im Rahmen verschiedener alltäglicher Belastungen\n                    auftreten, wie z. B. bei Schichtarbeit\n               Atmungsbezogene Schlafstörung: Lautes Schnarchen, Atempausen und\n                  ausgeprägte Schläfrigkeit während des Tages\n                Parasomnie: Ungewöhnliche Verhaltensweisen oder Ereignisse während des\n                   Schlafs, die zu Schlafunterbrechungen führen\nBestimme, ob:   Mit Komorbidität zu einer anderen psychischen Störung: Insomnie tritt\n              zusammen mit einer anderen psychischen Störung auf\n               Mit Komorbidität zu einer medizinischen Störung: Insomnie tritt zusammen mit\n                   einer körperlichen Erkrankung auf\n               Mit anderer Schlafstörung: Insomnie tritt zusammen mit einer anderen\n                   Schlafstöriung auf\n\n               Akut: Weniger als 1 Monat\n                Subakut: Dauer 1-3 Monate\n               Andauernd: Dauer mehr als 3 Monate\n\n                Schweregrad: Leicht (Schlafprobleme an 1-2 Tagen/Woche), mittelgradig\n                 (Schlafprobleme an 3-4 Tagen/Woche), schwer (Schlafprobleme an 5-7\n                Tagen/Woche)\n\n\n\n\n\n  Hypersomnie                                                               Ja     Nein\n  Übermäßige Schläfrigkeit, mind. 1 Symptom\n  Dauer: mind. 3 mal pro Woche, mind. 3 Monate\n  Leiden oder Beeinträchtigungen\n\n\n\n59                     Copyright © 2017 Margraf & Cwik"},{"page":60,"name":"p60","pdfPage":31,"side":1,"text":"                HYPERSOMNIE (HYS)\n\nTreffen die folgenden Dinge in Bezug auf Ihre Schlafprobleme zu?\n\n... mehrfaches Einschlafen an einem Tag?                              JA____ NEIN____\n... lange Schlafphasen von mehr als 9 Stunden pro Tag, ohne sich erholt zu\nfühlen?                                                         JA____ NEIN____\n\n... Schwierigkeiten wach zu bleiben, nachdem Sie geweckt wurden?          JA____ NEIN____\n\nWie häufig pro Woche leiden Sie unter diesen Schlafproblemen?  NÄCHTE/WOCHE: __________\n\nSeit wann leiden Sie unter diesen Schlafproblemen?          MONATE: __________\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        60"},{"page":61,"name":"p61","pdfPage":32,"side":0,"text":"61                     Copyright © 2017 Margraf & Cwik"},{"page":62,"name":"p62","pdfPage":32,"side":1,"text":"            SCREENING: IMPULSKONTROLLE\n\nVerspüren Sie wiederholt einen Drang, Impuls, Trieb oder eine Versuchung, bestimmte Handlungen\nauszuführen, die schädlich für Sie oder andere sein könnten (z. B. Feuer legen, Stehlen, Kaufimpulse)?\n\n                                                           JA ____ NEIN ____\n\nBevor Sie diese Handlungen ausführen, haben Sie dann ein gesteigertes Gefühl von Anspannung oder\nErregung?\n                                                           JA ____ NEIN ____\n\nErleben Sie Vergnügen, Befriedigung oder Entspannung, während der Ausführung dieser\nHandlungen?\n                                                           JA ____ NEIN ____\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        62"},{"page":63,"name":"p63","pdfPage":33,"side":0,"text":"63                     Copyright © 2017 Margraf & Cwik"},{"page":64,"name":"p64","pdfPage":33,"side":1,"text":"      SCREENING: SEXUELLER FUNKTIONSSTÖRUNGEN\n\nHaben Sie Probleme oder Schwierigkeiten mit Ihrer Sexualität?\n                                                               JA____ NEIN____\n\n                      Falls NEIN, weiter zu PSYCHOSE-SCREENING (S. 66)\n\nWelche der folgenden Dinge treffen auf Ihre sexuellen Schwierigkeiten zu:\n... Verlust sexueller Phantasien oder sexuellen Verlangens?                JA____ NEIN____\n\n... extreme Abneigung gegenüber und Vermeidung von Geschlechtskontakt?    JA____ NEIN____\n\n... Unfähigkeit, eine zufriedenstellende Erregung zu erlangen oder aufrecht\nzu halten?                                                      JA____ NEIN____\n\n... Verzögerung oder Fehlen des Orgasmus nach sexueller Erregung?         JA____ NEIN____\n\n... genitale Schmerzen beim Geschlechtsverkehr?                        JA____ NEIN____\n\nBei Männern:\n... unerwünschter vorzeitiger Samenerguss?                            JA____ NEIN____\n\nSeit wann treten diese sexuellen Probleme auf:\n\nLEBENSLANG____\n\nERWORBEN____\n\nFalls erworben, beschreiben:\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\nFalls erworben:\nTraten diese Probleme nach einer bestimmten Erfahrung auf?\n                                                              JA____ NEIN____\nFalls JA, Erfahrung beschreiben:\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        64"},{"page":65,"name":"p65","pdfPage":34,"side":0,"text":"65                     Copyright © 2017 Margraf & Cwik"},{"page":66,"name":"p66","pdfPage":34,"side":1,"text":"                PSYCHOSE-SCREENING\n\nHinweise zur Diagnostik der Psychosen\n\nEine  ausreichende  Diagnostik  psychotischer  Störungen   ist  durch  diese  Screening-Fragen\nselbstverständlich   nicht   gegeben.   Falls   Hinweise   aufgrund   dieser   Fragen   oder   der\nBehandlungsgeschichte  vorliegen,  sollten  die entsprechenden Abschnitte eines dafür geeigneten\nstrukturierten Interviews (z. B. SKID, Wittchen et al., 1997) durchgeführt werden.\n\n\nHat es schon einmal eine Zeit gegeben, in der Sie eigenartige oder ungewöhnliche Erfahrungen\ngemacht haben, wie zum Beispiel:\n\n... Hören oder Sehen von Dingen, die andere Menschen nicht bemerkt haben?  JA____ NEIN____\n\n... Hören von Stimmen oder Gesprächen, wenn niemand in Ihrer Nähe gewesen ist?\n\n                                                               JA____ NEIN____\n\n... Das Gefühl gehabt, dass etwas Eigenartiges um Sie herum vorging, dass Menschen Dinge taten,\num Sie zu testen oder Ihnen zu schaden, sodass Sie das Gefühl hatten, ständig aufpassen zu müssen?\n\n                                                               JA____ NEIN____\n\nHatten Menschen Schwierigkeiten, Sie zu verstehen, weil Ihre Sprache so durcheinander war, oder\nweil die Art und Weise, in der Sie sprachen, keinen Sinn machte?\n                                                               JA____ NEIN____\n\nFalls JA bei einer der obrigen Fragen, beschreiben:\n\n Beschreiben: _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        66"},{"page":67,"name":"p67","pdfPage":35,"side":0,"text":"67                     Copyright © 2017 Margraf & Cwik"},{"page":68,"name":"p68","pdfPage":35,"side":1,"text":"                   SUIZID-SCREENING\n\nNun wurde ich Ihnen gerne einige Fragen stellen, die Gedanken, Plänen oder Versuche betreffen,\nsich das Leben zu nehmen.\n\nDenken Sie derzeit daran, lieber tot sein zu wollen?                     JA ____ NEIN ____\n\nDenken Sie in der letzten Zeit daran, sich das Leben zu nehmen?            JA ____ NEIN ____\n\n\n\nWie oft treten diese Gedanken auf (pro Tag, Woche, Monat)?\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\nHaben Sie Pläne, wie Sie sich das Leben nehmen wollen?                 JA ____ NEIN ____\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\nHaben Sie bereits Dinge ausprobiert (z. B. einen in Frage kommenden Ort aufgesucht, Seil bereit\ngelegt, Medikamentenmix zusammengestellt)?\n\n                                                           JA ____ NEIN ____\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\nHaben Sie sich schon einmal selbst verletzt, ohne dabei zu beabsichtigen, sich das Leben zu nehmen?\n\n                                                           JA ____ NEIN ____\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\nHaben Sie schon einmal versucht, sich das Leben zu?                    JA ____ NEIN ____\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\nHaben Sie das Gefühl zu einem Suizid fähig zu sein (unabhängig davon, ob Sie jemals darüber\nnachdachten sich das Leben zu nehmen)?\n\n                                                           JA ____ NEIN ____\n\n\n                       Copyright © 2017 Margraf & Cwik                        68"},{"page":69,"name":"p69","pdfPage":36,"side":0,"text":"69                     Copyright © 2017 Margraf & Cwik"},{"page":70,"name":"p70","pdfPage":36,"side":1,"text":"               ABSCHLIESSENDE FRAGEN\n\nWurden Sie jemals wegen emotionaler oder psychischer Beschwerden, Alkohol- oder\nSubstanzgebrauch oder ähnlicher Probleme behandelt oder in eine Klinik eingewiesen?\n\n                                                              JA____ NEIN____\n\nFalls JA: Zeitraum, Diagnose, Art der Einrichtung und der Behandlung feststellen.\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\nGibt es irgendetwas anderes, was ich nicht gefragt habe, was aber noch wichtig wäre hier zu nennen?\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\nWas ist das Hauptproblem, für das Sie Hilfe suchen? Was ist die Hauptveränderung, die Sie machen\nmöchten?\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\n\n\n\n       SONSTIGE ANMERKUNGEN/BESONDERHEITEN\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        70"},{"page":71,"name":"p71","pdfPage":37,"side":0,"text":"    Klinische Einschätzungen und Diagnosen (Mini-DIPS Open Access)\n\n\n                                    leicht                        mäßig                         ausgeprägt                       schwer\n0           1           2           3           4           5           6           7           8\n                               leicht störend/                        deutlich                         stark störend/                       sehr stark\n                             nicht wirklich                         störend/                       behindernd                          störend/\n                                                           behindernd                                                     behindernd\n   SUBKLINISCHER BEREICH                     KLINISCHER BEREICH\n\n\n Aktuelle Diagnosen\n\n           Primäre Diagnose\n\n         _________________________________________________________________________________\n\n         _________________________________________________________________________________\n\n           Zusätzliche Diagnosen\n\n         _________________________________________________________________________________\n\n         _________________________________________________________________________________\n\n         _________________________________________________________________________________\n\n         _________________________________________________________________________________\n\n         _________________________________________________________________________________\n\n\n Frühere Diagnosen\n\n Diagnose                                                       Beginn        Remission\n _____________________________________________________        ___________  ___________\n\n _____________________________________________________        ___________  ___________\n\n _____________________________________________________        ___________  ___________\n\n _____________________________________________________        ___________  ___________\n\n Weitere Angaben\n\n         ___________________________________________________________________\n\n         _________________________________________________________________ <script>(function(root){
  "use strict";
  const isAnswer = v => v !== undefined && v !== null && v !== "";
  const positive = v => ["yes","current","past","both"].includes(v);
  function test(c,a,state={}){
    if(!c) return true;
    const vals=(c.fields||[]).map(k=>a[k]);
    switch(c.op){
      case "eq": return a[c.field]===c.value;
      case "ne": return a[c.field]!==c.value;
      case "and": return c.conditions.every(x=>test(x,a,state));
      case "or": return c.conditions.some(x=>test(x,a,state));
      case "not": return !test(c.condition,a,state);
      case "manual": return state.manual?.[c.section]===true;
      case "notAllNo": return !vals.every(v=>v==="no");
      case "allNo": return vals.length>0 && vals.every(v=>v==="no");
      case "positive": return positive(a[c.field]);
      case "countYesLess": return vals.length>0 && vals.every(v=>v==="yes"||v==="no") && vals.filter(v=>v==="yes").length<c.value;
      default: throw new Error("Unbekannte Bedingung: "+c.op);
    }
  }
  const enabled=(s,state)=>!!state.manual?.[s.id]||test(s.when,state.answers,state);
  function cutoff(s,state){
    return (s.rules||[]).filter(r=>test(r.condition,state.answers)).sort((a,b)=>s.blocks.findIndex(q=>q.id===a.after)-s.blocks.findIndex(q=>q.id===b.after))[0]||null;
  }
  function blocks(s,state){
    if(!enabled(s,state)) return [];
    const cut=cutoff(s,state);
    const end=cut?s.blocks.findIndex(b=>b.id===cut.after):s.blocks.length-1;
    return s.blocks.filter((b,i)=>i<=end && test(b.when,state.answers));
  }
  function activeIds(data,state){
    const ids=new Set();
    for(const s of data.sections) {
      if(!enabled(s,state))continue;
      blocks(s,state).forEach(b=>ids.add(b.id));
      (s.criteria||[]).filter(g=>test(g.when,state.answers)).flatMap(g=>g.items).forEach(b=>ids.add(b.id));
    }
    return ids;
  }
  const required=b=>["yn","screen","choice"].includes(b.type)&&b.required!==false;
  function missing(s,state){return blocks(s,state).filter(b=>required(b)&&!isAnswer(state.answers[b.id]));}
  function route(data,state){return data.sections.filter(s=>enabled(s,state));}
  function next(data,state,id,dir=1){
    const index=data.sections.findIndex(s=>s.id===id);
    if(dir>0&&index>=0&&enabled(data.sections[index],state)){
      const cut=cutoff(data.sections[index],state);
      if(cut?.target&&data.sections.some(s=>s.id===cut.target))return cut.target;
    }
    for(let i=index+dir;i>=0&&i<data.sections.length;i+=dir)if(enabled(data.sections[i],state))return data.sections[i].id;
    return dir>0?"report":"home";
  }
  function setAnswer(data,state,id,value){
    const old=state.answers[id];
    if(old===value)return [];
    const before=activeIds(data,state);
    state.answers[id]=value;
    const after=activeIds(data,state);
    const removed=[];
    const stamp=new Date().toISOString();
    const changedSections=new Set();
    for(const s of data.sections){
      if((s.dependsOn||[]).includes(id))changedSections.add(s.id);
      if(!enabled(s,state))changedSections.add(s.id);
    }
    const drop=new Set([...before].filter(k=>!after.has(k)));
    for(const s of data.sections){
      const criterionFields=(s.criteria||[]).flatMap(g=>g.items);
      if(changedSections.has(s.id)){
        [...s.blocks,...criterionFields].forEach(b=>drop.add(b.id));
        delete state.assessments[s.id];delete state.notes[s.id];delete state.done[s.id];
      }
      const ownsInterview=s.blocks.some(b=>b.id===id);
      const ownsCriterion=criterionFields.some(b=>b.id===id);
      if(ownsInterview)criterionFields.forEach(b=>drop.add(b.id));
      if(ownsInterview||ownsCriterion||s.blocks.some(b=>drop.has(b.id))) {
        delete state.done[s.id];
        delete state.assessments[s.id];
      }
    }
    for(const key of drop)if(key!==id&&isAnswer(state.answers[key])){
      removed.push({id:key,value:state.answers[key]});
      delete state.answers[key];
    }
    const invalidatedEpisodes=(state.episodes||[]).filter(ep=>changedSections.has(ep.section));
    state.episodes=(state.episodes||[]).filter(ep=>!changedSections.has(ep.section));
    state.audit.push({at:stamp,field:id,from:old??null,to:value,invalidated:removed,invalidatedEpisodes});
    return removed;
  }
  function fresh(){return {schema:"screen-time-one/2.0",sourceVersion:"Mini-DIPS OA 2017, 2. Auflage",answers:{},assessments:{},notes:{},manual:{},done:{},audit:[],episodes:[],position:"home",caseId:"",created:new Date().toISOString()};}
  const api={test,enabled,cutoff,blocks,activeIds,missing,route,next,setAnswer,fresh,isAnswer,positive,required};
  if(typeof module!=="undefined")module.exports=api;
  root.MiniEngine=api;
})(typeof window!=="undefined"?window:globalThis);
</script>

  const page=DATA.pages.find(p=>p.page===n);
  if(!page)return;
  el("sourceTitle").textContent=`Originalvorlage · gedruckte Seite ${n}`;
  el("sourceContent").innerHTML=`<p class="hint">PDF-Dateiseite ${page.pdfPage}; ${page.side===0?"linke":"rechte"} Hälfte. Der Auszug unten normalisiert nur die Darstellung. Für das unveränderte Layout dient das Seitenbild.</p><div class="source-switches"><button class="ghost" id="showPageImage">Original-Seitenbild anzeigen</button><button class="outline" id="downloadPDF">Original-PDF öffnen</button></div><div id="pageImage"></div><pre>${esc(page.text)}</pre>`;
  el("showPageImage").onclick=()=>{el("pageImage").innerHTML=`<img class="source-image" src="${DATA.images?.[n]||`pages/p${String(n).padStart(2,"0")}.webp`}" alt="Unverändertes Seitenbild der gedruckten Originalseite ${n}">`;};
  el("downloadPDF").onclick=()=>{
    if(DATA.pdfBase64){const bytes=Uint8Array.from(atob(DATA.pdfBase64),c=>c.charCodeAt(0));download("Mini-DIPS-Open-Access-1.pdf",bytes,"application/pdf");}
    else window.open("Mini-DIPS-Open-Access-1.pdf#page="+page.pdfPage,"_blank","noopener");
  };
  el("sourceDialog").showModal();
}
function showRules(){
  el("sourceTitle").textContent="Sprungregeln und Umsetzungsentscheidungen";
  el("sourceContent").innerHTML=`<p class="hint">Die ursprünglichen Sprunganweisungen bleiben sichtbar. Wo die PDF nur eine freie Beschreibung vorsieht, muss die Fachperson ein zusätzlich gekennzeichnetes Steuerfeld beantworten. „Unklar“ führt nicht zu einem Ausschluss.</p>${DATA.routingNotes.map(r=>`<div class="report-row"><strong>Originalseite ${r.page}</strong><p>${esc(r.text)}</p><p class="hint">${esc(r.suggestion||"")}</p></div>`).join("")}`;
  el("sourceDialog").showModal();
}
function archiveEpisode(s){
  const answers={};
  for(const b of [...s.blocks,...(s.criteria||[]).flatMap(g=>g.items)]){
    if(E.isAnswer(state.answers[b.id]))answers[b.id]=state.answers[b.id];
    delete state.answers[b.id];
  }
  state.episodes??=[];
  state.episodes.push({section:s.id,at:new Date().toISOString(),answers,assessment:state.assessments[s.id]||{},note:state.notes[s.id]||""});
  delete state.assessments[s.id];delete state.notes[s.id];delete state.done[s.id];
  state.audit.push({at:new Date().toISOString(),field:"episode:"+s.id,from:null,to:"Abklärung gesichert; neue Abklärung begonnen"});
  persist();
}
function validateState(raw){
  if(!raw||raw.schema!=="screen-time-one/2.0")throw new Error("Nur Sicherungen der wortgetreuen Version 2.0 werden unterstützt.");
  if(raw.contentHash&&raw.contentHash!==DATA.contentHash)throw new Error("Die Sicherung gehört zu einem anderen Inhaltsstand.");
  const s=E.fresh(),fields=new Map(DATA.sections.flatMap(sec=>[...sec.blocks,...(sec.criteria||[]).flatMap(g=>g.items)]).map(b=>[b.id,b]));
  for(const [key,value]of Object.entries(raw.answers||{})){
    if(key==="_timeline"){
      if(!Array.isArray(value)||value.length>500)throw new Error("Ungültiger Verlauf.");
      s.answers[key]=value.map(r=>{if(!r||typeof r!=="object"||!Number.isFinite(Number(r.mood))||Number(r.mood)<-4||Number(r.mood)>4)throw new Error("Ungültiger Verlaufswert.");return {date:String(r.date??"").slice(0,100),event:String(r.event??"").slice(0,10000),mood:r.mood};});continue;
    }
    const b=fields.get(key);if(!b)continue;
    if(!["string","number"].includes(typeof value))throw new Error("Ungültiger Antworttyp bei "+key);
    const str=String(value);if(str.length>100000)throw new Error("Antwort zu lang.");
    if(["yn","screen","choice"].includes(b.type)&&str!==""&&!optionsFor(b).some(o=>o[0]===str))throw new Error("Ungültige Auswahl bei "+key);
    if(b.type==="number"&&str!==""&&(!Number.isFinite(Number(str))||(b.min!==undefined&&Number(str)<b.min)||(b.max!==undefined&&Number(str)>b.max)))throw new Error("Ungültige Zahl bei "+key);
    s.answers[key]=str;
  }
  for(const sec of DATA.sections){
    if(raw.manual?.[sec.id]===true)s.manual[sec.id]=true;
    if(raw.done?.[sec.id]===true)s.done[sec.id]=true;
    if(typeof raw.notes?.[sec.id]==="string")s.notes[sec.id]=raw.notes[sec.id].slice(0,100000);
    const a=raw.assessments?.[sec.id];
    if(a&&typeof a==="object"){
      s.assessments[sec.id]={};
      for(const key of ["rating","timing","severity"])if(["string","number"].includes(typeof a[key]))s.assessments[sec.id][key]=String(a[key]).slice(0,500);
      if(a.rating!==undefined&&a.rating!==""&&!RATINGS.includes(a.rating))throw new Error("Ungültige klinische Beurteilung.");
      if(a.timing!==undefined&&a.timing!==""&&!TIMINGS.includes(a.timing))throw new Error("Ungültiger Zeitbezug.");
      if(s.assessments[sec.id].severity!==undefined&&s.assessments[sec.id].severity!==""&&(!Number.isInteger(Number(a.severity))||Number(a.severity)<0||Number(a.severity)>8))throw new Error("Schweregrad außerhalb 0–8.");
    }
  }
  const safeScalar=v=>v===null||v===undefined?null:(typeof v==="string"?v.slice(0,100000):["number","boolean"].includes(typeof v)?v:JSON.stringify(v).slice(0,100000));
  s.audit=Array.isArray(raw.audit)?raw.audit.slice(-50000).filter(x=>x&&typeof x==="object").map(x=>({
    at:typeof x.at==="string"?x.at:"",field:typeof x.field==="string"?x.field:"",
    from:safeScalar(x.from),to:safeScalar(x.to),...(typeof x.reason==="string"?{reason:x.reason}:{}),
    invalidated:Array.isArray(x.invalidated)?x.invalidated.filter(v=>v&&typeof v.id==="string").map(v=>({id:v.id,value:safeScalar(v.value)})):[],
    invalidatedEpisodes:Array.isArray(x.invalidatedEpisodes)?x.invalidatedEpisodes:[]
  })):[];
  s.episodes=[];
  for(const ep of Array.isArray(raw.episodes)?raw.episodes.slice(0,500):[]){
    if(!ep||!["p32","p34"].includes(ep.section)||!E.enabled(sectionById(ep.section),s))continue;
    const allowed=sectionById(ep.section),clean={section:ep.section,at:String(ep.at||""),answers:{},assessment:{},note:String(ep.note||"").slice(0,100000)};
    for(const b of [...allowed.blocks,...(allowed.criteria||[]).flatMap(g=>g.items)]){
      const v=ep.answers?.[b.id];if(v===undefined)continue;
      if(typeof v!=="string"&&typeof v!=="number")throw new Error("Ungültige Ereignisantwort.");
      if(["yn","screen","choice"].includes(b.type)&&v!==""&&!optionsFor(b).some(o=>o[0]===v))throw new Error("Ungültige Auswahl in Ereignisabklärung.");
      if(b.type==="number"&&v!==""&&(!Number.isFinite(Number(v))||Number(v)<0))throw new Error("Ungültige Zahl in Ereignisabklärung.");
      clean.answers[b.id]=String(v).slice(0,100000);
    }
    for(const key of ["rating","timing","severity"])if(ep.assessment?.[key]!==undefined)clean.assessment[key]=String(ep.assessment[key]).slice(0,500);
    if(clean.assessment.rating!==undefined&&clean.assessment.rating!==""&&!RATINGS.includes(clean.assessment.rating))throw new Error("Ungültige klinische Beurteilung in Ereignisabklärung.");
    if(clean.assessment.timing!==undefined&&clean.assessment.timing!==""&&!TIMINGS.includes(clean.assessment.timing))throw new Error("Ungültiger Zeitbezug in Ereignisabklärung.");
    if(clean.assessment.severity!==undefined&&clean.assessment.severity!==""&&(!Number.isInteger(Number(clean.assessment.severity))||Number(clean.assessment.severity)<0||Number(clean.assessment.severity)>8))throw new Error("Ungültiger Schweregrad in Ereignisabklärung.");
    s.episodes.push(clean);
  }
  s.caseId=String(raw.caseId??"").slice(0,500);
  s.created=typeof raw.created==="string"?raw.created:s.created;
  s.position=["home","report",...DATA.sections.map(s=>s.id)].includes(raw.position)?raw.position:"home";
  const active=E.activeIds(DATA,s);
  const removedIds=[];
  for(const key of Object.keys(s.answers))if(key!=="_timeline"&&!active.has(key)){removedIds.push(key);delete s.answers[key];}
  for(const sec of DATA.sections){
    if([...sec.blocks,...(sec.criteria||[]).flatMap(g=>g.items)].some(b=>removedIds.includes(b.id))){
      for(const b of (sec.criteria||[]).flatMap(g=>g.items))delete s.answers[b.id];
      delete s.assessments[sec.id];delete s.done[sec.id];
    }
    if(E.missing(sec,s).length)delete s.done[sec.id];
  }
  for(const sec of DATA.sections)if(!E.enabled(sec,s)){delete s.assessments[sec.id];delete s.notes[sec.id];delete s.done[sec.id];}
  return s;
}
function exportData(){
  return {...state,contentHash:DATA.contentHash,exported:new Date().toISOString(),source:"Margraf & Cwik (2017), Mini-DIPS Open Access, 2. Auflage",activeRoute:E.route(DATA,state).map(s=>s.id)};
}
function csv(){
  const rows=[["Fallkennung","Seite","Kapitel","Feld-ID","Originaltext","Antwort","Status","Zeitbezug","Manuelle Beurteilung","Schweregrad 0-8","Notiz"]];
  for(const s of DATA.sections){
    const enabled=E.enabled(s,state),ids=E.activeIds(DATA,state),a=state.assessments[s.id]||{};
    for(const b of [...s.blocks,...(s.criteria||[]).flatMap(g=>g.items)].filter(b=>b.type!=="info")){
      const inactive=!enabled||!ids.has(b.id);
      rows.push([state.caseId,s.page,s.title,b.id,b.text,inactive?"":E.isAnswer(state.answers[b.id])?answerLabel(state.answers[b.id]):"",inactive?"Durch Sprungregel nicht erhoben":E.isAnswer(state.answers[b.id])?(state.answers[b.id]==="unknown"?"Unklar":"Dokumentiert"):"Nicht beantwortet",enabled?a.timing||"":"",enabled?a.rating||"":"",enabled?a.severity??"":"",enabled?state.notes[s.id]||"":""]);
    }
  }
  for(const [i,ep] of (state.episodes||[]).entries()){
    const s=sectionById(ep.section);
    for(const [id,v]of Object.entries(ep.answers)){const b=fieldById(id);rows.push([state.caseId,s.page,s.title+" · gesichertes Ereignis "+(i+1),id,b?.text||b?.inputLabel||"",answerLabel(v),"Gesicherte Ereignisabklärung",ep.assessment?.timing||"",ep.assessment?.rating||"",ep.assessment?.severity??"",ep.note||""]);}
  }
  const safe=v=>{let t=String(v??"");if(/^\s*[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';};
  return "\uFEFF"+rows.map(r=>r.map(safe).join(";")).join("\r\n");
}
function download(name,body,type){
  const url=URL.createObjectURL(new Blob([body],{type}));const a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
}
function runAction(action){
  if(action==="json")download("screen-time-one-befragung.json",JSON.stringify(exportData(),null,2),"application/json");
  if(action==="csv")download("screen-time-one-protokoll.csv",csv(),"text/csv;charset=utf-8");
  if(action==="print"){if(state.position!=="report")navigate("report");window.print();}
}
el("btnPrev").onclick=()=>navigate(state.position==="report"?"p71":E.next(DATA,state,state.position,-1));
el("btnNext").onclick=()=>{
  if(state.position==="home")return navigate("p01");
  if(state.position==="report")return navigate("p71");
  const s=sectionById(state.position),missing=E.missing(s,state);
  if(missing.length){
    el("validation").textContent=`Bitte noch ${missing.length} Auswahlantwort${missing.length===1?"":"en"} geben. „Unklar“ ist möglich und wird nicht als „Nein“ behandelt.`;
    document.querySelectorAll(".field-error").forEach(x=>x.classList.remove("field-error"));
    missing.forEach(b=>el("q_"+b.id)?.classList.add("field-error"));
    el("q_"+missing[0].id)?.scrollIntoView({block:"center",behavior:"smooth"});
    el("q_"+missing[0].id)?.querySelector("input")?.focus({preventScroll:true});return;
  }
  if(E.enabled(s,state))state.done[s.id]=true;
  if(s.id==="p32"&&state.answers._trauma_further==="Weiteres Trauma: gesonderte akute Abklärung erforderlich"){archiveEpisode(s);navigate("p32");toast("Akutes Ereignis gesichert. Weitere akute Abklärung geöffnet.");return;}
  navigate(E.next(DATA,state,s.id));
};
el("themeToggle").onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";drawTimeline();};
el("menuToggle").onclick=()=>{menuOpen=!menuOpen;el("sidebar").classList.toggle("open",menuOpen);};
el("reportButton").onclick=()=>navigate("report");
el("saveQuick").onclick=()=>runAction("json");
el("closeSource").onclick=()=>el("sourceDialog").close();
document.querySelector(".brand").onclick=e=>{e.preventDefault();navigate("home");};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){menuOpen=false;el("sidebar").classList.remove("open");}});
window.addEventListener("beforeunload",e=>{if(!storage&&Object.keys(state.answers).length){e.preventDefault();e.returnValue="";}});
if("serviceWorker"in navigator&&/^https?:$/.test(location.protocol)&&window.top===window.self)navigator.serviceWorker.register("./sw.js").catch(()=>{});
window.APP_TEST={DATA,E,getState:()=>state,setState:s=>{state=s;render();},navigate,exportData,validateState,csv};
render();
</script>
