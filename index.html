ziale Anamnese"},{"id":"p03","page":3,"title":"Derzeitige Behandlung / Medikation:","kind":"intake","blocks":[{"id":"p03_current_treatment","type":"text","text":"Derzeitige Behandlung / Medikation:","required":false},{"id":"p03_previous_treatment","type":"text","text":"Frühere Behandlungen:","required":false},{"id":"p03_main_problem","type":"text","text":"Wenn ich Sie bitten würde, ein Problem zu benennen, dass Ihrer Meinung nach das Hauptproblem ist, weshalb Sie heute hier sind, was würde Sie mir nennen?","required":false}],"navTitle":"Behandlung & Hauptproblem"},{"id":"p04","page":4,"title":"SCREENING: ANGSTSPEKTRUM","kind":"screen","blocks":[{"id":"p04_intro","type":"info","text":"Ich werde Ihnen nun einige Beispiele nennen und möchte Sie bitten, jeweils zu entscheiden, ob die folgenden Situationen oder Dinge Ihnen Angst machen oder ob Sie diese aus Angst vermeiden:"},{"id":"p04_ps","type":"screen","text":"PS: Gibt es Zeiten, in denen Sie ganz plötzlich einen Ansturm intensiver Angst oder Furcht oder das Gefühl eines drohenden Unglücks haben? Kam das früher vor?","options":["aktuell","früher","beides","nein"]},{"id":"p04_ps_route","type":"info","text":"⎣ S. 6"},{"id":"p04_ag","type":"screen","text":"AG: Gibt es Situationen, in denen Sie Angst haben oder die Sie vermeiden, aus der Befürchtung, Sie könnten sich panisch oder krank fühlen (z. B. Kaufhäuser, Autofahren, Menschenmengen oder enge geschlossene Räume)? Kam das früher vor?","options":["aktuell","früher","beides","nein"]},{"id":"p04_ag_route","type":"info","text":"⎣ S. 8"},{"id":"p04_sas","type":"screen","text":"SAS: Fühlen Sie sich in sozialen Situationen oder Leistungssituationen ängstlich, weil Sie beobachtet oder beurteilt werden können (z. B. öffentliche Vorträge, Prüfungen oder Parties)? Kam das früher vor?","options":["aktuell","früher","beides","nein"]},{"id":"p04_sas_route","type":"info","text":"⎣ S. 10"},{"id":"p04_sp","type":"screen","text":"SP: Fürchten oder vermeiden Sie andere Dinge wie z. B. bestimmte Tiere, Höhen, Flugreisen oder den Anblick von Blut und Verletzungen? Kam das früher vor?","options":["aktuell","früher","beides","nein"]},{"id":"p04_sp_route","type":"info","text":"⎣ S. 12"},{"id":"p04_gas","type":"screen","text":"GAS: Leiden Sie häufig unter unangemessen starken Sorgen, z. B. über familiäre, berufliche oder finanzielle Angelegenheiten? Kam das früher vor?","options":["aktuell","früher","beides","nein"]},{"id":"p04_gas_route","type":"info","text":"⎣ S. 14"},{"id":"p04_positive_domains_instruction","type":"info","text":"Störungsbereiche, für die Angst oder Vermeidung berichtet werden, einzeln abklären."},{"id":"p04_all_no_route","type":"info","text":"Falls alle Bereiche mit NEIN beantwortet werden, weiter zu SCREENING: STIMMUNGSSPEKTRUM (S. 16)"}],"navTitle":"Angstspektrum"},{"id":"p06","page":6,"title":"PANIKSTÖRUNG (PS)","kind":"module","blocks":[{"id":"p06_intro","type":"info","text":"Sie haben von ganz plötzlich auftretender intensiver Angst oder Furcht oder dem Gefühl eines drohenden Unglücks berichtet."},{"id":"p06_situations","type":"text","text":"In welchen Situationen tritt diese plötzliche unerwartete Angst auf? Beschreiben:"},{"id":"p06_peak_minutes","type":"yn","text":"Erreicht diese Angst üblicherweise ihren Höhepunkt innerhalb von Minuten?","options":["JA","NEIN"]},{"id":"p06_peak_no_route","type":"info","text":"(Falls NEIN, weiter zu AGORAPHOBIE)"},{"id":"p06_symptoms_intro","type":"info","text":"Erleben Sie üblicherweise während eines Angstanfalls..."},{"id":"p06_symptom_heart","type":"yn","text":"(1) ... Herzklopfen oder beschleunigten Herzschlag?","options":["JA","NEIN"]},{"id":"p06_symptom_sweating","type":"yn","text":"(2) ... Schwitzen?","options":["JA","NEIN"]},{"id":"p06_symptom_trembling","type":"yn","text":"(3) ... Zittern oder Beben?","options":["JA","NEIN"]},{"id":"p06_symptom_breathlessness","type":"yn","text":"(4) ... ein Gefühl der Kurzatmigkeit oder Atemnot?","options":["JA","NEIN"]},{"id":"p06_symptom_choking","type":"yn","text":"(5) ... Erstickungs- oder Würgegefühle?","options":["JA","NEIN"]},{"id":"p06_symptom_chest","type":"yn","text":"(6) ... Schmerzen oder Beklemmungsgefühle in der Brust?","options":["JA","NEIN"]},{"id":"p06_symptom_nausea","type":"yn","text":"(7) ... Übelkeit oder Magen-Darmbeschwerden?","options":["JA","NEIN"]},{"id":"p06_symptom_dizziness","type":"yn","text":"(8) ... Schwindel, Unsicherheit, Benommenheit oder der Ohnmacht nahe sein?","options":["JA","NEIN"]},{"id":"p06_symptom_unreality","type":"yn","text":"(9) ... ein Gefühl der Unwirklichkeit oder sich losgelöst fühlen?","options":["JA","NEIN"]},{"id":"p06_symptom_losing_control","type":"yn","text":"(10) ... Angst, verrückt zu werden oder etwas Unkontrolliertes zu tun?","options":["JA","NEIN"]},{"id":"p06_symptom_dying","type":"yn","text":"(11) ... Angst zu sterben?","options":["JA","NEIN"]},{"id":"p06_symptom_numbness","type":"yn","text":"(12) ... Taubheit oder Kribbelgefühle?","options":["JA","NEIN"]},{"id":"p06_symptom_hot_cold","type":"yn","text":"(13) ... Hitzewallungen oder Kälteschauer?","options":["JA","NEIN"]},{"id":"p06_symptoms_route","type":"info","text":"(Falls weniger als 4 Symptome, weiter zu AGORAPHOBIE)"},{"id":"p06_time_to_intensity","type":"number","text":"Wie lange dauert es gewöhnlich, bis der Angstanfall ganz intensiv ist?","unit":"Minuten","min":0},{"id":"p06_intensity_instruction","type":"info","text":"(mind. 4 Symptome)"},{"id":"p06_attacks_last_month","type":"number","text":"Wieviele Angstanfälle hatten Sie während des letzten Monats? ANZAHL:","min":0},{"id":"p06_after_attack_intro","type":"info","text":"Folgte auf einen der Angstanfälle mindestens ein Monat mit ..."},{"id":"p06_after_attack_concern","type":"yn","text":"(1) ... anhaltender Besorgnis über das Auftreten weiterer Angstanfälle?","options":["JA","NEIN"]},{"id":"p06_after_attack_consequences","type":"yn","text":"(2) ... Sorgen über die Bedeutung der Attacken oder ihrer Konsequenzen?","options":["JA","NEIN"]},{"id":"p06_after_attack_behavior","type":"yn","text":"(3) ... Verhaltensänderungen, um weitere Angstanfälle zu vermeiden?","options":["JA","NEIN"]}],"reference":"Angst\n\nPhobien: Agoraphobien, Soziale Angststörungen und Spezifische Phobien können sich hinsichtlich\nder phobischen Objekte oder Situationen überlappen.\n\n\nAbgrenzung verschiedener Phobien:\n\n    1.  Das Muster der phobischen Reize (siehe die nebenstehenden Beispiele).\n\n    2.  Die zentralen Befürchtungen (Agoraphobie: Angst vor Angstanfall oder dessen\n       Konsequenzen; Soziale Angststörung: Angst vor negativer Bewertung; Spezifische Phobie:\n       Angst vor unmittelbar vom Objekt augehenden Gefahren.)\n\n\nPanikstörung (F41.0)\n\nHauptmerkmal:  Angstanfälle oder dauerhafte diesbezügliche Sorgen\nAngstanfälle:     plötzlich, „spontan“, intensiv, Körpersymptome, Gefahrengefühl\nTypisch:         „Angst vor der Angst“, befürchtet katastrophale Konsequenzen\nSpontaneität:     unerwartet, ohne erkennbare Ursache, nicht situationsgebunden\nZentrale\nBefürchtungen:   v.a. Angstanfälle („Angst vor der Angst“) bzw. katastrophale Folgen\n                   (Spezifische Phobie: unmittelbare Angst vor vom Objekt oder der Situation\n                 ausgehender Gefahr; Soziale Angststörung: Blamage/negative Bewertung)\n\nFür die Diagnose einer Panikstörung müssen v.a. folgende speziellen Kriterien erfüllt sein:\nSpontaneität:    mindestens manche Anfälle unerwartet\nSymptome:      mindestens vier der nebenan genannten Symptome\nZeitverlauf:     Symptome wenigstens manchmal innerhalb weniger Minuten nach Anfallsbeginn\n                 vorhanden\nHäufigkeit:      wiederkehrende unerwartete Anfälle, die zu einer bedeutsamen\n                 Verhaltensänderung führen oder mindestens einen Monat lang von anhaltender\n                 Sorge über weitere Anfälle oder deren Konsequenzen begleitet sind\nAbgrenzung:     Allgemein können Panikattacken im Rahmen jeder anderen psychischen Störung\n                    auftreten.\n                  Beispiele weiterer Abgrenzungen: Spezifische Phobie: wenn Angstanfälle nur\n                   bei bestimmten Reizen (z. B. Hundephobie), Soziale Angststörung: nur in\n                   sozialen Situationen, Trennungsansgstörung: Trennung von einer wichtigen\n                  Person, Posttraumatische Belastungsstörung: Konfrontation mit einem\n                  Hinweisreiz auf ein traumatisches Ereignis.\n\n\n\n\n\nPanikstörung                                                               Ja     Nein\nWiederkehrende unerwartete Panikattacken (plötzliche Angst/Unbehangen,\nHöhepunkt nach Minuten, 4 oder mehr Sypmtome)\nMind. 1 Panikattacke wird mind. 1 Monat gefolgt von:\n     -   Sorge\n     -   Verhaltensänderungen\n\n5                      Copyright © 2017 Margraf & Cwik","navTitle":"Panikstörung (ps)","when":{"op":"notAllNo","fields":["p04_ps"]},"dependsOn":["p04_ps"],"rules":[{"after":"p06_peak_no_route","condition":{"op":"eq","field":"p06_peak_minutes","value":"no"},"target":"p08","text":"(Falls NEIN, weiter zu AGORAPHOBIE)"},{"after":"p06_symptoms_route","condition":{"op":"countYesLess","fields":["p06_symptom_heart","p06_symptom_sweating","p06_symptom_trembling","p06_symptom_breathlessness","p06_symptom_choking","p06_symptom_chest","p06_symptom_nausea","p06_symptom_dizziness","p06_symptom_unreality","p06_symptom_losing_control","p06_symptom_dying","p06_symptom_numbness","p06_symptom_hot_cold"],"value":4},"target":"p08","text":"(Falls weniger als 4 Symptome, weiter zu AGORAPHOBIE)"}],"criteria":[{"title":"Panikstörung","items":[{"id":"c05_1","text":"Wiederkehrende unerwartete Panikattacken (plötzliche Angst/Unbehangen, Höhepunkt nach Minuten, 4 oder mehr Sypmtome)","type":"yn"},{"id":"c05_2","text":"Mind. 1 Panikattacke wird mind. 1 Monat gefolgt von:","type":"yn"},{"id":"c05_3","text":"- Sorge","type":"yn"},{"id":"c05_4","text":"- Verhaltensänderungen","type":"yn"}]}]},{"id":"p08","page":8,"title":"AGORAPHOBIE (AG)","kind":"module","blocks":[{"id":"p08_intro","type":"info","text":"Sie hatten berichtet, dass Sie bestimmte Situationen vermeiden oder dass diese Ihnen Angst machen."},{"id":"p08_situations_fears","type":"text","text":"Welche Situationen sind dies und was befürchten Sie, könnte Ihnen dort schlimmstenfalls passieren? Beschreiben:"},{"id":"p08_consistent_fear","type":"yn","text":"Erleben Sie die Angst jedesmal, wenn Sie in der gefürchteten Situation waren oder hätten kommen können?","options":["JA","NEIN"]},{"id":"p08_accompaniment","type":"yn","text":"Macht es einen Unterschied, ob Sie in Begleitung sind?","options":["JA","NEIN"]},{"id":"p08_trapped_fears","type":"text","text":"Was denken Sie, könnte mit Ihnen geschehen, wenn Sie in einer Situation festsitzen, die Sie üblicherweise vermeiden? Beschreiben:"}],"reference":"Agoraphobie (F40.00)\n\nHauptmerkmal:  Furcht/Vermeidung angstanfallsrelevanter Situationen\nBeispiele:        Autofahren, Kaufhäuser, Supermärkte, Fahrstühle, Menschenmengen, alleine das\n               Haus verlassen, in einer Schlange stehen, öffentliche Verkehrsmittel, Flugzeuge,\n                  Kinos, Theater\nDauer:          mind. 6 Monate\nUmfang:        Ängste und Vermeidung in mindestens 2 der folgenden Bereiche: Verkehrsmittel,\n                   Öffentliche Plätze, Geschlossene Räume, Menschenmengen, draußen alleine sein\nMöglich:         Angstanfälle können völlig verschwinden, gefürchtete Situationen unter extremer\n                Angst oder in Begleitung ertragbar\nÜberschneidung: Einzelne agoraphobische Situationen können auch im Rahmen einer Spezifischen\n                 Phobie oder Sozialen Angststörung vermieden werden, Agoraphobiker vermeiden\n                 jedoch mehr Situationen\nZentrale\nBefürchtungen:  keine Hilfe bekommen können, wenn Panik auftritt oder beschämende Symptome\n                       (z. B. Durchfall) bekommen und die Situation nicht verlassen zu können\n\n\n\n\n\nAgoraphobie                                                                Ja     Nein\nAngst vor/Sorge in mindestens 2 Situationen\nAngst/Vermeidung der Situationen\nAngst tritt (fast) immer auf\nVermeidung/Anwesenheit anderer Personen/mit intensiver Angst ertragen\nAngst ist unangemessen\nDauer: mind. 6 Monate an\nLeiden oder Beeinträchtigungen\n\n\n7                      Copyright © 2017 Margraf & Cwik","navTitle":"Agoraphobie (ag)","when":{"op":"or","conditions":[{"op":"notAllNo","fields":["p04_ag"]},{"op":"and","conditions":[{"op":"or","conditions":[{"op":"notAllNo","fields":["p04_ps"]},{"op":"manual","section":"p06"}]},{"op":"or","conditions":[{"op":"eq","field":"p06_peak_minutes","value":"no"},{"op":"countYesLess","fields":["p06_symptom_heart","p06_symptom_sweating","p06_symptom_trembling","p06_symptom_breathlessness","p06_symptom_choking","p06_symptom_chest","p06_symptom_nausea","p06_symptom_dizziness","p06_symptom_unreality","p06_symptom_losing_control","p06_symptom_dying","p06_symptom_numbness","p06_symptom_hot_cold"],"value":4}]}]}]},"dependsOn":["p04_ag","p04_ps","p06_peak_minutes","p06_symptom_heart","p06_symptom_sweating","p06_symptom_trembling","p06_symptom_breathlessness","p06_symptom_choking","p06_symptom_chest","p06_symptom_nausea","p06_symptom_dizziness","p06_symptom_unreality","p06_symptom_losing_control","p06_symptom_dying","p06_symptom_numbness","p06_symptom_hot_cold"],"criteria":[{"title":"Agoraphobie","items":[{"id":"c07_1","text":"Angst vor/Sorge in mindestens 2 Situationen","type":"yn"},{"id":"c07_2","text":"Angst/Vermeidung der Situationen","type":"yn"},{"id":"c07_3","text":"Angst tritt (fast) immer auf","type":"yn"},{"id":"c07_4","text":"Vermeidung/Anwesenheit anderer Personen/mit intensiver Angst ertragen","type":"yn"},{"id":"c07_5","text":"Angst ist unangemessen","type":"yn"},{"id":"c07_6","text":"Dauer: mind. 6 Monate an","type":"yn"},{"id":"c07_7","text":"Leiden oder Beeinträchtigungen","type":"yn"}]}]},{"id":"p10","page":10,"title":"SOZIALE ANGSTSTÖRUNG (SAS)","kind":"module","blocks":[{"id":"p10_social_fears","type":"text","text":"Was befürchten Sie, könnte Ihnen schlimmstenfalls in Situationen passieren, in denen Sie mit anderen Menschen zusammentreffen? Beschreiben:"},{"id":"p10_consistent_fear","type":"yn","text":"Erleben Sie die Angst jedesmal, wenn Sie in der gefürchteten Situation waren oder hätten kommen können?","options":["JA","NEIN"]},{"id":"p10_fear_onset","type":"choice","text":"Tritt die Angst sofort auf, wenn Sie (...) erleben oder sobald Sie wissen, dass Sie (...) erleben werden?","options":["SOFORT","VERZÖGERT"]},{"id":"p10_avoidance","type":"yn","text":"Vermeiden Sie solche Situationen oder können Sie sie nur unter intensiver Angst ertragen?","options":["JA","NEIN"]}],"reference":"Soziale Angststörung (F40.10)\n\nHauptmerkmal:  Furcht/Vermeidung von möglichen Bewertungssituationen im weitesten Sinne\nBeispiele:        Versagen in Prüfungen, lächerlich machen bei Vortrag, Demütigung durch andere\nDauer:          mind. 6 Monate\nTypisch:         ausgeprägte Erwartungsängste\nZentrale\nBefürchtungen:  Blamage/negative Bewertung (Agoraphobie: v.a. Angstanfälle und keine Flucht\n                 möglich oder Flucht peinlich, Spezifische Phobie: unmittelbar vom Objekt oder der\n                   Situation ausgehende Gefahren)\nBestimme, ob:    nur Auftritte betreffend (öffentliches Sprechen oder Darstellungen in der\n                    Öffentlichkeit)\nAbgrenzung:     Taijin kyofusho: Eine insbesondere in kollektivistischen Gesellschaften (z. B.\n                  Japan, Korea) auftretende Angst, sich so zu verhalten, dass man andere in\n                  Verlegenheit bringt.\n\n\n\n\n\nSoziale Angststörung                                                         Ja     Nein\nAngst/Sorge in sozialen Situationen\nAngst demütigendes Verhalten/peinliches Verhalten/Angstsymptome zu zeigen\nAngst tritt (fast) immer auf\nSituationen werden vermieden oder ertragen\nAngst ist unangemessen\nDauer: mind. 6 Monate\nLeiden oder Beeinträchtigungen\n\n\n9                      Copyright © 2017 Margraf & Cwik","navTitle":"Soziale angststörung (sas)","when":{"op":"notAllNo","fields":["p04_sas"]},"dependsOn":["p04_sas"],"criteria":[{"title":"Soziale Angststörung","items":[{"id":"c09_1","text":"Angst/Sorge in sozialen Situationen","type":"yn"},{"id":"c09_2","text":"Angst demütigendes Verhalten/peinliches Verhalten/Angstsymptome zu zeigen","type":"yn"},{"id":"c09_3","text":"Angst tritt (fast) immer auf","type":"yn"},{"id":"c09_4","text":"Situationen werden vermieden oder ertragen","type":"yn"},{"id":"c09_5","text":"Angst ist unangemessen","type":"yn"},{"id":"c09_6","text":"Dauer: mind. 6 Monate","type":"yn"},{"id":"c09_7","text":"Leiden oder Beeinträchtigungen","type":"yn"}]}]},{"id":"p12","page":12,"title":"SPEZIFISCHE PHOBIE (SP)","kind":"module","blocks":[{"id":"p12_intro","type":"info","text":"Sie hatten berichtet, dass Sie bestimmte Dinge fürchten oder vermeiden."},{"id":"p12_feared_objects","type":"text","text":"Welche Dinge sind das? Beschreiben:"},{"id":"p12_consistent_fear","type":"yn","text":"Erleben Sie die Angst jedesmal, wenn Sie mit dem gefürchteten Objekt/der gefürchteten Situation ausgesetzt sind oder ausgesetzt werden könnten?","options":["JA","NEIN"]},{"id":"p12_fear_onset","type":"choice","text":"Tritt die Angst sofort auf, wenn Sie (...) erleben oder sobald Sie wissen, dass Sie (...) erleben werden?","options":["SOFORT","VERZÖGERT"]}],"reference":"Spezifische Phobie (F40.2x)\n\nHauptmerkmal:  Furcht/Vermeidung spezifischer Objekte\nBeispiele:         Tiere (z. B. Spinnen, Schlangen, Hunde, Ratten), Höhen, enge Räume, Flugzeug\n                und der Anblick von Blut, Verletzungen oder Spritzen\nAusnahmen:     Angst vor Panikattacken (Panikstörung), Soziale Situationen (Soziale\n                  Angststörung)\nDauer:          mind. 6 Monate\nWichtig:         Beeinträchtigung/Leiden\nMöglich:         Ertragen unter extremer Angst\nZentrale\nBefürchtungen:   direkt vom phobischen Objekt ausgehende Gefahren, wie z. B. Flugzeugabsturz,\n                Hundebiss (Agoraphobie: v.a. Angstanfälle und keine Flucht möglich oder Flucht\n                    peinlich, Soziale Angststörung: negative Bewertung)\nCodierungen:    Tier-Typus: F40.218; Umwelt-Typus: F40.228; Blut-Spritzen-Verletzungstypus,\n                  Furcht vor Blut: F40.230; Blut-Spritzen-Verletzungstypus, Furcht vor Spritzen und\n                  Transfusionen: F40.231; Blut-Spritzen-Verletzungstypus, Furcht vor\n                 medizinischen Behandlungen: F40.232; Blut-Spritzen-Verletzungstypus, Furcht\n                 vor Verletzungen; F40.233; Situativer-Typus: F40.248; Anderer-Typus: F40.298\n\n\n\n\n\nSpezifische Phobie                                                           Ja     Nein\nAngst/Sorge um spezifische Objekte/Situationen\nAngst tritt (fast) immer auf\nPhobisches Objekt/Situation wird vermieden/ertragen\nAngst ist unangemessen\nDauer: mind. 6 Monate\nLeiden oder Beeinträchtigungen\n\n\n\n11                     Copyright © 2017 Margraf & Cwik","navTitle":"Spezifische phobie (sp)","when":{"op":"notAllNo","fields":["p04_sp"]},"dependsOn":["p04_sp"],"criteria":[{"title":"Spezifische Phobie","items":[{"id":"c11_1","text":"Angst/Sorge um spezifische Objekte/Situationen","type":"yn"},{"id":"c11_2","text":"Angst tritt (fast) immer auf","type":"yn"},{"id":"c11_3","text":"Phobisches Objekt/Situation wird vermieden/ertragen","type":"yn"},{"id":"c11_4","text":"Angst ist unangemessen","type":"yn"},{"id":"c11_5","text":"Dauer: mind. 6 Monate","type":"yn"},{"id":"c11_6","text":"Leiden oder Beeinträchtigungen","type":"yn"}]}]},{"id":"p14","page":14,"title":"GENERALISIERTE ANGSTSTÖRUNG (GAS)","kind":"module","blocks":[{"id":"p14_intro","type":"info","text":"Sie hatten von übermäßigen Sorgen berichtet."},{"id":"p14_worry_content","type":"text","text":"Worum geht es bei diesen Sorgen? Beschreiben:"},{"id":"_p14_single_domain","type":"yn","extra":true,"text":"Betreffen die beschriebenen Sorgen nur einen Bereich?","note":"Steuert ausschließlich die nachfolgende Zusatzfrage der Vorlage."},{"id":"p14_single_domain_instruction","type":"info","text":"Falls Sorgen in nur einem Bereich:","when":{"op":"ne","field":"_p14_single_domain","value":"no"}},{"id":"p14_frequent_minor_worries","type":"yn","text":"Sind Sie jemand, der sich oft oder auch über kleinere Dinge Sorgen macht?","options":["JA","NEIN"],"when":{"op":"ne","field":"_p14_single_domain","value":"no"}},{"id":"p14_worry_control","type":"yn","text":"Haben Sie Schwierigkeiten Ihre Sorgen zu kontrollieren?","options":["JA","NEIN"]},{"id":"p14_symptoms_intro","type":"info","text":"Leiden Sie oft unter folgenden Symptomen:"},{"id":"p14_symptom_restlessness","type":"yn","text":"(1) Ruhelosigkeit?","options":["JA","NEIN"]},{"id":"p14_symptom_fatigue","type":"yn","text":"(2) leichte Ermüdbarkeit?","options":["JA","NEIN"]},{"id":"p14_symptom_concentration","type":"yn","text":"(3) Konzentrationsschwierigkeiten wegen Sorgen/Angst?","options":["JA","NEIN"]},{"id":"p14_symptom_irritability","type":"yn","text":"(4) Reizbarkeit","options":["JA","NEIN"]},{"id":"p14_symptom_tension","type":"yn","text":"(5) Ständige Anspannung?","options":["JA","NEIN"]},{"id":"p14_symptom_sleep","type":"yn","text":"(6) Schlafstörungen?","options":["JA","NEIN"]}],"reference":"Generalisierte Angststörung (F41.1)\n\nHauptmerkmal:  Dauerhafte oder exzessive Angst und Sorgen, die subjektiv schwer kontrollierbar\n                  erscheinen\nDauer:          Mind. 6 Monate\nUmfang:         mindestens 2 Lebensbereiche (z. B. Arbeit, Finanzen, Ehe) betroffen (oder 1, wenn\n                   generell glüblerisch/häufige Sorgen)\nSymptome:      mindestens 3 der 6 nebenan genannten Symptome, davon mindestens 1 während\n                  des größeren Teils von 6 Monaten\nWichtig:         Sorgen nicht wegen anderen Störungen (v. a. Major Depression, Panikstörung,\n                  Soziale Phobie, Zwangsstörung)\n\n\n\n\n\nGeneralisierte Angststörung                                                  Ja     Nein\nExzessive Angst und Sorge bezügl. mehrerer Ereignisse/Tätigkeiten\nSchwierigkeiten Sorgen zu kontrollieren\nAngst/Sorgen sind mit mind. 3 Symptomen verbunden\nDauer: mind. 6 Monate\nLeiden oder Beeinträchtigungen\n\n\n13                     Copyright © 2017 Margraf & Cwik","navTitle":"Generalisierte angststörung (gas)","when":{"op":"notAllNo","fields":["p04_gas"]},"dependsOn":["p04_gas"],"criteria":[{"title":"Generalisierte Angststörung","items":[{"id":"c13_1","text":"Exzessive Angst und Sorge bezügl. mehrerer Ereignisse/Tätigkeiten","type":"yn"},{"id":"c13_2","text":"Schwierigkeiten Sorgen zu kontrollieren","type":"yn"},{"id":"c13_3","text":"Angst/Sorgen sind mit mind. 3 Symptomen verbunden","type":"yn"},{"id":"c13_4","text":"Dauer: mind. 6 Monate","type":"yn"},{"id":"c13_5","text":"Leiden oder Beeinträchtigungen","type":"yn"}]}]},{"id":"p16","page":16,"title":"SCREENING: STIMMUNGSSPEKTRUM","kind":"screen","blocks":[{"id":"p16_intro","type":"info","text":"Ich werde Ihnen nun einige Fragen zu Stimmungsschwankungen oder länger anhaltenden Stimmungen stellen. Gab es schon mal Zeiten, in denen Sie..."},{"id":"p16_me","type":"screen","text":"ME: ... sich mindestens 1 Woche lang sich ganz extrem hochgestimmt oder reizbar fühlten? Kommt das aktuell vor?","options":["aktuell","früher","beides","nein"]},{"id":"p16_me_route","type":"info","text":"⎣ S. 18"},{"id":"p16_hme","type":"screen","text":"HME: ... sich mindestens 4 Tage lang sich über ihrem üblichen Niveau besonders hochgestimmt oder reizbar fühlten? Kommt das aktuell vor?","options":["aktuell","früher","beides","nein"]},{"id":"p16_hme_route","type":"info","text":"⎣ S. 18"},{"id":"p16_md","type":"screen","text":"MD: ... sich mindestens 2 Wochen lang sehr depressiv, traurig und hoffenungslos fühlten oder gar kein Interesse selbst an angenehmen Dingen hatten? Kommt das aktuell vor?","options":["aktuell","früher","beides","nein"]},{"id":"p16_md_route","type":"info","text":"⎣ S. 20"},{"id":"p16_pds","type":"screen","text":"PDS: ... sich über einen langen Zeitraum (mindestens 2 Jahre) die meiste Zeit niedergeschlagen oder traurig fühlten? Kommt das aktuell vor?","options":["aktuell","früher","beides","nein"]},{"id":"p16_pds_route","type":"info","text":"⎣ S. 22"},{"id":"p16_no_route","type":"info","text":"Falls NEIN, weiter zu SCREENING: ZWANGSSPEKTRUM (S. 24)"},{"id":"p16_mood_course_intro","type":"info","text":"Stimmungsverlaufskurve:"},{"id":"p16_mood_course_instruction","type":"info","text":"Markieren Sie zunächst wichtige Lebensereignisse (z. B. Geburt des Kindes, Arbeitsplatzverlust, Tod einer nahestehenden Person, neue Partnerschaft) auf der Verlaufsachse mit einer Jahreszahl/Monatsangabe. Anschließend kann dann der (depressive und (hypo-)manische) Stimmungsverlauf als Kurve eingetragen werden. Dabei ist der graue Bereich für normale Stimmungsschwankungen vorgesehen."},{"id":"p16_mood_course","type":"text","text":"Stimmung\n+\n-\nVerlauf"}],"navTitle":"Stimmungsspektrum"},{"id":"p18","page":18,"title":"MANISCHE/HYPOMANISCHE EPISODE (ME/HME)","kind":"module","blocks":[{"id":"p18_intro","type":"info","text":"Erlebten Sie während der Zeit, als Sie extrem hochgestimmt oder reizbar waren, Dinge wie..."},{"id":"p18_special_abilities","type":"yn","text":"... das Gefühl, eine Person mit besonderen Fähigkeiten zu sein?","options":["JA","NEIN"]},{"id":"p18_less_sleep","type":"yn","text":"... das Gefühl, mit weniger Schlaf als üblich auszukommen?","options":["JA","NEIN"]},{"id":"p18_talkative","type":"yn","text":"... das Gefühl, gesprächiger als sonst zu sein?","options":["JA","NEIN"]},{"id":"p18_new_ideas","type":"yn","text":"... das Gefühl, dass Sie voller neuer Ideen steckten?","options":["JA","NEIN"]},{"id":"p18_distractibility","type":"yn","text":"... leichte Ablenkbarkeit?","options":["JA","NEIN"]},{"id":"p18_activity_restlessness","type":"yn","text":"... ungewöhnliche Aktivität oder Ruhelosigkeit?","options":["JA","NEIN"]},{"id":"p18_excessive_activities","type":"yn","text":"... für Sie unübliche sexuelle Aktivität, übertriebenes Einkaufen oder andere übermäßige Aktivitäten?","options":["JA","NEIN"]},{"id":"p18_serious_consequences","type":"yn","text":"Haben Sie in dieser Zeit sich selbst oder andere in ernsthafte Schwierigkeiten gebracht oder wurden Sie in eine Klinik eingeliefert?","options":["JA","NEIN"]},{"id":"p18_duration","type":"number","text":"Wie lange dauerten diese Symptome an (Tage)? Dauer:","unit":"Tage","min":0},{"id":"p18_preceding_events","type":"yn","text":"Gab es in Ihrem Leben, unmittelbar bevor diese Gefühle auftraten, besondere Ereignisse, die Ihr Befinden erklären könnten?","options":["JA","NEIN"]},{"id":"p18_preceding_events_description","type":"text","text":"Beschreiben:"}],"reference":"Manische/Hypomane Episode, Bipolare Störung I, Bipolare Störung II\n(F31.xx)\n\nHauptmerkmal:  Bipolare Störung I: mindestens 1 manische Episode, aber auch hypomane und\n                  depressive Episoden möglich, Bipolare Störung II: mindestens 1 hypomane\n                 Episode und mindestens 1 Episode der Major Depression, zu keinem Zeitpunkt\n                    allerdings eine manische Episode.\nWichtig:           Suizidalität und Geschäftsfähigkeit abklären\nVerlauf:         Bipolar I Störung: meist Beginn im 18. Lebensjahr mit manischer, hypomaner\n                 oder depressiver Episode, Bipolar II Störung: meist Beginn in den frühen 20er\n                 Lebensjahren und meist mit depressiver Episode\n                 Insgesamt häufig episodisch, typischerweise eher kurze, intensive Episoden\nZeitkriterium:   Bipolar I Störung: mindestens 1 Woche bestehende manische Episode, Bipolar II\n                Störung: mindestens 4 Tage bestehende hypomane Episode\nAbgrenzung:    Zyklothyme Störung: 2 Jahre immer wieder hypomane Symptome und\n                  verschiedene depressive Symptome ohne jemals eine Major Depression zu\n                     erfüllen, Schizophrenie-Spektrums- oder andere psychotische Störungen:\n                  psychotische Symptomperioden treten in Abwesenheit von Stimmungssymptomen\n                    auf, Störungen durch Substanzkonsum: Zusammenhang zwischen\n                Stimmungshochs und Substanzeinnahme,\n                 Aufmerksamkeitsdefizit/Hyperaktivitätsstörung: keine trennbaren Episoden der\n              Symptome\nCodierungen:    Bipolar-I-Störung, aktuelle oder letzte Episode manisch:\n                    leichtgradig: F31.11; mittelgradig: F31.12; schwergradig: F31.13; mit\n                  psychotischen Merkmalen: F31.2; teilremittiert: F31.73; vollremittiert: F31.73;\n             NNB: F31.9\n                 Bipolar-I-Störung, aktuelle oder letzte Episode depressiv:\n                    leichtgradig: F31.31; mittelgradig: F31.32; schwergradig: F31.4; mit psychotischen\n                Merkmalen: F31.5; teilremittiert: F31.75; vollremittiert: F31.76; NNB: F31.9\n                 Bipolar-II-Störung: F31.81\n\n\n\n\nManische Episode                                                           Ja     Nein\nGehobene/reizbare Stimmung/zielgerichtete Aktivität oder Energie\nMind. 3 Symptome, signifikante Veränderung des gewöhnlichen Verhaltens\nDauer: mind. 1 Woche\nStörung ausreichend schwer um Leiden oder Beeinträchtigungen zu verursachen\n     -   klinisch-stationären Aufenthalt notwendig zu machen\n     -   oder psychotische Syptome\n\n\n\nHypomane Episode                                                          Ja     Nein\nGehobene/reizbare Stimmung/zielgerichtete Aktivität oder Energie\nMind. 3 Symptome\nUncharakteristische Veränderung des Funktionsniveaus\nDurch andere beobachtbar\nDauer: mind. 4 Tage\nStörung ist nicht schwer genug um Leiden oder Beeinträchtigungen zu\nverursachen\n     -   kein klinisch-stationären Aufenthalt notwendig,\n     -   keine psychotischen Syptome\n\n17                     Copyright © 2017 Margraf & Cwik","navTitle":"Manische/hypomanische episode (me/hme)","when":{"op":"notAllNo","fields":["p16_me","p16_hme"]},"dependsOn":["p16_me","p16_hme"],"criteria":[{"title":"Manische Episode","items":[{"id":"c17_1","text":"Gehobene/reizbare Stimmung/zielgerichtete Aktivität oder Energie","type":"yn"},{"id":"c17_2","text":"Mind. 3 Symptome, signifikante Veränderung des gewöhnlichen Verhaltens","type":"yn"},{"id":"c17_3","text":"Dauer: mind. 1 Woche","type":"yn"},{"id":"c17_4","text":"Störung ausreichend schwer um Leiden oder Beeinträchtigungen zu verursachen\n- klinisch-stationären Aufenthalt notwendig zu machen\n- oder psychotische Syptome","type":"yn"}]},{"title":"Hypomane Episode","items":[{"id":"c17_7","text":"Gehobene/reizbare Stimmung/zielgerichtete Aktivität oder Energie","type":"yn"},{"id":"c17_8","text":"Mind. 3 Symptome","type":"yn"},{"id":"c17_9","text":"Uncharakteristische Veränderung des Funktionsniveaus","type":"yn"},{"id":"c17_10","text":"Durch andere beobachtbar","type":"yn"},{"id":"c17_11","text":"Dauer: mind. 4 Tage","type":"yn"},{"id":"c17_12","text":"Störung ist nicht schwer genug um Leiden oder Beeinträchtigungen zu verursachen\n- kein klinisch-stationären Aufenthalt notwendig,\n- keine psychotischen Syptome","type":"yn"}]}]},{"id":"p20","page":20,"title":"MAJOR DEPRESSION (MD)","kind":"module","blocks":[{"id":"p20_condition_instruction","type":"info","text":"Falls depressive Stimmung bzw. Interesseverlust:"},{"id":"p20_symptoms_intro","type":"info","text":"Welche der folgenden Beschwerden trafen während der Zeit, in der Sie sich traurig oder interesselos fühlten auf Sie zu?"},{"id":"p20_weight_appetite","type":"yn","text":"... Hat sich Ihr Gewicht oder Ihr Appetit stark verändert?","options":["JA","NEIN"]},{"id":"p20_sleep","type":"yn","text":"... Hat sich Ihr Schlaf geändert?","options":["JA","NEIN"]},{"id":"p20_psychomotor","type":"yn","text":"... Waren Sie unfähig, still zu sitzen oder völlig verlangsamt? (Nur MD)","options":["JA","NEIN"]},{"id":"p20_energy","type":"yn","text":"... Waren Sie ständig müde oder hatten keine Energie?","options":["JA","NEIN"]},{"id":"p20_guilt","type":"yn","text":"... Dachten Sie schlecht über sich oder fühlten sich schuldig?","options":["JA","NEIN"]},{"id":"p20_concentration","type":"yn","text":"... Hatten Sie Probleme mit Entscheidungen oder der Konzentration?","options":["JA","NEIN"]},{"id":"p20_hopelessness","type":"yn","text":"... Fühlten Sie sich hoffnungslos und sahen alles schwarz?","options":["JA","NEIN"]},{"id":"p20_death_self_harm","type":"yn","text":"... Dachten Sie an den Tod oder daran, sich selbst etwas anzutun?","options":["JA","NEIN"]},{"id":"p20_duration","type":"text","text":"Wie lange haben diese Symptome angehalten?"},{"id":"p20_interruptions","type":"text","text":"Gab es Unterbrechungen? Beschreiben:"},{"id":"p20_multiple_episodes","type":"yn","text":"Hat es mehrere solcher Phasen gegeben?","options":["JA","NEIN"]},{"id":"p20_bipolar_instruction","type":"info","text":"Falls zusätzlich ME/HME, BIPOLARE STÖRUNG I/II"}],"reference":"Major Depression (F32.xx; F33.xx)\n\nHauptmerkmal:  Depressive Stimmung oder massiver Interesseverlust (keine äußeren Ursachen oder\n                   deutlich übermäßige Reaktion)\nWichtig:           Suizidalität abklären\nVerlauf:          häufig episodisch, typischerweise eher kurze, intensive Episoden\nZeitkriterium:   Symptome mindestens 2 Wochen nahezu jeden Tag für die meiste Zeit des Tages\nAbgrenzung:     bei der PDS längere aber weniger intensive) Phase depressiver Stimmung,\n                    Interesseverlust und psychomotorische Hemmung keine eigenen Symptome, wohl\n                  aber Hoffnungslosigkeit und geringer Selbstwert\nCodierungen:    Einzelne Episode:\n                    leichtgradig: F32.0; mittelgradig: F32.1; schwergradig: F32.2; mit psychotischen\n                Merkmalen: F32.3; teilremittiert: F32.4; vollremittiert: F32.5; NNB: F32.9\n                 Rezidivierende Depression:\n                    leichtgradig: F33.0; mittelgradig: F33.1; schwergradig: F33.2; mit psychotischen\n                Merkmalen: F33.3; teilremittiert: F33.41; vollremittiert: F33.42; NNB: F33.9\n\n\n\n\n\nMajor Depression                                                           Ja     Nein\nMind. 5 Symptome, mind. entweder (1) depressive Stimmung oder (2) Verlust an\nInteresse/Freude\nDauer: mind. 2 Wochen\nLeiden oder Beeinträchtigungen\n\n\n19                     Copyright © 2017 Margraf & Cwik","navTitle":"Major depression (md)","when":{"op":"notAllNo","fields":["p16_md"]},"dependsOn":["p16_md"],"criteria":[{"title":"Major Depression","items":[{"id":"c19_1","text":"Mind. 5 Symptome, mind. entweder (1) depressive Stimmung oder (2) Verlust an Interesse/Freude","type":"yn"},{"id":"c19_2","text":"Dauer: mind. 2 Wochen","type":"yn"},{"id":"c19_3","text":"Leiden oder Beeinträchtigungen","type":"yn"}]}]},{"id":"p22","page":22,"title":"PERSISTIERENDE DEPRESSIVE STÖRUNG (PDS)","kind":"module","blocks":[{"id":"p22_non_depressed_periods","type":"yn","text":"Gab es Phasen, in denen Sie sich nicht depressiv fühlten?","options":["JA","NEIN"]},{"id":"p22_longest_non_depressed_period","type":"text","text":"Wie lange dauerte die längste Zeitspanne, in der Sie sich nicht depressiv oder interesselos fühlten? Beschreiben:"},{"id":"_p22_over_two_months","type":"yn","extra":true,"text":"Betrug die beschriebene längste Zeitspanne mehr als zwei Monate?","note":"Steuert den Prüfhilfe-Hinweis auf rezidivierende Major Depression. Keine automatische Diagnose."},{"id":"p22_recurrent_md_instruction","type":"info","text":"Falls >2 Monate, REZIDIVIERENDE MAJOR DEPRESSION überprüfen"}],"reference":"Persistierende Depressive Störung (F34.1)\n\nHauptmerkmal:  lange depressive Verstimmung (keine oder unzureichende äußere Ursachen)\nWichtig:           Suizidalität abklären\nVerlauf:          längere, aber nicht notwendigerweise intensive Phasen\nZeitkriterium:   Symptome mindestens 2 Jahre, Mehrzahl aller Tage, maximal 2 Monate\n                  beschwerdefrei\nAbgrenzung:     bei der MD kürzere (aber intensivere) Phasen, Interesseverlust und\n                 psychomotorische Hemmung eigene Symptome, nicht aber Hoffnungslosigkeit\n\n\n\n\n\nPerstierende Depressive Störung                                               Ja     Nein\nDepressive Stimmung\nMind. 2 Symptome\nKein Aussetzten der Symptome für mehr als 2 Monate\nKriterien für Major Depression können 2 Jahre durchgehend bestehen\nDauer: mind. 2 Jahre\nLeiden oder Beeinträchtigungen\n\n21                     Copyright © 2017 Margraf & Cwik","navTitle":"Persistierende depressive störung (pds)","when":{"op":"notAllNo","fields":["p16_pds"]},"dependsOn":["p16_pds"],"criteria":[{"title":"Perstierende Depressive Störung","items":[{"id":"c21_1","text":"Depressive Stimmung","type":"yn"},{"id":"c21_2","text":"Mind. 2 Symptome","type":"yn"},{"id":"c21_3","text":"Kein Aussetzten der Symptome für mehr als 2 Monate","type":"yn"},{"id":"c21_4","text":"Kriterien für Major Depression können 2 Jahre durchgehend bestehen","type":"yn"},{"id":"c21_5","text":"Dauer: mind. 2 Jahre","type":"yn"},{"id":"c21_6","text":"Leiden oder Beeinträchtigungen","type":"yn"}]}]},{"id":"p24","page":24,"title":"SCREENING: ZWANGSSPEKTRUM","kind":"screen","blocks":[{"id":"p24_intro","type":"info","text":"Ich werde Ihnen nun einige Fragen zu immer wieder auftretenden Gedanken oder Handlungen stellen. Gab es schon mal Zeiten, in denen Sie..."},{"id":"p24_zg","type":"screen","text":"ZG: ... unangenehme oder vielleicht auch unsinnige Gedanken, Impulse oder Vorstellungen bei sich beobachteten, die plötzlich oder immer wieder auftraten und die Angst auslösten oder Sie belasteten? Kommt das aktuell vor?","options":["aktuell","früher","beides","nein"]},{"id":"p24_zg_route","type":"info","text":"⎣ S. 26"},{"id":"p24_zh","type":"screen","text":"ZH: ... einen Drang verspürt haben, Handlungen oder gedankliche Vorgänge zu wiederholen (z. B. beten, zählen, Wörter wiederholen) auszuführen? Kommt das aktuell vor?","options":["aktuell","früher","beides","nein"]},{"id":"p24_zh_route","type":"info","text":"⎣ S. 26"},{"id":"p24_kds","type":"screen","text":"KDS: ... sich wiederholt mit einem oder mehreren Körperbereichen beschäftigt haben, da Sie diese als Mangel Ihres körperlichen Erscheinungsbildes wahrgenommen haben? Kommt das aktuell vor?","options":["aktuell","früher","beides","nein"]},{"id":"p24_kds_route","type":"info","text":"⎣ S. 28"},{"id":"p24_no_route","type":"info","text":"Falls NEIN, weiter zu SCREENING: TRAUMAFOLGESPEKTRUM (S. 30)"}],"navTitle":"Zwangsspektrum"},{"id":"p26","page":26,"title":"ZWANGSSTÖRUNG","kind":"module","blocks":[{"id":"p26_content_purpose","type":"text","text":"Welchen Inhalt und Zweck haben diese Gedanken oder Handlungen? Beschreiben:"},{"id":"p26_distress","type":"yn","text":"Rufen diese Gedanken oder Handlungen ausgeprägte Angst oder großes Unwohlsein hervor?","options":["JA","NEIN"]},{"id":"p26_no_distress_route","type":"info","text":"(Falls NEIN, weiter zu KÖRPERDYSMORPHE STÖRUNG)"},{"id":"p26_countermeasures","type":"yn","text":"Versuchen Sie etwas gegen diese Gedanken/Handlungen zu unternehmen?","options":["JA","NEIN"]},{"id":"p26_describe_if_yes_instruction","type":"info","text":"Falls JA, beschreiben:","when":{"op":"ne","field":"p26_countermeasures","value":"no"}},{"id":"p26_countermeasures_description","type":"text","text":"Beschreiben:","when":{"op":"ne","field":"p26_countermeasures","value":"no"}}],"reference":"Zwangsgedanken (Ideen, Impusle) (F42)\n\nHauptmerkmal:  anhaltend/wiederholt, aufdringlich, zumindest anfangs lästig, unsinnig oder\n                   persönlichkeitsfremd, Ignorierungsversuche, „neutralisierende“ Rituale\nBeispiele:       Gedanken eine geliebte Person zu verletzen oder zu töten, Blashphemien,\n                 Krankheiten\nAbgrenzung:     Grübeln bei MD (Stimmungskongruent, nicht intrusiv), Sorgen bei GAS (Sorgen\n                  des „Alltags“, z. B. Finanzen, Gesundheit, Partnerschaft)\nZwangshandlungen:\nHauptmerkmal:  wiederholt, absichtlich, geregelt/stereotyp, ich-fremd, nicht lustvoll,\n                    (unrealistische) Katastrophenverhinderung, Reaktionsverhinderung bewirkt\n                Angst/Unbehagen\nHäufigste Inhalte:Säubern, Kontrollieren, Aggressionen\nBeispiele:         häufiges Händewaschen gegen Infektion, „gute“ Gedanken gegen Autounfall des\n                Ehemannes, häufiges Kontrollieren des Herdes\nVerlauf:          längere, aber nicht notwendigerweise intensive Phasen\nZeitaufwand:     bei Gedanken und Handlungen meist hoch (z. B. mindestens 1 Stunden/Tag)\nWichtig:        Abrgenzung zu Psychosen\nBestimme, ob:   Zusammenhang mit Tics, mit guter/angemessener Einsicht, wenig Einsicht oder\n                ohne Einsicht/wahnhaften Überzeugungen\n\n\n\n\n\nZwangsstörung                                                             Ja     Nein\nZwangsgedanken:\n     -   aufdringliche, ungewollte Gedanken/Impulse/Vorstellungen rufen\n      Angst/Unbehagen hervor\n     -   Versuch Gedanken/Impulse/Bilder zu ignorieren/unterdrücken oder\n      durch andere Gedanken zu neutralisieren\nZwangshandlungen:\n     -   Verhaltensweisen/mentale Handlungen, als Reaktion auf\n      Zwangsgedanken/Regeln\n     -   Verhalten/mentale Handlungen sollen Angst/Unbehagen/gefürchtete\n       Situationen vorbeugen oder reduzieren\nZeitintensiv oder Leiden oder Beeinträchtigungen\n\n25                     Copyright © 2017 Margraf & Cwik","navTitle":"Zwangsstörung","when":{"op":"notAllNo","fields":["p24_zg","p24_zh"]},"dependsOn":["p24_zg","p24_zh"],"rules":[{"after":"p26_no_distress_route","condition":{"op":"eq","field":"p26_distress","value":"no"},"target":"p28","text":"(Falls NEIN, weiter zu KÖRPERDYSMORPHE STÖRUNG)"}],"criteria":[{"title":"Zwangsstörung","items":[{"id":"c25_1","text":"Zwangsgedanken:","type":"info"},{"id":"c25_2","text":"- aufdringliche, ungewollte Gedanken/Impulse/Vorstellungen rufen Angst/Unbehagen hervor","type":"yn"},{"id":"c25_3","text":"- Versuch Gedanken/Impulse/Bilder zu ignorieren/unterdrücken oder durch andere Gedanken zu neutralisieren","type":"yn"},{"id":"c25_4","text":"Zwangshandlungen:","type":"info"},{"id":"c25_5","text":"- Verhaltensweisen/mentale Handlungen, als Reaktion auf Zwangsgedanken/Regeln","type":"yn"},{"id":"c25_6","text":"- Verhalten/mentale Handlungen sollen Angst/Unbehagen/gefürchtete Situationen vorbeugen oder reduzieren","type":"yn"},{"id":"c25_7","text":"Zeitintensiv oder Leiden oder Beeinträchtigungen","type":"yn"}]}]},{"id":"p28","page":28,"title":"KÖRPERDYSMORPHE STÖRUNG (KDS)","kind":"module","blocks":[{"id":"p28_body_areas","type":"text","text":"Welche Körperbereiche und Mängel im Erscheinungsbild sind das? Beschreiben:"},{"id":"p28_preoccupation","type":"text","text":"Wie beschäftigen Sie sich mit diesen Mängeln im Erscheinungsbild (z. B. vor anderen verstecken, Bestätigung suchen, häufig im Spiegel betrachten)? Beschreiben:"},{"id":"p28_distress","type":"yn","text":"Rufen diese Gedanken oder Handlungen ausgeprägte Angst oder großes Unwohlsein hervor?","options":["JA","NEIN"]},{"id":"p28_no_distress_route","type":"info","text":"Falls NEIN, weiter zu SCREENING: TRAUMAFOLGESPEKTRUM (S. 30)"},{"id":"p28_countermeasures","type":"yn","text":"Versuchen Sie etwas gegen diese Gedanken/Handlungen zu unternehmen?","options":["JA","NEIN"]},{"id":"p28_describe_if_yes_instruction","type":"info","text":"Falls JA, beschreiben:","when":{"op":"ne","field":"p28_countermeasures","value":"no"}},{"id":"p28_countermeasures_description","type":"text","text":"Beschreiben:","when":{"op":"ne","field":"p28_countermeasures","value":"no"}}],"reference":"Körperdysmorphe Störung (F45.22)\n\nHauptmerkmal:  Irgendwann wiederholte Verhaltensweisen oder Gedanken im Zusammenhang mit\n              wahrgenommenem Mangel\nBeispiele:        Verhaltensweisen: Betrachten im Spiegel, exzessive Körperpflege,\n               Rückmeldungen einholen, Skin Picking, Gedanken: mit anderen vergleichen\nWichtig:         Beeinträchtigung/Leiden, ggf. wurden schon chirurgische Eingriffe in Betracht\n                gezogen oder vorgenommen\nBestimme, ob:    Muskeldysmorphie, mit guter/angemessener Einsicht, wenig Einsicht oder ohne\n                  Einsicht/wahnhaften Überzeugungen\n\n\n\n\n\nKörperdysmorphe Störung                                                   Ja     Nein\nExzessive Beschäftigung mit Mängeln im Erscheinungsbild\nWiederholte Verhaltensweisen/mentale Vorgänge\nLeiden oder Beeinträchtigungen\n\n\n\n\n27                     Copyright © 2017 Margraf & Cwik","navTitle":"Körperdysmorphe störung (kds)","when":{"op":"or","conditions":[{"op":"notAllNo","fields":["p24_kds"]},{"op":"and","conditions":[{"op":"or","conditions":[{"op":"notAllNo","fields":["p24_zg","p24_zh"]},{"op":"manual","section":"p26"}]},{"op":"eq","field":"p26_distress","value":"no"}]}]},"dependsOn":["p24_kds","p24_zg","p24_zh","p26_distress"],"rules":[{"after":"p28_no_distress_route","condition":{"op":"eq","field":"p28_distress","value":"no"},"target":"p30","text":"Falls NEIN, weiter zu SCREENING: TRAUMAFOLGESPEKTRUM (S. 30)"}],"criteria":[{"title":"Körperdysmorphe Störung","items":[{"id":"c27_1","text":"Exzessive Beschäftigung mit Mängeln im Erscheinungsbild","type":"yn"},{"id":"c27_2","text":"Wiederholte Verhaltensweisen/mentale Vorgänge","type":"yn"},{"id":"c27_3","text":"Leiden oder Beeinträchtigungen","type":"yn"}]}]},{"id":"p30","page":30,"title":"SCREENING: TRAUMAFOLGESPEKTRUM","kind":"screen","blocks":[{"id":"p30_psychisches_trauma","type":"info","text":"Psychisches Trauma"},{"id":"p30_trauma_definition","type":"info","text":"Trauma: z. B. Vergewaltigung, andere Gewaltverbrechen, Naturkatastrophen, Unfälle, Tod einer sehr nahestehenden Person, grausame Details (Ersthelfer an Unfallort)"},{"id":"p30_konfrontation_definition","type":"info","text":"Konfrontation: Direkte Konfrontation, beobachten, einer nahestehenden Person widerfahren (keine Anwesenheit erforderlich) oder über Medien konfrontiert (nur im Rahmen beruflicher Tätigkeiten"},{"id":"p30_trauma_selbst_zeuge","type":"yn","text":"Haben Sie schon einmal ein extrem belastendes, lebensbedrohliches oder traumatisches Ereignis erlebt oder mitansehen müssen, nach dem es Ihnen sehr schlecht ging, wie z. B. eine Vergewaltigung, ein Unfall, andere Gewalttaten oder Naturkatastrophen?"},{"id":"p30_trauma_nahestehende","type":"yn","text":"Ist einer Ihnen nahestehenden Person ein extrem belastendes oder traumatisches Ereignis widerfahren oder ist sie auf eine grausame Art fast oder tatsächlich ums Leben gekommen?"},{"id":"p30_mehrere_traumata","type":"yn","text":"Haben Sie mehrere solcher belastenden oder traumatischen Ereignisse erlebt?"},{"id":"p30_trauma_vier_wochen","type":"info","text":"Hat das belastende Ereignis innerhalb der letzten 4 Wochen stattgefunden?"},{"id":"p30_trauma_beschreibung","type":"text","text":"Beschreiben:"},{"id":"_trauma_recent","type":"yn","extra":true,"text":"Ist nach fachlicher Klärung mindestens eines der Ereignisse innerhalb des letzten Monats einzuordnen?","note":"Die Vorlage fragt nach „4 Wochen“, die Sprunganweisung nennt „letzten Monat“. Die Zuordnung erfolgt hier bewusst durch die Fachperson, nicht durch eine Text- oder Datumsautomatik.","when":{"op":"notAllNo","fields":["p30_trauma_selbst_zeuge","p30_trauma_nahestehende","p30_mehrere_traumata"]}},{"id":"p30_route_trauma_zeitpunkt","type":"info","text":"Falls eines der Ereignisse innerhalb des letzten Monats stattgefunden hat, weiter zur Akuten Belastungsstörung, sonst weiter zur Posttraumatischen Belastungsstörung."},{"id":"p30_route_kein_trauma","type":"info","text":"Wenn KEIN traumatisches Ereignis erlebt wurde, weiter zu SCREENING: SPEKTRUM PROBLEMATISCHEN ESSVERHALTENS (S. 36)"}],"navTitle":"Traumafolgespektrum"},{"id":"p32","page":32,"title":"AKUTE BELASTUNGSSTÖRUNG","kind":"module","blocks":[{"id":"p32_konfrontation","type":"choice","text":"Wie fand die Konfrontation statt (Ihnen selbst widerfahren, Zeuge gewesen, einer nahestehenden Person widerfahren, indirekt, über Medien im Rahmen einer beruflichen Tätigkeit)?","options":["SELBST","BEOBACHTET","NAHESTEHENDER PERSON","INDIREKT"]},{"id":"p32_ereignis_zeitpunkt_frage","type":"info","text":"Wann hat das belastende Ereignis stattgefunden und worum handelte es sich?"},{"id":"p32_ereignis_beschreibung","type":"text","text":"Beschreiben:"},{"id":"p32_symptome_einleitung","type":"info","text":"Welche der folgenden Dinge treffen auf Sie zu?"},{"id":"p32_wiedererleben","type":"yn","text":"Erleben Sie eine deutliche Belastung, wenn Sie an das Ereignis erinnert werden, träumen Sie davon oder haben Sie das Gefühl das Ereignis erneut zu durchleben?"},{"id":"p32_positive_gefuehle","type":"yn","text":"Fühlen Sie sich anhaltend unfähig, positive Gefühle zu spüren?"},{"id":"p32_erinnerung_wahrnehmung","type":"yn","text":"Haben Sie Erinnerungslücken in Bezug auf das Ereignis oder manchmal das Gefühl einer veränderten Wahrnehmung der Umgebung oder von sich selbst?"},{"id":"p32_vermeidung","type":"yn","text":"Vermeiden Sie es, an das Ereignis erinnert zu werden?"},{"id":"p32_erregung","type":"yn","text":"Leiden Sie seit dem Ereignis unter Schlafproblemen, Reizbarkeit, Konzentrationsschwierigkeiten, erhöhter Wachsamkeit oder Schreckhaftigkeit?"},{"id":"p32_beschwerden_beginn","type":"number","text":"Wann sind diese Beschwerden (nach dem Ereignis) aufgetreten?","unit":"TAGE","min":0},{"id":"_trauma_further","type":"choice","extra":true,"text":"Wie ist nach der akuten Abklärung weiter vorzugehen?","options":["Kein weiteres Trauma","Weiteres Trauma: PTBS-Abklärung","Weiteres Trauma: gesonderte akute Abklärung erforderlich"],"note":"Die PDF nennt bei „KEIN weiteres Trauma“ S. 36, für weitere Ereignisse aber kein ausdrückliches Sprungziel. Ein weiteres akutes Ereignis separat dokumentieren, nicht automatisch der PTBS zuordnen."},{"id":"p32_route_kein_weiteres_trauma","type":"info","text":"Falls KEIN weiteres Trauma, weiter zu SCREENING: SPEKTRUM PROBLEMATISCHEN ESSVERHALTENS (S. 36)"}],"reference":"Akute Belastungsstörung (F43.0)\n\nHauptmerkmal:  Spezifische Symptommuster als Folge eines massiven psychischen Traumas\nSymptommuster: Furcht/Vermeidung traumarelevanter Reize, häufigs/intensives intrusives\n                 Wiedererleben (Alptrauma, Tagträume, Flashbacks), negative Gefühle und\n                    gleichzeitig erhöhte Erregung\n                 Mindestens 9 von 14 Symptomen, begonnen oder verschlechtert nach dem letzten\n                  traumatischen Ereignis\nBeeinträchtigung: Symptome müssen klinisch bedeutsames Leiden/Beeinträchtigung verursachen\nVerlauf:          Frühestens 3 Tage und höchstens 1 Monat nach Trauma vergeben\nWichtig:        Die Symptome können direkt nach dem Ereignis auftreten, müssen aber\n                 mindestens bis zum 3. Tag nach dem Ereignis anhalten\n\n\n\n\n\nAkute Belastungsstörung                                                     Ja     Nein\nErleben von Tod/Lebensbedrohung/ernsthafter Verletzung/sexueller Gewalt\nMind. 9 Symptomen aus den 5 Kategorien:\nIntrusionen\nNegative Stimmung\nDissoziative Symptome\nVermeidungssymptome\nArousal Symptome\nDauer: 3 Tage - 1 Monat\nLeiden oder Beeinträchtigungen\n\n31                     Copyright © 2017 Margraf & Cwik","navTitle":"Akute belastungsstörung","when":{"op":"and","conditions":[{"op":"notAllNo","fields":["p30_trauma_selbst_zeuge","p30_trauma_nahestehende","p30_mehrere_traumata"]},{"op":"ne","field":"_trauma_recent","value":"no"}]},"dependsOn":["p30_trauma_selbst_zeuge","p30_trauma_nahestehende","p30_mehrere_traumata","_trauma_recent"],"criteria":[{"title":"Akute Belastungsstörung","items":[{"id":"c31_1","text":"Erleben von Tod/Lebensbedrohung/ernsthafter Verletzung/sexueller Gewalt","type":"yn"},{"id":"c31_2","text":"Mind. 9 Symptomen aus den 5 Kategorien:","type":"info"},{"id":"c31_3","text":"Intrusionen","type":"yn"},{"id":"c31_4","text":"Negative Stimmung","type":"yn"},{"id":"c31_5","text":"Dissoziative Symptome","type":"yn"},{"id":"c31_6","text":"Vermeidungssymptome","type":"yn"},{"id":"c31_7","text":"Arousal Symptome","type":"yn"},{"id":"c31_8","text":"Dauer: 3 Tage - 1 Monat","type":"yn"},{"id":"c31_9","text":"Leiden oder Beeinträchtigungen","type":"yn"}]}]},{"id":"p34","page":34,"title":"POSTTRAUMATISCHE BELASTUNGSSTÖRUNG","kind":"module","blocks":[{"id":"p34_konfrontation","type":"choice","text":"Wie fand die Konfrontation statt (Ihnen selbst widerfahren, Zeuge gewesen, einer nahestehenden Person widerfahren, indirekt, über Medien im Rahmen einer beruflichen Tätigkeit)?","options":["SELBST","BEOBACHTET","NAHESTEHENDER PERSON","INDIREKT"]},{"id":"p34_ereignis_zeitpunkt_frage","type":"info","text":"Wann hat das belastende Ereignis stattgefunden und worum handelte es sich?"},{"id":"p34_ereignis_beschreibung","type":"text","text":"Beschreiben:"},{"id":"p34_symptome_einleitung","type":"info","text":"Welche der folgenden Dinge treffen auf Sie zu?"},{"id":"p34_wiedererleben","type":"yn","text":"Erleben Sie eine deutliche Belastung, wenn Sie an das Ereignis erinnert werden, träumen Sie davon oder haben Sie das Gefühl das Ereignis erneut zu durchleben?"},{"id":"p34_vermeidung","type":"yn","text":"Vermeiden Sie es, an das Ereignis erinnert zu werden?"},{"id":"p34_negative_gefuehle_gedanken","type":"yn","text":"Beobachten Sie bei sich durch das Ereignis vor allem negative Gefühle oder Gedanken, oder haben Sie Erinnerungslücken in Bezug auf das Ereignis?"},{"id":"p34_erregung","type":"yn","text":"Leiden Sie seit dem Ereignis unter Schlafproblemen, Reizbarkeit, Konzentrationsschwierigkeiten, erhöhter Wachsamkeit oder Schreckhaftigkeit?"},{"id":"p34_dauer_ein_monat","type":"yn","text":"Haben diese Beschwerden mindestens 1 Monat angehalten?"}],"reference":"Posttraumatische Belastungsstörung (F43.1)\n\nHauptmerkmal:  Spezifische Symptommuster als Folge eines massiven psychischen Traumas\nTrauma:           z. B. Vergewaltigung, andere Gewaltverbrechen, Naturkatastrophen, Unfälle\nKonfrontation:   Direkte Konfrontation, beobachten, einer nahestehenden Person widerfahren (keine\n                Anwesenheit erforderlich) oder über Medien konfrontiert (nur im Rahmen\n                   beruflicher Tätigkeiten\nSymptommuster: Furcht/Vermeidung traumarelevanter Reize, häufigs/intensives intrusives\n                 Wiedererleben (Alptrauma, Tagträume, Flashbacks), veränderte Gedanken und\n                 Gefühle und gleichzeitig erhöhte Erregung\nWiedererleben:  mindestens 1 von 5 Symptomen\nVermeidung:     mindestens 1 von 2 Symptomen\nAnhaltende\nÜbererregung:   mindestens 2 von 6 Symptomen\nVeränderungen\nin Gedanken und\nGefühlen:        mindestens 2 von 7 Symptomen\n\nBeeinträchtigung: Symptome müssen klinisch bedeutsames Leiden/Beeinträchtigung verursachen\nVerlauf:          Frühestens 1 Monat nach Trauma vergeben, vorher ist bei vorliegender\n                Symptomatik eine Akute Belastungsstörung in Betracht zu ziehen, eine\n                  Posttraumatische Belastungsstörung mit verzögertem Beginn liegt vor, wenn die\n              Symptome frühestens 6 Monate nach dem Trauma auftreten\nDauer:          Die Symptome müssen mindestens 1 Monat bestehen\nBestimme, ob:    Für eine Posttraumatische Belastungsstörung mit dissoziativen Symptomen müssen\n                   zusätzlich Symptome der Derealisation (z. B. unbeteiligt am eigenen Erleben und\n                  Verhalten fühlen, wie in Watte gepackt fühlen) oder Depersonalisation (z. B. sich\n                    selbst von außerhalb des Körpers beobachten) vorliegen\n\n\n\n\n\nPosttraumatische Belastungsstörung                                           Ja     Nein\nErleben von Tod/Lebensbedrohung/ernsthafte Verletzung/sexuelle Gewalt\nMind. 1 intrusives Symptom\nMind. 1 Vermeidungssymptom\nMind. 2 Symptome veränderter negativer Stimmung/Kognitionen\nMind. 2 Arousal Symptome\nDauer: mehr als 1 Monat\nLeiden oder Beeinträchtigungen\n\n\n33                     Copyright © 2017 Margraf & Cwik","navTitle":"Posttraumatische belastungsstörung","when":{"op":"and","conditions":[{"op":"notAllNo","fields":["p30_trauma_selbst_zeuge","p30_trauma_nahestehende","p30_mehrere_traumata"]},{"op":"or","conditions":[{"op":"eq","field":"_trauma_recent","value":"no"},{"op":"and","conditions":[{"op":"ne","field":"_trauma_recent","value":"no"},{"op":"ne","field":"_trauma_further","value":"Kein weiteres Trauma"},{"op":"ne","field":"_trauma_further","value":"Weiteres Trauma: gesonderte akute Abklärung erforderlich"}]}]}]},"dependsOn":["p30_trauma_selbst_zeuge","p30_trauma_nahestehende","p30_mehrere_traumata","_trauma_recent","_trauma_further"],"criteria":[{"title":"Posttraumatische Belastungsstörung","items":[{"id":"c33_1","text":"Erleben von Tod/Lebensbedrohung/ernsthafte Verletzung/sexuelle Gewalt","type":"yn"},{"id":"c33_2","text":"Mind. 1 intrusives Symptom","type":"yn"},{"id":"c33_3","text":"Mind. 1 Vermeidungssymptom","type":"yn"},{"id":"c33_4","text":"Mind. 2 Symptome veränderter negativer Stimmung/Kognitionen","type":"yn"},{"id":"c33_5","text":"Mind. 2 Arousal Symptome","type":"yn"},{"id":"c33_6","text":"Dauer: mehr als 1 Monat","type":"yn"},{"id":"c33_7","text":"Leiden oder Beeinträchtigungen","type":"yn"}]}]},{"id":"p36","page":36,"title":"SCREENING: SPEKTRUM PROBLEMATISCHEN ESSVERHALTENS","kind":"screen","blocks":[{"id":"p36_untergewicht_definition","type":"info","text":"Deutliches Untergewicht: Körpergewicht mindestens 15% geringer als nach dem Body Mass Index (BMI) zu erwarten"},{"id":"p36_bmi_definition","type":"info","text":"BMI: Körpergewicht (kg) geteilt durch die quadrierte Körpergröße (m2), d.h. BMI=kg/ m2"},{"id":"p36_bmi_interpretation","type":"info","text":"Faustregel für die Interpretation von BMI-Werten: (BMI)"},{"id":"p36_bmi_anorektisch","type":"info","text":"Definitiv anorektisch \u003c17"},{"id":"p36_bmi_untergewicht","type":"info","text":"Untergewicht (möglicherweise anorektisch) 17–18,49"},{"id":"p36_bmi_normalgewicht","type":"info","text":"Normalgewicht 18,5–24,99"},{"id":"p36_bmi_uebergewicht","type":"info","text":"Übergewicht 25–29,99"},{"id":"p36_bmi_adipositas_i","type":"info","text":"Adipositas Grad I 30-34,9"},{"id":"p36_bmi_adipositas_ii","type":"info","text":"Adipositas Grad II 35-39,9"},{"id":"p36_bmi_adipositas_iii","type":"info","text":"Adipositas Grad III ≥40"},{"id":"p36_gewicht_einleitung","type":"info","text":"Nun werde ich Ihnen einige Fragen zu Ihrem Gewicht stellen."},{"id":"p36_groesse_gewicht_frage","type":"info","text":"Wie groß sind Sie und wie viel wiegen Sie?"},{"id":"p36_koerpergroesse","type":"number","text":"","min":0,"inputLabel":"Körpergröße","unit":"cm","note":"Digitale Feldbeschriftung und Einheit (cm); die Antwortlinie im Original ist unbeschriftet."},{"id":"p36_koerpergewicht","type":"number","text":"","min":0,"inputLabel":"Körpergewicht","unit":"kg","note":"Digitale Feldbeschriftung und Einheit (kg); die Antwortlinie im Original ist unbeschriftet."},{"id":"p36_gewicht_objektiv","type":"info","text":"(Bei Verdacht auf Essstörung Gewicht objektiv nachprüfen)"},{"id":"p36_gewicht_extrema_frage","type":"info","text":"Wie war Ihr niedrigstes bzw. höchstes Gewicht im Erwachsenenalter?"},{"id":"p36_gewicht_niedrigstes","type":"number","text":"","min":0,"inputLabel":"Niedrigstes Gewicht im Erwachsenenalter","unit":"kg","note":"Digitale Feldbeschriftung und Einheit (kg); die Antwortlinie im Original ist unbeschriftet."},{"id":"p36_gewicht_hoechstes","type":"number","text":"","min":0,"inputLabel":"Höchstes Gewicht im Erwachsenenalter","unit":"kg","note":"Digitale Feldbeschriftung und Einheit (kg); die Antwortlinie im Original ist unbeschriftet."},{"id":"p36_an_abnehmen","type":"screen","text":"AN: Haben Sie zuletzt stark abgenommen oder essen Sie absichtlich wenig, um an Gewicht zu verlieren? Kam das früher vor?","options":["aktuell","früher","beides","nein"]},{"id":"p36_route_an","type":"info","text":"⎣ S. 38"},{"id":"p36_an_bn_gewichtsangst","type":"screen","text":"AN/BN: Haben Sie große Angst davor zu dick zu sein oder zu werden bzw. machen Sie sich große Sorgen um Ihre Figur oder Ihr Gewicht? Kam das früher vor?","options":["aktuell","früher","beides","nein"]},{"id":"p36_route_an_bn","type":"info","text":"⎣ S. 38/40"},{"id":"p36_an_bn_be_essanfaelle","type":"screen","text":"AN/BN/BE: Haben Sie Heißhungerphasen oder Essanfälle, d.h. dass Sie sehr viel in sehr kurzer Zeit gegessen? Kam das früher vor?","options":["aktuell","früher","beides","nein"]},{"id":"p36_route_an_bn_be","type":"info","text":"⎣ S. 38/40"},{"id":"p36_route_nein","type":"info","text":"Falls NEIN, weiter zu SCREENING: SOMATISCHER BELASTUNGEN (S. 42)"},{"id":"p36_abgrenzung_an_bn","type":"info","text":"Abgrenzung Anorexie/Bulimie: Wenn Essanfälle gleichzeitig mit Anorexie auftreten, dann wird keine zusätzliche Bulimie-Diagnose gegeben. Beide Diagnosen können nur gemeinsam gegeben werden, wenn sie sich zeitlich nicht vollständig überlappen."},{"id":"p36_abgrenzung_bn_be","type":"info","text":"Abgrenzung Bulimie/Binge-Eating: Bei Bulimie werden nach Essanfällen kompensatorische Maßnahmen vorgenommen (einzelne Diäten allerdings möglich), Binge-Eating mehr Leidensdruck."},{"id":"p36_binge_eating_definition","type":"info","text":"Binge-Eating: Essanfall, verbunden mit dem Verzehr einer Nahrungsmenge in einem Zeitraum, die erheblich größer ist als die Menge, die die meisten Menschen in dem Zeitraum essen würden. Während des Essanfalls besteht ddas Gefühl die Kontrolle über das Essverhalten zu verlieren."}],"navTitle":"Spektrum problematischen essverhaltens"},{"id":"p38","page":38,"title":"ANOREXIA NERVOSA (AN)","kind":"module","blocks":[{"id":"p38_gewichtszunahme_verhindern","type":"yn","text":"Tun Sie etwas, um einer Gewichtszunahme entgegenzuwirken?"},{"id":"p38_massnahmen_beschreibung","type":"text","text":"Beschreiben:"},{"id":"p38_koerperbild","type":"yn","text":"Fühlen Sie sich insgesamt oder an Teilen Ihres Körpers zu dick?"},{"id":"p38_selbstwert","type":"yn","text":"Ist Ihr Gewicht oder Ihre Figur wichtig für Ihren Selbstwert?"}],"reference":"Anorexia Nervosa (F50.0x)\n\nHauptmerkmal:  Signifikant niedriges Körpergewicht oder in Relation zum Energiebedarf\n                  eingeschränkte Gewichtszunahme, die zu signifikant niedrigem Körpergewicht\n                     führt.\nNotwendig:      extreme Furcht vor dem Dickwerden, krasse Körperschemaverzerrungen (trotz\n                 deutlichem Untergewicht zu dick)\nHäufig:           übertriebener Sport, Missbrauch von Abführmitteln oder Appetitzüglern, meist\n                  keine Krankheitseinsicht oder Leugnungstendenz\n                 Weitaus häufiger bei Frauen\nTypus:           Restriktiver Typus (F50.01): Während der letzten 3 Monate der Anorexia\n                Nervosa hat die Person keine regelmäßigen Essanfälle gehabt oder hat kein\n                  „Purging-Verhalten“ (das heißt selbstinduziertes Erbrechen oder Missbrauch von\n                  Laxantien, Diuretika oder Klistieren) gezeigt\n                Binge-Eating/Purging-Typus (F50.02): Während der letzten 3 Monate der\n                 Anorexia Nervosa hat die Person regelmäßig Essanfälle gehabt und hat\n                  Purgingverhalten (d.h. selbstinduziertes Erbrechen oder Missbrauch von Laxantien,\n                  Diuretika oder Klistieren) gezeigt\nBestimme, ob:    Teilweise Remission: nach Erfüllung aller Störungkriterien liegt nur noch Angst\n                 vor Gewichtszunahme oder Körperschemaverzerrung erfüllt\n                 Volle Remission: nach Erfüllung aller Störungkriterien wird kein Störungkriterium\n               mehr erfüllt\n                Schweregrad: leicht (BMI 18,49 - 17 kg/m2), mittelgradig (BMI 16-16,99 kg/m2),\n                schwer (BMI 15-15,99kg/m2), extrem (BMI \u003c 15 kg/m2)\n\n\n\n\n\nAnorexia Nervosa                                                           Ja     Nein\nEingeschränkte Kalorienzunahme mit signifikant niedrigem Körpergewicht\nIntensive Angst vor Gewichtszunahme/Verhinderung von Gewichtszunahme\nStörung in der Körperwahnehmung\n\n\n37                     Copyright © 2017 Margraf & Cwik","navTitle":"Anorexia nervosa (an)","when":{"op":"notAllNo","fields":["p36_an_abnehmen","p36_an_bn_gewichtsangst","p36_an_bn_be_essanfaelle"]},"dependsOn":["p36_an_abnehmen","p36_an_bn_gewichtsangst","p36_an_bn_be_essanfaelle"],"criteria":[{"title":"Anorexia Nervosa","items":[{"id":"c37_1","text":"Eingeschränkte Kalorienzunahme mit signifikant niedrigem Körpergewicht","type":"yn"},{"id":"c37_2","text":"Intensive Angst vor Gewichtszunahme/Verhinderung von Gewichtszunahme","type":"yn"},{"id":"c37_3","text":"Störung in der Körperwahnehmung","type":"yn"}]}]},{"id":"p40","page":40,"title":"BULIMIA NERVOSA (BN) / BINGE EATING STÖRUNG (BE)","kind":"module","blocks":[{"id":"p40_kontrollverlust","type":"yn","text":"Haben Sie während der Essanfälle das Gefühl, Sie könnten sich nicht mehr kontrollieren?"},{"id":"p40_essanfaelle_drei_monate","type":"yn","text":"Haben Sie einmal drei Monate lang mindestens ein Mal pro Woche Essanfälle gehabt?"},{"id":"p40_kompensation","type":"yn","text":"Haben Sie etwas unternommen, um nicht durch die Essanfälle zuzunehmen?"},{"id":"p40_route_bn_be","type":"info","text":"Falls JA: BULIMIA NERVOSA; falls NEIN: BINGE-EATING STÖRUNG"}],"reference":"Bulimia Nervosa (F50.2)\n\nHauptmerkmal:  wiederholte Essanfälle mit subjektivem Kontrollverlust, ständige Sorge um\n                 Figur/Gewicht\nGegenmaßnahmen:  Erbrechen, Fasten, Abführmittel/Appetitzügler\nHäufigkeits-\nKriterium:       Mindestens 3 Monate lang mindestens 1 Essanfall/Woche\nUntergewicht:   Im Gegensatz zur Anorexia Nervosa nicht notwendig\n                 Häufig depressive Verstimmungen, Verheimlihcung aus Scham, v.a. Frauen\n                   betroffen\nBestimme, ob:    Teilweise Remission: nach Erfüllung aller Störungkriterien wird nur noch ein Teil\n                      erfüllt\n                 Volle Remission: nach Erfüllung aller Störungkriterien wird kein Störungkriterium\n               mehr erfüllt\n                Schweregrad: leicht (1-3 Episoden/Woche), mittelgradig (4-7 Episoden/Woche),\n                schwer (8-13 Episoden/Woche), extrem (14 oder mehr Episoden/Woche)\n\nBinge-Eating Störung (F50.8)\n\nHauptmerkmal:  wiederholte Essanfälle mit subjektivem Kontrollverlust\nHäufigkeits-\nKriterium:       Mindestens 3 Monate lang mindestens 1 Essanfall/Woche\nNotwendig:       Schnelleres Essen, Völlegefühl, über den Hunger essen, alleine Essen aus Scham,\n                  negative Gefühle aufgrund von Essanfällen\nWichtig:         kein kompensatorisches Verhalten\nBestimme, ob:    Teilweise Remission: nach Erfüllung aller Störungkriterien jetzt weniger als 1\n                   Essanfall pro Woche\n                 Volle Remission: nach Erfüllung aller Störungkriterien wird kein Störungkriterium\n               mehr erfüllt\n                Schweregrad: leicht (1-3 Episoden/Woche), mittelgradig (4-7 Episoden/Woche),\n                schwer (8-13 Episoden/Woche), extrem (14 oder mehr Episoden/Woche)\n\n\n\n\n\nBulimia Nervosa                                                            Ja     Nein\nWiederkehrende Binge-Eating Episoden\nKompensationsverhalten (mind. 1 x Woche, mind. 3 Monate)\nSelbstbewertung durch Körperform und Gewicht\nNicht ausschließlich während Anorexia Nervosa\n\n\n\n\nBinge-Eating Störung                                                        Ja     Nein\nWiederkehrende Binge-Eating Episoden\nEssanfälle gemeinsam mit mind. 3 Merkmalen\nLeidensdruck\nDauer: mind. 1 x Woche, mind. 3 Monate\nKeine kompensatorischen Maßnahmen\n\n\n39                     Copyright © 2017 Margraf & Cwik","navTitle":"Bulimia nervosa (bn) / binge eating störung (be)","when":{"op":"notAllNo","fields":["p36_an_bn_gewichtsangst","p36_an_bn_be_essanfaelle"]},"dependsOn":["p36_an_bn_gewichtsangst","p36_an_bn_be_essanfaelle"],"criteria":[{"title":"Bulimia Nervosa","items":[{"id":"c39_1","text":"Wiederkehrende Binge-Eating Episoden","type":"yn"},{"id":"c39_2","text":"Kompensationsverhalten (mind. 1 x Woche, mind. 3 Monate)","type":"yn"},{"id":"c39_3","text":"Selbstbewertung durch Körperform und Gewicht","type":"yn"},{"id":"c39_4","text":"Nicht ausschließlich während Anorexia Nervosa","type":"yn"}],"when":{"op":"ne","field":"p40_kompensation","value":"no"}},{"title":"Binge-Eating Störung","items":[{"id":"c39_5","text":"Wiederkehrende Binge-Eating Episoden","type":"yn"},{"id":"c39_6","text":"Essanfälle gemeinsam mit mind. 3 Merkmalen","type":"yn"},{"id":"c39_7","text":"Leidensdruck","type":"yn"},{"id":"c39_8","text":"Dauer: mind. 1 x Woche, mind. 3 Monate","type":"yn"},{"id":"c39_9","text":"Keine kompensatorischen Maßnahmen","type":"yn"}],"when":{"op":"ne","field":"p40_kompensation","value":"yes"}}]},{"id":"p42","page":42,"title":"SCREENING: SOMATISCHER BELASTUNGEN","kind":"screen","blocks":[{"id":"p42_allgemeines","type":"info","text":"Allgemein zu Somatischen Belastungs- und verwandten Störungen"},{"id":"p42_bisherige_versorgung","type":"info","text":"Bisherige Versorgung: Patienten mit Störungen aus diesem Störungsbereich sind meist bereits in eine medizinische Versorgung eingebunden, hingegen selten in eine psychiatrische oder psychotherapeutische Versorgung."},{"id":"p42_organische_ursachen","type":"info","text":"Abklärung organischer Ursachen: Nicht immer muss jegliche Beteiligung organischer Faktoren ausgeschlossen sein, evtl. stehen Beschwerden nur in keinem angemessenen Zusammenhang mit objektivierbaren oragnischen Bedigungen."},{"id":"p42_koerperliche_beschwerden","type":"yn","text":"Haben Sie gegenwärtig körperliche Beschwerden oder Krankheiten?"},{"id":"p42_beschwerden_beschreibung","type":"text","text":"Beschreiben:"},{"id":"p42_befinden_einleitung","type":"info","text":"Ich möchte Ihnen jetzt einige Fragen zu Ihrem körperlichen Befinden stellen:"},{"id":"p42_sbs_probleme","type":"screen","text":"SBS: Haben Sie viele körperliche Probleme? Kam das früher vor?","options":["aktuell","früher","beides","nein"]},{"id":"p42_route_sbs","type":"info","text":"⎣ S. 44"},{"id":"p42_kas_krankheitsangst","type":"screen","text":"KAS: Fürchten Sie öfters, dass Sie eine schwere Krankheit haben oder bekommen könnten? Kam das früher vor?","options":["aktuell","früher","beides","nein"]},{"id":"p42_route_kas","type":"info","text":"⎣ S. 46"},{"id":"p42_route_nein","type":"info","text":"Falls NEIN, weiter zu SCREENING: ABHÄNGIGKEITSSPEKTRUM (S. 48)"},{"id":"p42_abgrenzung_sbs_kas","type":"info","text":"Falls körperliche Beschwerden und Krankheitsangst vorliegen, sollte eine Somatische Belastungsstörung vergeben werden."}],"navTitle":"Somatischer belastungen"},{"id":"p44","page":44,"title":"SOMATISCHE BELASTUNGSSTÖRUNG (SBS)","kind":"module","blocks":[{"id":"p44_lebensstil_medikamente","type":"yn","text":"Haben Sie aufgrund der körperlichen Probleme Ihren Lebensstil verändert oder Medikamente eingenommen?"},{"id":"p44_symptome_einleitung","type":"info","text":"Treffen die folgenden Dinge bezogen auf Ihre körperlichen Probleme zu?"},{"id":"p44_gedanken_bedeutung","type":"yn","text":"... machen Sie sich häufig Gedanken über die Bedeutung dieser körperlichen Probleme?"},{"id":"p44_gesundheitsangst","type":"yn","text":"... haben Sie Angst um Ihre Gesundheit aufgrund der Probleme?"},{"id":"p44_energie_zeit","type":"yn","text":"... investieren Sie viel Energie oder verbringen Sie viel Zeit damit, sich mit den körperlichen Problemen oder den Sorgen über diese Probleme zu beschäftigen?"},{"id":"p44_falls_ja_beschreiben","type":"info","text":"Falls JA, beschreiben:","when":{"op":"notAllNo","fields":["p44_gedanken_bedeutung","p44_gesundheitsangst","p44_energie_zeit"]}},{"id":"p44_beschreibung","type":"text","text":"Beschreiben:","when":{"op":"notAllNo","fields":["p44_gedanken_bedeutung","p44_gesundheitsangst","p44_energie_zeit"]}},{"id":"p44_dauer_sechs_monate","type":"yn","text":"Haben diese Beschwerden mindestens 6 Monate angehalten?"}],"reference":"Somatische Belastungsstörung (F45.1)\n\nHauptmerkmal:  vorliegen einer oder mehr belastender oder im Alltag beeinträchtigender\n                  körperlichen Beschwerden\nNotwendig:      Mindestens 1 der nebenstehenden 3 Symptome\nDauer:           Typischerweise länger als 6 Monate (somatische Symptome können sich ändern)\nWichtig:       Symptome können auch ohne Zusammenhang zu einem medizinischen\n                  Krankheitsfaktor vorliegen; auf direkte Nachfrage hinsichtlich der Belastung\n                  schreiben einige Betroffene diese anderen Ursachen als den körperlichen\n                Problemen zu\nHäufig:        Hohe Inanspruchnahme medizinischer Versorgung\n\nAbgrenzung:     Krankheitsangststörung: Somatische Belastungsfaktoren müssen vorliegen\nBestimme, ob:   Mit vordergründigem Schmerz: Somatische Belastungsfaktoren verursachen\n                 vorallem Schmerzen\n                Chronisch: Schwere Symptome mit intensiver Beeinträchtigung und langer Dauer\n                (mehr als 6 Monate)\n                Schweregrad: leicht (nur 1 Symptom), mittelgradig (2 oder mehr Symptome),\n                schwer (2 oder mehr Symptome und ein schweres somatisches Symptom oder\n                   multiple somatische Beschwerden)\n\n\n\n\n\nSomatische Belastungsstörung                                                 Ja     Nein\nMind. 1 belastendes/beeinträchtigendes somatisches Symptom\nExzessive Gedanken/Gefühle/Verhalten\nDauer: mind. 6 Monate\n\n43                     Copyright © 2017 Margraf & Cwik","navTitle":"Somatische belastungsstörung (sbs)","when":{"op":"notAllNo","fields":["p42_sbs_probleme"]},"dependsOn":["p42_sbs_probleme"],"criteria":[{"title":"Somatische Belastungsstörung","items":[{"id":"c43_1","text":"Mind. 1 belastendes/beeinträchtigendes somatisches Symptom","type":"yn"},{"id":"c43_2","text":"Exzessive Gedanken/Gefühle/Verhalten","type":"yn"},{"id":"c43_3","text":"Dauer: mind. 6 Monate","type":"yn"}]}]},{"id":"p46","page":46,"title":"KRANKHEITSANGSTSTÖRUNG (KAS)","kind":"module","blocks":[{"id":"p46_beginn_krankheit","type":"yn","text":"Seit wann fürchten bzw. glauben Sie, eine schwere körperliche Krankheit zu haben und um welche Krankheit handelt es sich?"},{"id":"p46_krankheit_beschreibung","type":"text","text":"Beschreiben:"},{"id":"p46_arztbesuche","type":"yn","text":"Suchen Sie aufgrund dieser Befürchtungen häufiger Ärzte auf?"},{"id":"p46_vermeidung","type":"yn","text":"Vermeiden Sie Ärzte, Krankenhäuser oder Kranke, weil der Kontakt Ihre Befürchtungen/Überzeugungen verschlimmern könnte oder Sie eine Gefahr befürchten?"},{"id":"p46_rueckversicherung","type":"yn","text":"Führen Sie bestimmte Verhaltensweisen in Bezug auf Ihre Angst immer wieder durch, um sich zu beruhigen (z. B. Abtasten, Rückversichern, im Spiegel betrachten, Internetsuche)?"},{"id":"p46_falls_ja_beschreiben","type":"info","text":"Falls JA, beschreiben:","when":{"op":"ne","field":"p46_rueckversicherung","value":"no"}},{"id":"p46_verhalten_beschreibung","type":"text","text":"Beschreiben:","when":{"op":"ne","field":"p46_rueckversicherung","value":"no"}}],"reference":"Krankheitsangststörung (F45.21)\n\nHauptmerkmal:  Unrealistische, starke Überzeugung/Befürchtung, eine (oder mehrere) schwere\n                   körperliche Erkrankung zu haben\nNotwendig:       starke Angst um und schnelle Verunsicherung in Bezug auf Gesundheit, exzessive\n                 gesundheitsbezogene Verhaltensweisen (z. B. Checking-Behavior) oder\n                  dysfunktionale Vermeidung (z. B. Krankenhäuser, Ärzte oder kranke Personen)\nInterpretation:   Deutung körperlicher Empfindungen/Merkmale als Krankheitszeichen oder –\n                 beweise\nKrankheitsüber-\nzeugung:       Auch durch sorgfältige ärztliche Untersuchung nicht dauerhaft beseitigbar\nAufmerksamkeit: chronische Beschäftigung mit dem eigenen Körper\nVerlauf:         Meist chronisch, Art der Krankheitsbefürchtungen kann wechseln\nAbgrenzung:     Somatische Belastungsstörung: Bei Krankheitsangststörung dürfen somatische\n              Symptome nicht vorhanden sein oder nur in einem geringen Ausmaß. Nicht\n               Symptome, sondern Beschäftigung mit schwerer Krankheit im Zentrum der\n                 Aufmerksamkeit; nicht allgemeine Kränklichkeit, sondern eher einzelne\n                   katastrophale Krankheit (z. B. Krebs, AIDS).\nBestimme, ob:   Aufsuchender Typus:  Häufiges Aufsuchen von medizinischer Maßnahmen oder\n                 Untersuchungen.\n               Vermeidender Typus: Medizinische Maßnahmen werden möglichst vermieden.\n\n\n\n\n\nKrankheitsangststörung                                                      Ja     Nein\nBeschäftigung mit schwerer körperlicher Erkrankung\nKeine somatischen Symptome\nSorge über die Gesundheit\nExsessives gesundheitsverbundenes Verhalten/maladaptives Vermeiden\nDauer: mind. 6 Monate\n\n\n45                     Copyright © 2017 Margraf & Cwik","navTitle":"Krankheitsangststörung (kas)","when":{"op":"notAllNo","fields":["p42_kas_krankheitsangst"]},"dependsOn":["p42_kas_krankheitsangst"],"criteria":[{"title":"Krankheitsangststörung","items":[{"id":"c45_1","text":"Beschäftigung mit schwerer körperlicher Erkrankung","type":"yn"},{"id":"c45_2","text":"Keine somatischen Symptome","type":"yn"},{"id":"c45_3","text":"Sorge über die Gesundheit","type":"yn"},{"id":"c45_4","text":"Exsessives gesundheitsverbundenes Verhalten/maladaptives Vermeiden","type":"yn"},{"id":"c45_5","text":"Dauer: mind. 6 Monate","type":"yn"}]}]},{"id":"p48","page":48,"title":"SCREENING: ABHÄNGIGKEITSSPEKTRUM","kind":"screen","blocks":[{"id":"p48_ssk_substanzen","type":"screen","text":"SSK: Nehmen Sie irgendetwas, um Ihre Stimmung zu beeinflussen? Ich meine Dinge, wie z. B. Alkohol oder Medikamente oder auch illegale Drogen wie Kokain? Kam das früher vor?","options":["aktuell","früher","beides","nein"]},{"id":"p48_route_ssk","type":"info","text":"⎣ S. 50"},{"id":"p48_sgs_gluecksspielen","type":"screen","text":"SGS: Spielen Sie häufiger um Geld, wie z. B. Poker, an Spielautomaten oder bei Sportwetten? Kam das früher vor?","options":["aktuell","früher","beides","nein"]},{"id":"p48_route_sgs","type":"info","text":"⎣ S. 52"},{"id":"p48_ssi_internetspiele","type":"screen","text":"SSI: Spielen Sie häufiger und längere Zeit Computerspiele im Internet? Kam das früher vor?","options":["aktuell","früher","beides","nein"]},{"id":"p48_route_ssi","type":"info","text":"⎣ S. 54"},{"id":"p48_route_nein","type":"info","text":"Falls NEIN, weiter zu SCREENING: SCHLAFSTÖRUNGSSPEKTRUM (S. 56)"}],"navTitle":"Abhängigkeitsspektrum"},{"id":"p50","page":50,"title":"STÖRUNG DURCH SUBSTANZKONSUM (SSK)","kind":"module","blocks":[{"id":"p50_alkohol","type":"yn","text":"Trinken Sie gegenwärtig regelmäßig Alkohol?"},{"id":"p50_alkohol_details_hinweis","type":"info","text":"Falls JA: Art, Dosis und Dauer der Einnahme feststellen","when":{"op":"ne","field":"p50_alkohol","value":"no"}},{"id":"p50_alkohol_beschreibung","type":"text","text":"Beschreiben:","when":{"op":"ne","field":"p50_alkohol","value":"no"}},{"id":"p50_medikamente","type":"yn","text":"Nehmen Sie gegenwärtig irgendwelche Medikamtene regelmäßig ein?"},{"id":"p50_medikamente_details_hinweis","type":"info","text":"Falls JA: Art, Dosis und Dauer der Einnahme feststellen","when":{"op":"ne","field":"p50_medikamente","value":"no"}},{"id":"p50_medikamente_beschreibung","type":"text","text":"Beschreiben:","when":{"op":"ne","field":"p50_medikamente","value":"no"}},{"id":"p50_drogen","type":"yn","text":"Nehmen Sie gegenwärtig irgendwelche Drogen?"},{"id":"p50_drogen_details_hinweis","type":"info","text":"Falls JA: Art, Dosis und Dauer der Einnahme feststellen","when":{"op":"ne","field":"p50_drogen","value":"no"}},{"id":"p50_drogen_beschreibung","type":"text","text":"","when":{"op":"ne","field":"p50_drogen","value":"no"},"inputLabel":"Art, Dosis und Dauer der Einnahme","note":"Digitale Feldbeschriftung; die Antwortlinie im Original ist unbeschriftet."},{"id"
