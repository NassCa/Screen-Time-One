:"p50_symptome_einleitung","type":"info","text":"Treffen die folgenden Dinge für Ihren (Alkohol-/Medikamenten-/Drogen-) Gebrauch zu?"},{"id":"p50_menge_dauer_reduktion","type":"yn","text":"Nehmen Sie die Substanz mehr oder länger als beabsichtigt ein oder haben erfolglos versucht den Gebrauch einzustellen bzw. zu reduzieren?"},{"id":"p50_zeitaufwand","type":"yn","text":"Verbringen Sie viel Zeit mit dem Substanzgebrauch, der -beschaffung oder der Erholung deren Wirkungen?"},{"id":"p50_verlangen","type":"yn","text":"Verspüren Sie ein Verlangen nach der Substanz?"},{"id":"p50_konflikte_vernachlaessigung","type":"yn","text":"Haben Sie Konflikte (beruflich oder privat) aufgrund des Gebrauchs oder haben Sie Ihnen wichtige Tätigkeiten oder Personen vernachlässigt?"},{"id":"p50_gefaehrdung","type":"yn","text":"Kamen Sie schon öfter in Gefahr wegen dem Substanzgebrauch?"},{"id":"p50_fortsetzung_trotz_problemen","type":"yn","text":"Gebrauchen Sie die Substanz weiter, obwohl Sie wissen, dass dies körperliche oder psychische Probleme nach sich zieht?"},{"id":"p50_toleranz","type":"yn","text":"Müssen Sie als mehr als früher zu sich nehmen, um (betrunken/high/angstfrei...) zu werden?"},{"id":"p50_entzug","type":"yn","text":"Haben Sie kröperliche Probleme, wenn Sie versuchen den Gebrauch einzustellen oder nehmen Sie etwas anderes ein, um diese Probleme zu reduzieren?"},{"id":"p50_dauer_zwoelf_monate","type":"yn","text":"Nahmen Sie die Substanz über einen Zeitraum von mindestens 12 Monaten und haben in dieser Zeit die beschriebenen Symptome bei sich beobachtet?"},{"id":"p50_substanz_hinweis","type":"info","text":"Falls Hinweise auf Störung durch Substanzkonsum, Substanz angeben:"},{"id":"p50_substanz_angabe","type":"text","text":"","inputLabel":"Substanz","note":"Digitale Feldbeschriftung; die Antwortlinie im Original ist unbeschriftet."}],"reference":"Störung durch Substanzkonsum (F1x.xx)\n\nHauptmerkmal:  Problematischer Substanzkonsum, der zu deutlichen Beeinträchtigungen oder\n                 Belastungen führt\nNotwendig:      Mindestens 2 Symptome\nDauer:          Mindestens 12 Monate\nWichtig:        Aufgrund geschlechtsbedingter körperlicher Unterschiede sind Frauen vulnerabler\n                    für körperliche Konsequenzen des Konsums (insbesondere bei Alkohol).\nHäufig:         Männer höhere Raten von Störungen durch Alkoholkonsum, Frauen höhere Raten\n                von Störungen durch Medikamentenkonsum (Sedativa, Hypnotika oder\n                   Anxiolytika).\nHinweis:          spezifische Entzugssymptome für die jeweilige Substanz können dem DSM5 ab\n                   Seite 661 entnommen werden.\nBestimme, ob:    In früher Remission: nachdem die Kriterien erfüllt waren, werden sie seit\n                 mindestens 3 Monaten, aber nicht länger als 12 Monate, nicht mehr erfüllt\n               (ausgenommen Verlangen oder Wunsch nach Konsum).\n                 In anhaltender Remission: nachdem die Kriterien erfüllt waren, werden sie über\n                  einen Zeitraum von 12 Monaten oder länger nicht mehr erfüllt (ausgenommen\n                 Verlangen oder Wunsch nach Konsum).\n                 In kontrollierter Umgebung: die Person konsumiert aufgrund der geschützten\n              Umgebung nicht (z. B. geschützte stationäre Unterbringung).\nCodierungen:    Substanzen:\n                 Alkohol: F10.xxx; Opioide: F12.xxx; Sedativa, Hypnotika, Anxiolytika: F13.xxx;\n                   Stimulantien: F14.xxx; Koffein: F15.xxx; Halluzinogene: F16.xxx; Inhalanzien:\n                 F18.xxx; Andere Substanzen: F19.xxx\n                Schweregrade:\n                    leichtgradig: F1x.10; mittelgradig: F1x.20; schwergradig: F1x.30\n                Weitere Codierungen:\n                 Alkoholentzug, mit Wahrnehmungsstörungen: F10.239; Alkoholentzug, ohne\n                Wahrnehmungsstörungen: F10.232\n\n\n\n\n\nStörung durch Substanzkonsum                                               Ja     Nein\nCharakteristische kognitive/verhaltensbesogene/körperliche Symptome &\nFortsetzung des Gebrauchs, trotz Problemen\nPathologisches Muster von Verhaltensweisen (mind. 2)\nSubstanzentzug (nur bei Drogen und Alkohol)\nDauer: mind. 12 Monate\n\n49                     Copyright © 2017 Margraf & Cwik","navTitle":"Störung durch substanzkonsum (ssk)","when":{"op":"notAllNo","fields":["p48_ssk_substanzen"]},"dependsOn":["p48_ssk_substanzen"],"criteria":[{"title":"Störung durch Substanzkonsum","items":[{"id":"c49_1","text":"Charakteristische kognitive/verhaltensbesogene/körperliche Symptome & Fortsetzung des Gebrauchs, trotz Problemen","type":"yn"},{"id":"c49_2","text":"Pathologisches Muster von Verhaltensweisen (mind. 2)","type":"yn"},{"id":"c49_3","text":"Substanzentzug (nur bei Drogen und Alkohol)","type":"yn"},{"id":"c49_4","text":"Dauer: mind. 12 Monate","type":"yn"}]}]},{"id":"p52","page":52,"title":"STÖRUNG DURCH GLÜCKSSPIELEN (SGS)","kind":"module","blocks":[{"id":"p52_symptome_einleitung","type":"info","text":"Treffen die folgenden Dinge für Ihr Glücksspielverhalten zu?"},{"id":"p52_gedanken","type":"yn","text":"Denken Sie häufig an Glücksspiele?"},{"id":"p52_geldbetraege_verluste","type":"yn","text":"Spielen Sie um immer höhere Geldbeträge, um so einen gewünschten Zustand zu erreichen oder um Verluste auszugleichen?"},{"id":"p52_reduktion_unruhe","type":"yn","text":"Versuchten Sie schon einmal Ihr Glücksspielverhalten zu reduzieren/kontrollieren oder waren Sie unruhig/nervos, wenn Sie an eine Reduktion dachten?"},{"id":"p52_luegen_konflikte","type":"yn","text":"Belügen Sie andere über Ihr Glücksspielverhalten oder hatten deswegen schon Auseinandersetzungen mit anderen?"},{"id":"p52_belastende_gefuehle","type":"yn","text":"Spielen Sie, um mit belastenden Gefühlen besser zu rechtzukommen?"},{"id":"p52_finanzielle_schwierigkeiten","type":"yn","text":"Denken Sie, dass Ihr Glücksspielverhalten zu finanziellen Schwierigkeiten führen könnte?"},{"id":"p52_dauer_zwoelf_monate","type":"yn","text":"Haben Sie dieses Glücksspielverhalten und die beschriebenen Symptome über einen Zeitraum von mindestens 12 Monaten bei sich beobachtet?"}],"reference":"Störung durch Glücksspielen (F63.0)\n\nHauptmerkmal:  Belastendes, andauerndes und wiederholtes problematisches Glücksspielverhalten\nNotwendig:      Mindestens 4 von 9 Symptomen\nDauer:          Mindestens 12 Monate\nWichtig:         Problematisches Glücksspielverhalten kann auch im Rahmen einer manischen\n                 Episode auftreten\nHäufig:           Finanzielle und soziale Probleme und Sorgen, Männer häufiger betroffen,\n                  Geschlechtsunterschiede hinsichtlich der Art des Glücksspiels (Männer häufiger\n                  Karten, Sport und Pferderennen, Frauen häufiger Spielautomaten und Bingo)\nAbgrenzung:    Manische Episode: wenn problematisches Glücksspielverhalten ausschließlich\n                während der Stimmungsproblematik besteht\nBestimme, ob:    Episodisch: Bei voller Symptomausprägung für mehr als 1 Episode, sinken die\n              Symptome zwischend en Episoden für mindestens einige Monate\n               Andauernd: Die Kriterien der Störung werden über mehrere Jahre erfüllt\n                 In früher Remission: nachdem die Kriterien erfüllt waren, werden sie seit\n                 mindestens 3 Monaten, aber nicht länger als 12 Monate, nicht mehr erfüllt\n                 In anhaltender Remission: nachdem die Kriterien erfüllt waren, werden sie über\n                  einen Zeitraum von 12 Monaten oder länger nicht mehr erfüllt\n                Schweregrad: leicht (4-5 Symptome), mittelgradig (6-7 Symptome), schwer (8-9\n               Symptome)\n\n\n\n\n\nStörung durch Glücksspielen                                                  Ja     Nein\nDauerhaftes, häufig auftretendes problematisches Glücksspielen führt zu\nBeeinträchtigungen oder Leiden, mind. 4 Symptome\nDauer: mind. 12 Monate\n\n\n\n\n51                     Copyright © 2017 Margraf & Cwik","navTitle":"Störung durch glücksspielen (sgs)","when":{"op":"notAllNo","fields":["p48_sgs_gluecksspielen"]},"dependsOn":["p48_sgs_gluecksspielen"],"criteria":[{"title":"Störung durch Glücksspielen","items":[{"id":"c51_1","text":"Dauerhaftes, häufig auftretendes problematisches Glücksspielen führt zu Beeinträchtigungen oder Leiden, mind. 4 Symptome","type":"yn"},{"id":"c51_2","text":"Dauer: mind. 12 Monate","type":"yn"}]}]},{"id":"p54","page":54,"title":"STÖRUNG DURCH SPIELEN VON INTERNETSPIELEN (SSI)","kind":"module","blocks":[{"id":"p54_symptome_einleitung","type":"info","text":"Treffen die folgenden Dinge für Ihr Internetspielverhalten zu?"},{"id":"p54_gedanken","type":"yn","text":"Denken Sie häufig an Internetspiele?"},{"id":"p54_nichtspielen_gefuehle","type":"yn","text":"Fühlen Sie sich schlecht, wenn Sie nicht spielen können oder spielen Sie, um mit belastenden Gefühlen besser zu rechtzukommen?"},{"id":"p54_dauer_kontrolle","type":"yn","text":"Spielen Sie immer länger oder haben Sie Probleme Ihr Spielverhalten zu reduzieren/kontrollieren?"},{"id":"p54_konflikte_vernachlaessigung","type":"yn","text":"Haben Sie Konflikte (beruflich oder privat) aufgrund des Spielverhaltens oder haben Sie Ihnen wichtige Tätigkeiten oder Personen vernachlässigt?"},{"id":"p54_luegen","type":"yn","text":"Belügen Sie andere über Ihr Spielverhalten?"},{"id":"p54_dauer_zwoelf_monate","type":"yn","text":"Haben Sie dieses Internetspielverhalten und die beschriebenen Symptome über einen Zeitraum von mindestens 12 Monaten bei sich beobachtet?"}],"reference":"Störung durch Spielen von Internetspielen\n\nHauptmerkmal:  Andauerndes und wiederholtes ausgeprägter Gebrauch von Internetspielen\nNotwendig:      Mindestens 5 von 9 Symptomen\nDauer:          Mindestens 12 Monate\nBestimme, ob:   Schweregrad: leicht (Erfüllung weniger und leichtere Symptome und weniger\n                   Beeinträchtigung), mittelgradig (ausgeprägte Symptome, stundenweises\n                   Spielverhalten, deutliche Beeinträchtigungen in sozialen Beziehungen, Beruf oder\n                   Schule), schwer (mehr und schwerer ausgeprägte Symptome, Spielverhalten über\n                    viele Stunden, schwere Beeinträchtigungen in sozialen Beziehungen, Beruf oder\n                  Schule)\n\n\n\n\n\nStörung durch Spielen von Internetspielen                                      Ja     Nein\nDauerhafte, wiederkehrende Nutzung des Internets, um Spiele zu spielen, führt zu\nBeeinträchtigung oder Leiden, mind. 5 Symptome\n\n\n\n53                     Copyright © 2017 Margraf & Cwik","navTitle":"Störung durch spielen von internetspielen (ssi)","when":{"op":"notAllNo","fields":["p48_ssi_internetspiele"]},"dependsOn":["p48_ssi_internetspiele"],"criteria":[{"title":"Störung durch Spielen von Internetspielen","items":[{"id":"c53_1","text":"Dauerhafte, wiederkehrende Nutzung des Internets, um Spiele zu spielen, führt zu Beeinträchtigung oder Leiden, mind. 5 Symptome","type":"yn"}]}]},{"id":"p56","page":56,"title":"SCREENING: SCHLAFSTÖRUNGSSPEKTRUM","kind":"screen","blocks":[{"id":"p56_intro","type":"info","text":"Ich möchte Ihnen nun einige Fragen zu Ihrem Schlaf stellen:"},{"id":"p56_general_intro","type":"info","text":"Allgemeine Fragen zum Schlaf:"},{"id":"p56_regular_bedtime","type":"yn","text":"Gehen Sie regelmäßig zur gleichen Zeit schlafen?","options":["JA","NEIN"]},{"id":"p56_bedtime","type":"text","text":"Wann gehen Sie normalerweise zu Bett?"},{"id":"p56_waketime","type":"text","text":"Wann stehen Sie normalerweise auf?"},{"id":"p56_sleep_duration","type":"number","text":"Wie lange schlafen Sie normalerweise pro Nacht? Effektive Schlafzeit pro Nacht (Stunden):","unit":"Stunden","min":0},{"id":"p56_ins","type":"screen","text":"INS: Haben Sie andauernd Beschwerden wegen schlechtem Schlaf? Kam das früher vor?","options":["aktuell","früher","beides","nein"]},{"id":"p56_ins_route","type":"info","text":"⎣ S. 58"},{"id":"p56_hys","type":"screen","text":"HYS: Sind Sie oft sehr müde oder schlafen mehr als gewohnt? Kam das früher vor?","options":["aktuell","früher","beides","nein"]},{"id":"p56_hys_route","type":"info","text":"⎣ S. 60"},{"id":"p56_negative_route","type":"info","text":"Falls NEIN, weiter zu SCREENING: IMPULSKONTROLLE (S. 62)"}],"navTitle":"Schlafstörungsspektrum"},{"id":"p58","page":58,"title":"INSOMNIE (INS)","kind":"module","blocks":[{"id":"p58_intro","type":"info","text":"Treffen die folgenden Dinge in Bezug auf Ihre Schlafprobleme zu?"},{"id":"p58_sleep_onset","type":"yn","text":"... können Sie schlecht einschlafen?","options":["JA","NEIN"]},{"id":"p58_sleep_maintenance","type":"yn","text":"... haben Sie Durchschlafprobleme?","options":["JA","NEIN"]},{"id":"p58_early_waking","type":"yn","text":"... wachen Sie morgens früh auf, ohne wieder einschlafen zu können?","options":["JA","NEIN"]},{"id":"p58_frequency","type":"number","text":"Wie häufig pro Woche leiden Sie unter diesen Schlafproblemen? NÄCHTE/WOCHE:","unit":"NÄCHTE/WOCHE","min":0},{"id":"p58_duration","type":"number","text":"Seit wann leiden Sie unter diesen Schlafproblemen? MONATE:","unit":"MONATE","min":0}],"reference":"Insomnie (F51.01)\n\nHauptmerkmal:  Andauernde Unzufriedenheit mit der Schlafqualität- oder quantität\nNotwendig:      Mindestens 1 der nebenstehenden 3 Symptome in mindestens 3 Nächten pro\n              Woche\nDauer:          Mindestens 3 Monate\nWichtig:         Deutliche Belastungen oder Beeinträchtigungen bei kognitiven, sozialen,\n                   beruflichen oder anderen wichtigen Funktionsbereichen durch die Schlafprobleme\nHäufig:          Frauen häufiger als Männer, insbesondere in Verbindung mit Geburt eines Kindes\n                 oder höheren Alters (Achtung: Studien deuteten bei älteren Frauen auf eine\n                  bessere Schlafeffektivität hin)\nAbgrenzung:     Schlafprobleme können im Rahmen verschiedener alltäglicher Belastungen\n                    auftreten, wie z. B. bei Schichtarbeit\n                 Restless-Legs-Syndrom: Drang die Beine zu bewegen und unangenehme\n                  Sensationen in den Beinen\n               Atmungsbezogene Schlafstörung: Lautes Schnarchen, Atempausen und\n                  ausgeprägte Schläfrigkeit während des Tages\n                 Narkolepsie: Ausgeprägte Schläfrigkeit während des Tages, Kataplexie,\n                  Schlafparalyse und schlafbezogenen Halluzinationen\n                Parasomnie: Ungewöhnliche Verhaltensweisen oder Ereignisse während des\n                   Schlafs, die zu Schlafunterbrechungen führen\nBestimme, ob:   Mit Komorbidität zu einer anderen nicht schlafbezogenen psychischen\n                Störung: Insomnie tritt zusammen mit einer anderen psychischen Störung auf\n               Mit Komorbidität zu einer medizinischen Störung: Insomnie tritt zusammen mit\n                   einer körperlichen Erkrankung auf\n               Mit anderer Schlafstörung: Insomnie tritt zusammen mit einer anderen\n                   Schlafstöriung auf\n                 Episodisch; Die Symptome dauern mindestens 1 Monat aber weniger als 3 Monate\n                 an\n               Andauernd: Die Symptome dauern mindestens 3 Monate an\n               Wiederkehrend: Mindestens 2 Episoden innerhalb des selben Jahres\n\n\n\n\n\nInsomnie                                                                   Ja     Nein\nUnzufriedenheit mit Schlafqualität oder –quantität, mind. 1 Symptom\nLeiden oder Beeinträchtigungen\nDauer: mind. 3 Nächte pro Woche, mind. 3 Monate\nTrotz adequater Gelegeneheit zu schlafen\n\n\n57                     Copyright © 2017 Margraf & Cwik","navTitle":"Insomnie (ins)","when":{"op":"notAllNo","fields":["p56_ins"]},"dependsOn":["p56_ins"],"criteria":[{"title":"Insomnie","items":[{"id":"c57_1","text":"Unzufriedenheit mit Schlafqualität oder –quantität, mind. 1 Symptom","type":"yn"},{"id":"c57_2","text":"Leiden oder Beeinträchtigungen","type":"yn"},{"id":"c57_3","text":"Dauer: mind. 3 Nächte pro Woche, mind. 3 Monate","type":"yn"},{"id":"c57_4","text": anderen psychischen Störung auf\n               Mit Komorbidität zu einer medizinischen Störung: Insomnie tritt zusammen mit\n                   einer körperlichen Erkrankung auf\n               Mit anderer Schlafstörung: Insomnie tritt zusammen mit einer anderen\n                   Schlafstöriung auf\n\n               Akut: Weniger als 1 Monat\n                Subakut: Dauer 1-3 Monate\n               Andauernd: Dauer mehr als 3 Monate\n\n                Schweregrad: Leicht (Schlafprobleme an 1-2 Tagen/Woche), mittelgradig\n                 (Schlafprobleme an 3-4 Tagen/Woche), schwer (Schlafprobleme an 5-7\n                Tagen/Woche)\n\n\n\n\n\n  Hypersomnie                                                               Ja     Nein\n  Übermäßige Schläfrigkeit, mind. 1 Symptom\n  Dauer: mind. 3 mal pro Woche, mind. 3 Monate\n  Leiden oder Beeinträchtigungen\n\n\n\n59                     Copyright © 2017 Margraf & Cwik","navTitle":"Hypersomnie (hys)","when":{"op":"notAllNo","fields":["p56_hys"]},"dependsOn":["p56_hys"],"criteria":[{"title":"Hypersomnie","items":[{"id":"c59_1","text":"Übermäßige Schläfrigkeit, mind. 1 Symptom","type":"yn"},{"id":"c59_2","text":"Dauer: mind. 3 mal pro Woche, mind. 3 Monate","type":"yn"},{"id":"c59_3","text":"Leiden oder Beeinträchtigungen","type":"yn"}]}]},{"id":"p62","page":62,"title":"SCREENING: IMPULSKONTROLLE","kind":"screen","blocks":[{"id":"p62_impulse","type":"yn","text":"Verspüren Sie wiederholt einen Drang, Impuls, Trieb oder eine Versuchung, bestimmte Handlungen auszuführen, die schädlich für Sie oder andere sein könnten (z. B. Feuer legen, Stehlen, Kaufimpulse)?","options":["JA","NEIN"]},{"id":"p62_tension","type":"yn","text":"Bevor Sie diese Handlungen ausführen, haben Sie dann ein gesteigertes Gefühl von Anspannung oder Erregung?","options":["JA","NEIN"]},{"id":"p62_gratification","type":"yn","text":"Erleben Sie Vergnügen, Befriedigung oder Entspannung, während der Ausführung dieser Handlungen?","options":["JA","NEIN"]}], "},{"id":"p71_scale_marked","type":"info","text":"stark störend/ behindernd"},{"id":"p71_scale_severe","type":"info","text":"sehr stark störend/ behindernd"},{"id":"p71_scale_ranges","type":"info","text":"SUBKLINISCHER BEREICH KLINISCHER BEREICH"},{"id":"p71_current_heading","type":"info","text":"Aktuelle Diagnosen"},{"id":"p71_primary_diagnosis","type":"text","text":"Primäre Diagnose"},{"id":"p71_additional_diagnosis_1","type":"text","text":"Zusätzliche Diagnosen"},{"id":"p71_additional_diagnosis_2","type":"text","text":"Zusätzliche Diagnosen"},{"id":"p71_additional_diagnosis_3","type":"text","text":"Zusätzliche Diagnosen"},{"id":"p71_additional_diagnosis_4","type":"text","text":"Zusätzliche Diagnosen"},{"id":"p71_additional_diagnosis_5","type":"text","text":"Zusätzliche Diagnosen"},{"id":"p71_past_heading","type":"info","text":"Frühere Diagnosen"},{"id":"p71_past_diagnosis_1","type":"text","text":"Diagnose"},{"id":"p71_past_onset_1","type":"text","text":"Beginn"},{"id":"p71_past_remission_1","type":"text","text":"Remission"},{"id":"p71_past_diagnosis_2","type":"text","text":"Diagnose"},{"id":"p71_past_onset_2","type":"text","text":"Beginn"},{"id":"p71_past_remission_2","type":"text","text":"Remission"},{"id":"p71_past_diagnosis_3","type":"text","text":"Diagnose"},{"id":"p71_past_onset_3","type":"text","text":"Beginn"},{"id":"p71_past_remission_3","type":"text","text":"Remission"},{"id":"p71_past_diagnosis_4","type":"text","text":"Diagnose"},{"id":"p71_past_onset_4","type":"text","text":"Beginn"},{"id":"p71_past_remission_4","type":"text","text":"Remission"},{"id":"p71_further_details","type":"text","text":"Weitere Angaben"}],"navTitle":"Klinische Einschätzungen"}],"routingNotes":[{"page":4,"after":"p04_ps","text":"⎣ S. 6","suggestion":"Bei aktuell, früher oder beides PS auf Seite 6 abklären. Zuerst alle fünf Angst-Screeningfragen erheben; der Sammelhinweis verlangt die Einzelabklärung aller berichteten Bereiche."},{"page":4,"after":"p04_ag","text":"⎣ S. 8","suggestion":"Bei aktuell, früher oder beides AG auf Seite 8 abklären."},{"page":4,"after":"p04_sas","text":"⎣ S. 10","suggestion":"Bei aktuell, früher oder beides SAS auf Seite 10 abklären."},{"page":4,"after":"p04_sp","text":"⎣ S. 12","suggestion":"Bei aktuell, früher oder beides SP auf Seite 12 abklären."},{"page":4,"after":"p04_gas","text":"⎣ S. 14","suggestion":"Bei aktuell, früher oder beides GAS auf Seite 14 abklären."},{"page":4,"after":"p04_gas_route","text":"Störungsbereiche, für die Angst oder Vermeidung berichtet werden, einzeln abklären.","suggestion":"Alle im Screening bejahten Störungsbereiche einzeln abklären, nicht nur den ersten positiven Bereich."},{"page":4,"after":"p04_positive_domains_instruction","text":"Falls alle Bereiche mit NEIN beantwortet werden, weiter zu SCREENING: STIMMUNGSSPEKTRUM (S. 16)","suggestion":"Nur bei NEIN in allen fünf Angst-Screeningfragen direkt zu Seite 16."},{"page":6,"after":"p06_peak_minutes","text":"(Falls NEIN, weiter zu AGORAPHOBIE)","suggestion":"Bei NEIN zur Höhepunktfrage die folgenden PS-Fragen überspringen und zu AGORAPHOBIE auf Seite 8. Unsicherheit: Die lokale Regel nennt AGORAPHOBIE unbedingt; nicht spezifiziert ist, ob ein zuvor negatives AG-Screening dieses Ziel überspringen soll."},{"page":6,"after":"p06_symptom_hot_cold","text":"(Falls weniger als 4 Symptome, weiter zu AGORAPHOBIE)","suggestion":"Bei weniger als vier bejahten Symptomen aus den 13 vorstehenden Symptomen PS verlassen und zu AGORAPHOBIE auf Seite 8. Unsicherheit hinsichtlich des zuvor negativen AG-Screenings wie bei p06_peak_minutes."},{"page":14,"after":"p14_worry_content","text":"Falls Sorgen in nur einem Bereich:","suggestion":"Die unmittelbar folgende Frage p14_frequent_minor_worries wird bei Sorgen in nur einem Bereich gestellt. Die folgenden Fragen zu Kontrolle und Symptomen erscheinen nicht auf diesen Fall beschränkt."},{"page":16,"after":"p16_me","text":"⎣ S. 18","suggestion":"Bei aktuell, früher oder beides gemeinsames Modul ME/HME auf Seite 18 abklären."},{"page":16,"after":"p16_hme","text":"⎣ S. 18","suggestion":"Bei aktuell, früher oder beides gemeinsames Modul ME/HME auf Seite 18 abklären; das Modul ist mit ME geteilt."},{"page":16,"after":"p16_md","text":"⎣ S. 20","suggestion":"Bei aktuell, früher oder beides MD auf Seite 20 abklären."},{"page":16,"after":"p16_pds","text":"⎣ S. 22","suggestion":"Bei aktuell, früher oder beides PDS auf Seite 22 abklären."},{"page":16,"after":"p16_pds_route","text":"Falls NEIN, weiter zu SCREENING: ZWANGSSPEKTRUM (S. 24)","suggestion":"Unsicherheit: Der Wortlaut sagt nur Falls NEIN und steht nach PDS. Plausibel ist der Sprung bei allen vier verneinten Stimmungsscreenings, nicht schon bei isoliertem PDS-NEIN. Die davor bejahten Module dürfen nicht verloren gehen. Nicht ausdrücklich geregelt ist, ob die folgende Stimmungsverlaufskurve trotzdem bearbeitet werden soll."},{"page":20,"after":"p20_condition_instruction","text":"Falls depressive Stimmung bzw. Interesseverlust:","suggestion":"Die nachfolgenden Beschwerden werden bei depressiver Stimmung beziehungsweise Interesseverlust erhoben. Kein ausdrückliches Sprungziel für den gegenteiligen Fall angegeben."},{"page":20,"after":"p20_multiple_episodes","text":"Falls zusätzlich ME/HME, BIPOLARE STÖRUNG I/II","suggestion":"Hinweis auf zusätzliche Abklärung bipolarer Störung bei zusätzlicher ME/HME, kein automatischer Diagnosebeleg. Der Text nennt hier keine Seitenzahl und spezifiziert die Zuordnung I/II nicht näher."},{"page":22,"after":"p22_longest_non_depressed_period","text":"Falls >2 Monate, REZIDIVIERENDE MAJOR DEPRESSION überprüfen","suggestion":"Bei längster nicht depressiver beziehungsweise nicht interesseloser Zeitspanne über zwei Monaten rezidivierende Major Depression überprüfen. Keine automatische Diagnosestellung und kein ausdrückliches Sprungziel."},{"page":24,"after":"p24_zg","text":"⎣ S. 26","suggestion":"Bei aktuell, früher oder beides ZWANGSSTÖRUNG auf Seite 26 abklären."},{"page":24,"after":"p24_zh","text":"⎣ S. 26","suggestion":"Bei aktuell, früher oder beides ZWANGSSTÖRUNG auf Seite 26 abklären; das Modul ist mit ZG geteilt."},{"page":24,"after":"p24_kds","text":"⎣ S. 28","suggestion":"Bei aktuell, früher oder beides KDS auf Seite 28 abklären."},{"page":24,"after":"p24_kds_route","text":"Falls NEIN, weiter zu SCREENING: TRAUMAFOLGESPEKTRUM (S. 30)","suggestion":"Unsicherheit: Der Wortlaut sagt nur Falls NEIN und steht nach KDS. Plausibel ist ein Sprung bei allen drei verneinten Zwangsscreenings, nicht bereits bei isoliertem KDS-NEIN; zuvor bejahte ZG/ZH-Bereiche müssen berücksichtigt bleiben."},{"page":26,"after":"p26_distress","text":"(Falls NEIN, weiter zu KÖRPERDYSMORPHE STÖRUNG)","suggestion":"Bei NEIN die restlichen Zwangsstörungsfragen überspringen und zu KDS auf Seite 28. Unsicherheit: Die lokale Regel nennt KDS unabhängig vom Ergebnis des KDS-Screenings."},{"page":26,"after":"p26_countermeasures","text":"Falls JA, beschreiben:","suggestion":"Das nachfolgende Beschreibungsfeld p26_countermeasures_description bei JA zu Gegenmaßnahmen erheben."},{"page":28,"after":"p28_distress","text":"Falls NEIN, weiter zu SCREENING: TRAUMAFOLGESPEKTRUM (S. 30)","suggestion":"Bei NEIN die verbleibenden KDS-Fragen überspringen und zu Seite 30."},{"page":28,"after":"p28_countermeasures","text":"Falls JA, beschreiben:","suggestion":"Das nachfolgende Beschreibungsfeld p28_countermeasures_description bei JA zu Gegenmaßnahmen erheben."},{"page":30,"after":"p30_trauma_vier_wochen","text":"Hat das belastende Ereignis innerhalb der letzten 4 Wochen stattgefunden?","suggestion":"Im Original folgt ausschließlich das Freitextfeld „Beschreiben:“, kein JA/NEIN-Feld. Deshalb Frage als info und Originalantwortfeld als text übertragen. Für digitale zeitabhängige Weiterleitung wäre ein ausdrücklich als Zusatz gekennzeichnetes JA/NEIN- oder Datumsfeld nötig; nicht in originalen blocks ergänzt. Vier Wochen im Fragetext und letzter Monat im Sprungtext sind nicht stillschweigend gleichzusetzen."},{"page":30,"after":"p30_trauma_beschreibung","text":"Falls eines der Ereignisse innerhalb des letzten Monats stattgefunden hat, weiter zur Akuten Belastungsstörung, sonst weiter zur Posttraumatischen Belastungsstörung.","suggestion":"Bei mindestens einem Ereignis im letzten Monat zu p32, bei sonstigem vorhandenem Trauma zu p34. Bei mehreren Ereignissen müssen deren Zeitpunkte getrennt bekannt sein. Keine automatische Logik implementiert."},{"page":30,"after":"p30_route_trauma_zeitpunkt","text":"Wenn KEIN traumatisches Ereignis erlebt wurde, weiter zu SCREENING: SPEKTRUM PROBLEMATISCHEN ESSVERHALTENS (S. 36)","suggestion":"Ohne traumatisches Ereignis p32 und p34 überspringen, zu p36. Gilt übergeordnet vor einer zeitabhängigen Traumaweiterleitung; anhand der beiden Expositionsfragen beurteilen, nicht allein anhand der Mehrfachtraumafrage."},{"page":32,"after":"p32_beschwerden_beginn","text":"Falls KEIN weiteres Trauma, weiter zu SCREENING: SPEKTRUM PROBLEMATISCHEN ESSVERHALTENS (S. 36)","suggestion":"Ohne weiteres Trauma weiter p36. Für ein weiteres Trauma nennt diese Regel kein ausdrückliches Ziel; p34 liegt nahe, wenn es länger zurückliegt. Nicht ohne Prüfung automatisieren."},{"page":32,"after":"p32_konfrontation","text":"SELBST____ BEOBACHTET____ NAHESTEHENDER PERSON____ INDIREKT____","suggestion":"Vier originale Antwortoptionen als choice. Ob Mehrfachauswahl zulässig ist, legt das Original nicht ausdrücklich fest. Medien im beruflichen Kontext werden im Fragetext, nicht als separate Antwortoption genannt."},{"page":34,"after":"p34_konfrontation","text":"SELBST____ BEOBACHTET____ NAHESTEHENDER PERSON____ INDIREKT____","suggestion":"Vier originale Antwortoptionen als choice. Ob Mehrfachauswahl zulässig ist, legt das Original nicht ausdrücklich fest. Medien im beruflichen Kontext werden im Fragetext, nicht als separate Antwortoption genannt."},{"page":36,"after":"p36_bmi_adipositas_iii","text":"Adipositas Grad III ≥40","suggestion":"Im TXT fehlt vor 40 ein Zeichen. Im PDF-Crop visuell eindeutig „≥40“; aus dem Original wiederhergestellt. Keine inhaltliche Korrektur."},{"page":36,"after":"p36_groesse_gewicht_frage","text":"Wie groß sind Sie und wie viel wiegen Sie?","suggestion":"Die zwei unbeschrifteten Originalantwortlinien sind als separate number-Blöcke p36_koerpergroesse und p36_koerpergewicht mit leerem text übertragen. Keine frei erfundenen Beschriftungen oder Einheiten hinzugefügt. Digitale Einheiten müssen separat festgelegt und als Zusatz ausgewiesen werden."},{"page":36,"after":"p36_gewicht_extrema_frage","text":"Wie war Ihr niedrigstes bzw. höchstes Gewicht im Erwachsenenalter?","suggestion":"Die zwei unbeschrifteten Originalantwortlinien sind als separate number-Blöcke p36_gewicht_niedrigstes und p36_gewicht_hoechstes mit leerem text übertragen; Reihenfolge entspricht niedrigstes, höchstes. Keine Originaleinheit vorhanden."},{"page":36,"after":"p36_an_abnehmen","text":"⎣ S. 38","suggestion":"JA (aktuell, früher oder beides) verweist auf p38. Die drei Screeningfragen vor Modulauswahl vollständig erfassen; kein unmittelbarer Abbruch des gesamten Screenings abgeleitet."},{"page":36,"after":"p36_an_bn_gewichtsangst","text":"⎣ S. 38/40","suggestion":"JA verweist auf p38/p40. Der Pfeil bestimmt nicht, ob beide Module oder eines nach klinischer Abgrenzung zu bearbeiten sind; Originalhinweise zur Abgrenzung beachten."},{"page":36,"after":"p36_an_bn_be_essanfaelle","text":"⎣ S. 38/40","suggestion":"JA verweist auf p38/p40. Trotz Kennzeichnung AN/BN/BE werden nur diese beiden Zielseiten genannt; keine zusätzliche BE-Seite erfinden."},{"page":36,"after":"p36_route_an_bn_be","text":"Falls NEIN, weiter zu SCREENING: SOMATISCHER BELASTUNGEN (S. 42)","suggestion":"Der zusammenfassende NEIN-Sprung folgt drei Screeningfragen. Plausibel: bei sämtlich negativen Antworten weiter p42; die Vorlage präzisiert den Geltungsbereich nicht ausdrücklich. Ein einzelnes NEIN darf frühere positive Antworten nicht unbesehen übersteuern."},{"page":36,"after":"p36_abgrenzung_an_bn","text":"Abgrenzung Anorexie/Bulimie: Wenn Essanfälle gleichzeitig mit Anorexie auftreten, dann wird keine zusätzliche Bulimie-Diagnose gegeben. Beide Diagnosen können nur gemeinsam gegeben werden, wenn sie sich zeitlich nicht vollständig überlappen.","suggestion":"Originaler diagnostischer Abgrenzungshinweis, keine automatische Diagnose-/Ausschlusslogik daraus implementiert. Zeitliche Überlappung ist in den angegebenen Blöcken nicht gesondert erfasst."},{"page":36,"after":"p36_abgrenzung_bn_be","text":"Abgrenzung Bulimie/Binge-Eating: Bei Bulimie werden nach Essanfällen kompensatorische Maßnahmen vorgenommen (einzelne Diäten allerdings möglich), Binge-Eating mehr Leidensdruck.","suggestion":"Originaler Abgrenzungshinweis zur Interpretation von p40_kompensation, keine zusätzliche Frage oder Diagnose erfunden."},{"page":40,"after":"p40_kompensation","text":"Falls JA: BULIMIA NERVOSA; falls NEIN: BINGE-EATING STÖRUNG","suggestion":"JA/NEIN bezieht sich auf p40_kompensation, nicht auf die beiden vorherigen Fragen. Die drei Fragen sind getrennte Blöcke. Das Original nennt hier BN versus BE, jedoch keine Seitenzahl und keine weiteren Unterfragen. Vollständiger PDF-Crop der Seite geprüft: nur diese drei Fragen und die Verzweigungszeile vorhanden. Keine Diagnose allein aus diesem einen Antwortwert implementieren."},{"page":42,"after":"p42_sbs_probleme","text":"⎣ S. 44","suggestion":"JA (aktuell, früher oder beides) verweist auf p44."},{"page":42,"after":"p42_kas_krankheitsangst","text":"⎣ S. 46","suggestion":"JA (aktuell, früher oder beides) verweist auf p46. Bei zugleich körperlichen Beschwerden den nachfolgenden originalen SBS-Abgrenzungshinweis beachten."},{"page":42,"after":"p42_route_kas","text":"Falls NEIN, weiter zu SCREENING: ABHÄNGIGKEITSSPEKTRUM (S. 48)","suggestion":"Plausibel auf beide störungsspezifischen Screeningfragen bezogen: wenn beide negativ, p48. Der Geltungsbereich von NEIN ist in der Vorlage nicht ausdrücklich definiert; nicht allein die zuletzt gestellte Frage auswerten."},{"page":42,"after":"p42_abgrenzung_sbs_kas","text":"Falls körperliche Beschwerden und Krankheitsangst vorliegen, sollte eine Somatische Belastungsstörung vergeben werden.","suggestion":"Wortgetreuer diagnostischer Abgrenzungshinweis, keine Diagnose- oder Modulunterdrückungslogik implementiert."},{"page":44,"after":"p44_energie_zeit","text":"Falls JA, beschreiben:","suggestion":"Es folgt p44_beschreibung. Unklar, ob sich JA ausschließlich auf das unmittelbar vorherige Unteritem oder auf eines der drei aufgeführten Unteritems bezieht; Beschreibung nicht vorschnell ausblenden."},{"page":46,"after":"p46_beginn_krankheit","text":"Seit wann fürchten bzw. glauben Sie, eine schwere körperliche Krankheit zu haben und um welche Krankheit handelt es sich?","suggestion":"Die inhaltlich offene Frage hat im Original tatsächlich JA/NEIN-Felder und anschließend „Beschreiben:“. Deshalb als yn plus getrenntes Freitextfeld übertragen; nicht stillschweigend in eine Datumsfrage umgewandelt. Das Datum und die Krankheit sind in der Beschreibung zu erfassen."},{"page":46,"after":"p46_rueckversicherung","text":"Falls JA, beschreiben:","suggestion":"Bezieht sich auf p46_rueckversicherung und das anschließende Feld p46_verhalten_beschreibung."},{"page":48,"after":"p48_ssk_substanzen","text":"⎣ S. 50","suggestion":"JA (aktuell, früher oder beides) verweist auf p50."},{"page":48,"after":"p48_sgs_gluecksspielen","text":"⎣ S. 52","suggestion":"JA (aktuell, früher oder beides) verweist auf p52."},{"page":48,"after":"p48_ssi_internetspiele","text":"⎣ S. 54","suggestion":"JA (aktuell, früher oder beides) verweist auf p54."},{"page":48,"after":"p48_route_ssi","text":"Falls NEIN, weiter zu SCREENING: SCHLAFSTÖRUNGSSPEKTRUM (S. 56)","suggestion":"Plausibel: bei sämtlich negativen Antworten zu p56. Original präzisiert nicht ausdrücklich, ob NEIN alle drei Fragen meint; positive Antworten anderer Substanz-/Spielbereiche nicht verwerfen."},{"page":50,"after":"p50_alkohol","text":"Falls JA: Art, Dosis und Dauer der Einnahme feststellen","suggestion":"Bei JA Details im separaten Originalfeld p50_alkohol_beschreibung festhalten. Die Vorlage besitzt ein gemeinsames Textfeld, nicht drei einzelne Art-/Dosis-/Dauer-Felder."},{"page":50,"after":"p50_medikamente","text":"Falls JA: Art, Dosis und Dauer der Einnahme feststellen","suggestion":"Bei JA Details im separaten Originalfeld p50_medikamente_beschreibung festhalten. „Medikamtene“ im Fragetext ist ein Originalschreibfehler und bleibt erhalten."},{"page":50,"after":"p50_drogen","text":"Falls JA: Art, Dosis und Dauer der Einnahme feststellen","suggestion":"Bei JA Details im separaten Originalfeld p50_drogen_beschreibung festhalten. Die Linie trägt im Original kein „Beschreiben:“, daher text leer."},{"page":50,"after":"p50_dauer_zwoelf_monate","text":"Falls Hinweise auf Störung durch Substanzkonsum, Substanz angeben:","suggestion":"Interviewerhinweis gefolgt vom unbeschrifteten Originalfeld p50_substanz_angabe. Keine automatische Diagnoseableitung implementiert."},{"page":56,"after":"p56_ins","text":"⎣ S. 58","suggestion":"Die unter JA (a/f) gedruckte Verzweigung verweist bei aktuell, früher oder beides auf INSOMNIE, Seite 58. Die HYS-Screeningfrage auf Seite 56 muss unabhängig davon ebenfalls erhalten bleiben; keine automatische Diagnose."},{"page":56,"after":"p56_hys","text":"⎣ S. 60","suggestion":"Die unter JA (a/f) gedruckte Verzweigung verweist bei aktuell, früher oder beides auf HYPERSOMNIE, Seite 60. Die Antwortauswahl aktuell/früher/beides/nein bildet die vom Auftrag verlangte strukturierte Darstellung von JA (a/f)/NEIN ab."},{"page":56,"after":"p56_hys","text":"Falls NEIN, weiter zu SCREENING: IMPULSKONTROLLE (S. 62)","suggestion":"Unsicherheit: Der einzelne Hinweis am Seitenende benennt nicht ausdrücklich, ob NEIN beide Screenings oder nur die unmittelbar vorherige HYS-Frage meint. Eindeutig sind die separaten JA-Verweise zu Seite 58 und Seite 60; ein positives INS-Screening darf durch ein negatives HYS-Screening nicht verloren gehen. Bei beiden NEIN ist die Fortsetzung zu Seite 62 eindeutig."},{"page":64,"after":"p64_sexual_gate","text":"Falls NEIN, weiter zu PSYCHOSE-SCREENING (S. 66)","suggestion":"Exaktes Gate ist ausschließlich p64_sexual_gate: NEIN überspringt die gesamten anschließenden Details auf derselben Seite bis Seite 66; JA führt unmittelbar zu p64_detail_intro und den sexuellen Einzelitems auf Seite 64."},{"page":64,"after":"p64_pain","text":"Bei Männern:","suggestion":"Dieser Hinweis gehört nur zum unmittelbar folgenden Unteritem p64_ejaculation. Er darf nicht das danach folgende p64_onset oder die erworbenen Probleme ausblenden. Keine Geschlechtsinformation aus anderen Angaben automatisch ableiten."},{"page":64,"after":"p64_onset","text":"Falls erworben, beschreiben:","suggestion":"Bei Auswahl ERWORBEN ist p64_acquired_description zu beantworten; bei LEBENSLANG ist diese bedingte Beschreibung nicht verlangt."},{"page":64,"after":"p64_acquired_description","text":"Falls erworben:","suggestion":"Die anschließende Frage p64_experience ist an die Auswahl ERWORBEN in p64_onset gebunden."},{"page":64,"after":"p64_experience","text":"Falls JA, Erfahrung beschreiben:","suggestion":"p64_experience_description wird nur durch JA bei p64_experience angefordert."},{"page":66,"after":"p66_speech","text":"Falls JA bei einer der obrigen Fragen, beschreiben:","suggestion":"Bei mindestens einem JA in p66_perception, p66_voices, p66_persecution oder p66_speech wird p66_description angefordert. Der originale Schreibfehler obrigen ist beibehalten."},{"page":70,"after":"p70_treatment_history","text":"Falls JA: Zeitraum, Diagnose, Art der Einrichtung und der Behandlung feststellen.","suggestion":"Bei JA wird die gemeinsame Freitextbeschreibung p70_treatment_description zu Zeitraum, Diagnose, Art der Einrichtung und Behandlung angefordert. Die Quelle enthält dafür nur ein gemeinsames Beschreibungsfeld, keine getrennten Unterfragen."},{"page":6,"after":"p06_peak_minutes","text":"Priorität ausdrücklich genannter Sprungziele","suggestion":"Umsetzung: Die lokalen Sprünge S. 6 → S. 8 und S. 26 → S. 28 öffnen das ausdrücklich genannte Ziel auch nach einem dortigen negativen Screening. Diese Priorisierung ist eine dokumentierte Umsetzungsentscheidung; die PDF klärt die Überschneidung nicht."},{"page":16,"after":"p16_pds","text":"Zusammenfassende NEIN-Sprünge bei mehreren Screeningfragen","suggestion":"Umsetzung: Ein Sammelsprung wird nur bei allen zugehörigen negativen Screeningantworten ausgelöst. Frühere positive Angaben werden nicht von einem späteren NEIN übersteuert. Unklar/fehlend gilt nicht als NEIN."},{"page":30,"after":"_trauma_recent","text":"Zeitliche Trauma-Zuordnung","suggestion":"Umsetzung: Ein gekennzeichnetes Steuerfeld entscheidet über letzten Monat. Bei Unklarheit werden beide Abklärungswege offengehalten; nach akuter Abklärung wird der weitere Weg ausdrücklich ausgewählt. Weitere akute Traumata sind gesondert zu dokumentieren."}],"pages":[{"page":1,"name":"p01","pdfPage":2,"side":0,"text":"          Diagnostisches Kurzinterview bei psychischen Störungen\n                     (Mini-DIPS Open Access)\n\n\nDatum:                   ...........................................................\n\nInterviewer / in:     ...........................................................\n\n\nName:                    ...........................................................\n\nAdresse:                 ...........................................................\n\n                               ...........................................................\n\nTel., privat             ......................................... Tel., berufl.:      .........................................\n\nE-Mail-Adresse:    .........................................\n\n\nGeburtsdatum:       .........................................\n\nGeschlecht:            .........................................\n\nReligion:                .........................................\n\nStaatsangehörigkeit: .......................................\n\nFamilienstand:     verheiratet              .....................   seit     .....................\n\n                   frühere Ehen          .....................\n\n                   ledig                       .....................\n\n                     feste Partnerschaft .....................\n\n                   getrennt                  .....................   seit     .....................\n\n                 geschieden             .....................   seit     .....................\n\n                 verwitwet               .....................   seit     .....................\n\n                   sonstiges                .....................\n\nKinder:\n\n   Alter             Geschlecht          zu Hause          wann ausgezogen\n\n...................                 .................                   ..............                      ..........................\n\n...................                 .................                   ..............                      ..........................\n\n...................                 .................                   ..............                      ..........................\n\n...................                 .................                   ..............                      ..........................\n\n\n1                      Copyright © 2017 Margraf & Cwik"},{"page":2,"name":"p02","pdfPage":2,"side":1,"text":"Schulabschluss / Ausbildung:\n\nPatient / in:  ......................................................................................................................................\n\nPartner / in:  ......................................................................................................................................\n\nBeruf:\n\nPatient / in:  ......................................................................................................................................\n\nPartner / in:  ......................................................................................................................................\n\nBeruflicher Status (wenn aktuell krankgeschrieben, dennoch fragen, welcher Status ansonsten):\n\n  beschäftigt als,..........................................................................................................................\n  arbeitslos\n  in Rente/Pension\n  in Schule/Studium/Ausbildung\n  Hausfrau\n  sonstiges\n\nGab es in jüngster Zeit (im letzten halben Jahr) Veränderungen oder Schwierigkeiten mit:\n\nFamilie, Freunden, Bekannten:  ......................................................................................................\n\n..........................................................................................................................................................\n\n..........................................................................................................................................................\n\nBeruf / Schule:  .................................................................................................................................\n\n..........................................................................................................................................................\n\n..........................................................................................................................................................\n\nGesundheit: ......................................................................................................................................\n\n..........................................................................................................................................................\n\n..........................................................................................................................................................\n\nSexualität: ........................................................................................................................................\n\n..........................................................................................................................................................\n\nGewalt: ............................................................................................................................................\n\n..........................................................................................................................................................\n\nFinanzielle Angelegenheiten: ..........................................................................................................\n\n..........................................................................................................................................................\n\nGesetzliche Angelegenheiten / Polizei: ...........................................................................................\n\n..........................................................................................................................................................\n\n                       Copyright © 2017 Margraf & Cwik                         2"},{"page":3,"name":"p03","pdfPage":3,"side":0,"text":"Derzeitige Behandlung / Medikation:.....................................................................................................\n\n....................................................................................................................................................................\n\nFrühere Behandlungen: ...........................................................................................................................\n\n....................................................................................................................................................................\n\n\nWenn ich Sie bitten würde, ein Problem zu benennen, dass Ihrer Meinung nach das Hauptproblem ist,\nweshalb Sie heute hier sind, was würde Sie mir nennen?\n\n....................................................................................................................................................................\n\n....................................................................................................................................................................\n\n....................................................................................................................................................................\n\n\n\n\n\n3                      Copyright © 2017 Margraf & Cwik"},{"page":4,"name":"p04","pdfPage":3,"side":1,"text":"             SCREENING: ANGSTSPEKTRUM\n\nIch werde Ihnen nun einige Beispiele nennen und möchte Sie bitten, jeweils zu entscheiden, ob die\nfolgenden Situationen oder Dinge Ihnen Angst machen oder ob Sie diese aus Angst vermeiden:\n\nPS:     Gibt es Zeiten, in denen Sie ganz plötzlich einen Ansturm intensiver Angst oder Furcht oder\n        das Gefühl eines drohenden Unglücks haben? Kam das früher vor?\n                                                    JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 6\n\nAG:     Gibt es Situationen, in denen Sie Angst haben oder die Sie vermeiden, aus der Befürchtung,\n          Sie könnten sich panisch oder krank fühlen (z. B. Kaufhäuser, Autofahren, Menschenmengen\n        oder enge geschlossene Räume)? Kam das früher vor?\n                                                    JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 8\n\nSAS:    Fühlen Sie sich in sozialen Situationen oder Leistungssituationen ängstlich, weil Sie\n         beobachtet oder beurteilt werden können (z. B. öffentliche Vorträge, Prüfungen oder\n         Parties)? Kam das früher vor?                      JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 10\n\nSP:     Fürchten oder vermeiden Sie andere Dinge wie z. B. bestimmte Tiere,\n        Höhen, Flugreisen oder den Anblick von Blut und Verletzungen? Kam das früher vor?\n                                                    JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 12\n\nGAS:   Leiden Sie häufig unter unangemessen starken Sorgen, z. B. über familiäre,\n          berufliche oder finanzielle Angelegenheiten? Kam das früher vor?\n                                                    JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 14\n\n     Störungsbereiche, für die Angst oder Vermeidung berichtet werden, einzeln abklären.\n\n           Falls alle Bereiche mit NEIN beantwortet werden, weiter zu SCREENING:\n                   STIMMUNGSSPEKTRUM (S. 16)\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                         4"},{"page":5,"name":"p05","pdfPage":4,"side":0,"text":"Angst\n\nPhobien: Agoraphobien, Soziale Angststörungen und Spezifische Phobien können sich hinsichtlich\nder phobischen Objekte oder Situationen überlappen.\n\n\nAbgrenzung verschiedener Phobien:\n\n    1.  Das Muster der phobischen Reize (siehe die nebenstehenden Beispiele).\n\n    2.  Die zentralen Befürchtungen (Agoraphobie: Angst vor Angstanfall oder dessen\n       Konsequenzen; Soziale Angststörung: Angst vor negativer Bewertung; Spezifische Phobie:\n       Angst vor unmittelbar vom Objekt augehenden Gefahren.)\n\n\nPanikstörung (F41.0)\n\nHauptmerkmal:  Angstanfälle oder dauerhafte diesbezügliche Sorgen\nAngstanfälle:     plötzlich, „spontan“, intensiv, Körpersymptome, Gefahrengefühl\nTypisch:         „Angst vor der Angst“, befürchtet katastrophale Konsequenzen\nSpontaneität:     unerwartet, ohne erkennbare Ursache, nicht situationsgebunden\nZentrale\nBefürchtungen:   v.a. Angstanfälle („Angst vor der Angst“) bzw. katastrophale Folgen\n                   (Spezifische Phobie: unmittelbare Angst vor vom Objekt oder der Situation\n                 ausgehender Gefahr; Soziale Angststörung: Blamage/negative Bewertung)\n\nFür die Diagnose einer Panikstörung müssen v.a. folgende speziellen Kriterien erfüllt sein:\nSpontaneität:    mindestens manche Anfälle unerwartet\nSymptome:      mindestens vier der nebenan genannten Symptome\nZeitverlauf:     Symptome wenigstens manchmal innerhalb weniger Minuten nach Anfallsbeginn\n                 vorhanden\nHäufigkeit:      wiederkehrende unerwartete Anfälle, die zu einer bedeutsamen\n                 Verhaltensänderung führen oder mindestens einen Monat lang von anhaltender\n                 Sorge über weitere Anfälle oder deren Konsequenzen begleitet sind\nAbgrenzung:     Allgemein können Panikattacken im Rahmen jeder anderen psychischen Störung\n                    auftreten.\n                  Beispiele weiterer Abgrenzungen: Spezifische Phobie: wenn Angstanfälle nur\n                   bei bestimmten Reizen (z. B. Hundephobie), Soziale Angststörung: nur in\n                   sozialen Situationen, Trennungsansgstörung: Trennung von einer wichtigen\n                  Person, Posttraumatische Belastungsstörung: Konfrontation mit einem\n                  Hinweisreiz auf ein traumatisches Ereignis.\n\n\n\n\n\nPanikstörung                                                               Ja     Nein\nWiederkehrende unerwartete Panikattacken (plötzliche Angst/Unbehangen,\nHöhepunkt nach Minuten, 4 oder mehr Sypmtome)\nMind. 1 Panikattacke wird mind. 1 Monat gefolgt von:\n     -   Sorge\n     -   Verhaltensänderungen\n\n5                      Copyright © 2017 Margraf & Cwik"},{"page":6,"name":"p06","pdfPage":4,"side":1,"text":"                PANIKSTÖRUNG (PS)\n\nSie haben von ganz plötzlich auftretender intensiver Angst oder Furcht oder dem Gefühl eines\ndrohenden Unglücks berichtet. In welchen Situationen tritt diese plötzliche unerwartete Angst auf?\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\nErreicht diese Angst üblicherweise ihren Höhepunkt innerhalb von Minuten?\n                                                         JA____      NEIN____\n\n\n                                                 (Falls NEIN, weiter zu AGORAPHOBIE)\n\nErleben Sie üblicherweise während eines Angstanfalls...\n\n   (1)      ... Herzklopfen oder beschleunigten Herzschlag?                       _____\n   (2)      ... Schwitzen?                                                   _____\n   (3)      ... Zittern oder Beben?                                            _____\n   (4)      ... ein Gefühl der Kurzatmigkeit oder Atemnot?                        _____\n   (5)      ... Erstickungs- oder Würgegefühle?                                 _____\n   (6)      ... Schmerzen oder Beklemmungsgefühle in der Brust?                   _____\n   (7)      ... Übelkeit oder Magen-Darmbeschwerden?                          _____\n   (8)      ... Schwindel, Unsicherheit, Benommenheit oder der Ohnmacht nahe sein?  _____\n   (9)      ... ein Gefühl der Unwirklichkeit oder sich losgelöst fühlen?              _____\n   (10)    ... Angst, verrückt zu werden oder etwas Unkontrolliertes zu tun?          _____\n   (11)    ... Angst zu sterben?                                              _____\n   (12)    ... Taubheit oder Kribbelgefühle?                                   _____\n   (13)    ... Hitzewallungen oder Kälteschauer?                               _____\n\n\n                                      (Falls weniger als 4 Symptome, weiter zu AGORAPHOBIE)\n\nWie lange dauert es gewöhnlich, bis der Angstanfall ganz intensiv ist?        _________ Minuten\n(mind. 4 Symptome)\n\nWieviele Angstanfälle hatten Sie während des letzten Monats?          ANZAHL: __________\n\nFolgte auf einen der Angstanfälle mindestens ein Monat mit ...\n\n   (1) ... anhaltender Besorgnis über das Auftreten weiterer Angstanfälle?     JA____ NEIN____\n   (2) ... Sorgen über die Bedeutung der Attacken oder ihrer Konsequenzen?   JA____ NEIN____\n   (3) ... Verhaltensänderungen, um weitere Angstanfälle zu vermeiden?      JA____ NEIN____\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                         6"},{"page":7,"name":"p07","pdfPage":5,"side":0,"text":"Agoraphobie (F40.00)\n\nHauptmerkmal:  Furcht/Vermeidung angstanfallsrelevanter Situationen\nBeispiele:        Autofahren, Kaufhäuser, Supermärkte, Fahrstühle, Menschenmengen, alleine das\n               Haus verlassen, in einer Schlange stehen, öffentliche Verkehrsmittel, Flugzeuge,\n                  Kinos, Theater\nDauer:          mind. 6 Monate\nUmfang:        Ängste und Vermeidung in mindestens 2 der folgenden Bereiche: Verkehrsmittel,\n                   Öffentliche Plätze, Geschlossene Räume, Menschenmengen, draußen alleine sein\nMöglich:         Angstanfälle können völlig verschwinden, gefürchtete Situationen unter extremer\n                Angst oder in Begleitung ertragbar\nÜberschneidung: Einzelne agoraphobische Situationen können auch im Rahmen einer Spezifischen\n                 Phobie oder Sozialen Angststörung vermieden werden, Agoraphobiker vermeiden\n                 jedoch mehr Situationen\nZentrale\nBefürchtungen:  keine Hilfe bekommen können, wenn Panik auftritt oder beschämende Symptome\n                       (z. B. Durchfall) bekommen und die Situation nicht verlassen zu können\n\n\n\n\n\nAgoraphobie                                                                Ja     Nein\nAngst vor/Sorge in mindestens 2 Situationen\nAngst/Vermeidung der Situationen\nAngst tritt (fast) immer auf\nVermeidung/Anwesenheit anderer Personen/mit intensiver Angst ertragen\nAngst ist unangemessen\nDauer: mind. 6 Monate an\nLeiden oder Beeinträchtigungen\n\n\n7                      Copyright © 2017 Margraf & Cwik"},{"page":8,"name":"p08","pdfPage":5,"side":1,"text":"                AGORAPHOBIE (AG)\n\nSie hatten berichtet, dass Sie bestimmte Situationen vermeiden oder dass diese Ihnen Angst machen.\nWelche Situationen sind dies und was befürchten Sie, könnte Ihnen dort schlimmstenfalls passieren?\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\nErleben Sie die Angst jedesmal, wenn Sie in der gefürchteten Situation waren\noder hätten kommen können?                                        JA____ NEIN____\n\nMacht es einen Unterschied, ob Sie in Begleitung sind?                    JA____ NEIN____\n\nWas denken  Sie, könnte mit Ihnen geschehen, wenn  Sie  in einer  Situation  festsitzen, die  Sie\nüblicherweise vermeiden?\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                         8"},{"page":9,"name":"p09","pdfPage":6,"side":0,"text":"Soziale Angststörung (F40.10)\n\nHauptmerkmal:  Furcht/Vermeidung von möglichen Bewertungssituationen im weitesten Sinne\nBeispiele:        Versagen in Prüfungen, lächerlich machen bei Vortrag, Demütigung durch andere\nDauer:          mind. 6 Monate\nTypisch:         ausgeprägte Erwartungsängste\nZentrale\nBefürchtungen:  Blamage/negative Bewertung (Agoraphobie: v.a. Angstanfälle und keine Flucht\n                 möglich oder Flucht peinlich, Spezifische Phobie: unmittelbar vom Objekt oder der\n                   Situation ausgehende Gefahren)\nBestimme, ob:    nur Auftritte betreffend (öffentliches Sprechen oder Darstellungen in der\n                    Öffentlichkeit)\nAbgrenzung:     Taijin kyofusho: Eine insbesondere in kollektivistischen Gesellschaften (z. B.\n                  Japan, Korea) auftretende Angst, sich so zu verhalten, dass man andere in\n                  Verlegenheit bringt.\n\n\n\n\n\nSoziale Angststörung                                                         Ja     Nein\nAngst/Sorge in sozialen Situationen\nAngst demütigendes Verhalten/peinliches Verhalten/Angstsymptome zu zeigen\nAngst tritt (fast) immer auf\nSituationen werden vermieden oder ertragen\nAngst ist unangemessen\nDauer: mind. 6 Monate\nLeiden oder Beeinträchtigungen\n\n\n9                      Copyright © 2017 Margraf & Cwik"},{"page":10,"name":"p10","pdfPage":6,"side":1,"text":"             SOZIALE ANGSTSTÖRUNG (SAS)\n\nWas befürchten Sie, könnte Ihnen schlimmstenfalls in Situationen passieren, in denen Sie mit anderen\nMenschen zusammentreffen?\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\nErleben Sie die Angst jedesmal, wenn Sie in der gefürchteten Situation waren\noder hätten kommen können?                                        JA____ NEIN____\n\nTritt die Angst sofort auf, wenn Sie (...) erleben oder sobald Sie wissen, dass Sie (...) erleben werden?\n\n                                             SOFORT____VERZÖGERT____\n\nVermeiden Sie solche Situationen oder können Sie sie nur unter intensiver Angst ertragen?\n\n                                                              JA____ NEIN____\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        10"},{"page":11,"name":"p11","pdfPage":7,"side":0,"text":"Spezifische Phobie (F40.2x)\n\nHauptmerkmal:  Furcht/Vermeidung spezifischer Objekte\nBeispiele:         Tiere (z. B. Spinnen, Schlangen, Hunde, Ratten), Höhen, enge Räume, Flugzeug\n                und der Anblick von Blut, Verletzungen oder Spritzen\nAusnahmen:     Angst vor Panikattacken (Panikstörung), Soziale Situationen (Soziale\n                  Angststörung)\nDauer:          mind. 6 Monate\nWichtig:         Beeinträchtigung/Leiden\nMöglich:         Ertragen unter extremer Angst\nZentrale\nBefürchtungen:   direkt vom phobischen Objekt ausgehende Gefahren, wie z. B. Flugzeugabsturz,\n                Hundebiss (Agoraphobie: v.a. Angstanfälle und keine Flucht möglich oder Flucht\n                    peinlich, Soziale Angststörung: negative Bewertung)\nCodierungen:    Tier-Typus: F40.218; Umwelt-Typus: F40.228; Blut-Spritzen-Verletzungstypus,\n                  Furcht vor Blut: F40.230; Blut-Spritzen-Verletzungstypus, Furcht vor Spritzen und\n                  Transfusionen: F40.231; Blut-Spritzen-Verletzungstypus, Furcht vor\n                 medizinischen Behandlungen: F40.232; Blut-Spritzen-Verletzungstypus, Furcht\n                 vor Verletzungen; F40.233; Situativer-Typus: F40.248; Anderer-Typus: F40.298\n\n\n\n\n\nSpezifische Phobie                                                           Ja     Nein\nAngst/Sorge um spezifische Objekte/Situationen\nAngst tritt (fast) immer auf\nPhobisches Objekt/Situation wird vermieden/ertragen\nAngst ist unangemessen\nDauer: mind. 6 Monate\nLeiden oder Beeinträchtigungen\n\n\n\n11                     Copyright © 2017 Margraf & Cwik"},{"page":12,"name":"p12","pdfPage":7,"side":1,"text":"                SPEZIFISCHE PHOBIE (SP)\n\nSie hatten berichtet, dass Sie bestimmte Dinge fürchten oder vermeiden. Welche Dinge sind das?\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\nErleben Sie die Angst jedesmal, wenn Sie mit dem gefürchteten Objekt/der\ngefürchteten Situation ausgesetzt sind oder ausgesetzt werden könnten?       JA____ NEIN____\n\n\nTritt die Angst sofort auf, wenn Sie (...) erleben oder sobald Sie wissen, dass Sie (...) erleben werden?\n\n                                             SOFORT____VERZÖGERT____\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        12"},{"page":13,"name":"p13","pdfPage":8,"side":0,"text":"Generalisierte Angststörung (F41.1)\n\nHauptmerkmal:  Dauerhafte oder exzessive Angst und Sorgen, die subjektiv schwer kontrollierbar\n                  erscheinen\nDauer:          Mind. 6 Monate\nUmfang:         mindestens 2 Lebensbereiche (z. B. Arbeit, Finanzen, Ehe) betroffen (oder 1, wenn\n                   generell glüblerisch/häufige Sorgen)\nSymptome:      mindestens 3 der 6 nebenan genannten Symptome, davon mindestens 1 während\n                  des größeren Teils von 6 Monaten\nWichtig:         Sorgen nicht wegen anderen Störungen (v. a. Major Depression, Panikstörung,\n                  Soziale Phobie, Zwangsstörung)\n\n\n\n\n\nGeneralisierte Angststörung                                                  Ja     Nein\nExzessive Angst und Sorge bezügl. mehrerer Ereignisse/Tätigkeiten\nSchwierigkeiten Sorgen zu kontrollieren\nAngst/Sorgen sind mit mind. 3 Symptomen verbunden\nDauer: mind. 6 Monate\nLeiden oder Beeinträchtigungen\n\n\n13                     Copyright © 2017 Margraf & Cwik"},{"page":14,"name":"p14","pdfPage":8,"side":1,"text":"         GENERALISIERTE ANGSTSTÖRUNG (GAS)\n\nSie hatten von übermäßigen Sorgen berichtet. Worum geht es bei diesen Sorgen?\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\nFalls Sorgen in nur einem Bereich:\nSind Sie jemand, der sich oft oder auch über kleinere Dinge Sorgen macht?  JA____ NEIN____\n\nHaben Sie Schwierigkeiten Ihre Sorgen zu kontrollieren?                JA____ NEIN____\n\nLeiden Sie oft unter folgenden Symptomen:\n\n       (1) Ruhelosigkeit?                                     __________\n\n       (2) leichte Ermüdbarkeit?                               __________\n\n       (3) Konzentrationsschwierigkeiten wegen Sorgen/Angst?      __________\n\n       (4) Reizbarkeit                                        __________\n\n       (5) Ständige Anspannung?                               __________\n\n       (6) Schlafstörungen?                                   __________\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        14"},{"page":15,"name":"p15","pdfPage":9,"side":0,"text":"15                     Copyright © 2017 Margraf & Cwik"},{"page":16,"name":"p16","pdfPage":9,"side":1,"text":"           SCREENING: STIMMUNGSSPEKTRUM\n\nIch werde Ihnen nun einige Fragen zu Stimmungsschwankungen oder länger anhaltenden Stimmungen\nstellen. Gab es schon mal Zeiten, in denen Sie...\n\nME:        ... sich mindestens 1 Woche lang sich ganz extrem hochgestimmt oder reizbar fühlten?\n       Kommt das aktuell vor?                           JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 18\n\nHME:     ... sich mindestens 4 Tage lang sich über ihrem üblichen Niveau besonders hochgestimmt\n        oder reizbar fühlten? Kommt das aktuell vor?          JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 18\n\nMD:        ... sich mindestens 2 Wochen lang sehr depressiv, traurig und hoffenungslos fühlten oder gar\n         kein Interesse selbst an angenehmen Dingen hatten? Kommt das aktuell vor?\n                                                    JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 20\n\nPDS:       ... sich über einen langen Zeitraum (mindestens 2 Jahre) die meiste Zeit niedergeschlagen\n        oder traurig fühlten? Kommt das aktuell vor?           JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 22\n\n                Falls NEIN, weiter zu SCREENING: ZWANGSSPEKTRUM (S. 24)\n\n\n\n\n\nStimmungsverlaufskurve:\nMarkieren Sie zunächst wichtige Lebensereignisse (z. B. Geburt des Kindes, Arbeitsplatzverlust, Tod\neiner   nahestehenden   Person,   neue   Partnerschaft)   auf   der   Verlaufsachse   mit   einer\nJahreszahl/Monatsangabe.  Anschließend  kann  dann  der  (depressive  und  (hypo-)manische)\nStimmungsverlauf  als Kurve  eingetragen  werden.  Dabei  ist  der  graue  Bereich  für  normale\nStimmungsschwankungen vorgesehen.\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        16"},{"page":17,"name":"p17","pdfPage":10,"side":0,"text":"Manische/Hypomane Episode, Bipolare Störung I, Bipolare Störung II\n(F31.xx)\n\nHauptmerkmal:  Bipolare Störung I: mindestens 1 manische Episode, aber auch hypomane und\n                  depressive Episoden möglich, Bipolare Störung II: mindestens 1 hypomane\n                 Episode und mindestens 1 Episode der Major Depression, zu keinem Zeitpunkt\n                    allerdings eine manische Episode.\nWichtig:           Suizidalität und Geschäftsfähigkeit abklären\nVerlauf:         Bipolar I Störung: meist Beginn im 18. Lebensjahr mit manischer, hypomaner\n                 oder depressiver Episode, Bipolar II Störung: meist Beginn in den frühen 20er\n                 Lebensjahren und meist mit depressiver Episode\n                 Insgesamt häufig episodisch, typischerweise eher kurze, intensive Episoden\nZeitkriterium:   Bipolar I Störung: mindestens 1 Woche bestehende manische Episode, Bipolar II\n                Störung: mindestens 4 Tage bestehende hypomane Episode\nAbgrenzung:    Zyklothyme Störung: 2 Jahre immer wieder hypomane Symptome und\n                  verschiedene depressive Symptome ohne jemals eine Major Depression zu\n                     erfüllen, Schizophrenie-Spektrums- oder andere psychotische Störungen:\n                  psychotische Symptomperioden treten in Abwesenheit von Stimmungssymptomen\n                    auf, Störungen durch Substanzkonsum: Zusammenhang zwischen\n                Stimmungshochs und Substanzeinnahme,\n                 Aufmerksamkeitsdefizit/Hyperaktivitätsstörung: keine trennbaren Episoden der\n              Symptome\nCodierungen:    Bipolar-I-Störung, aktuelle oder letzte Episode manisch:\n                    leichtgradig: F31.11; mittelgradig: F31.12; schwergradig: F31.13; mit\n                  psychotischen Merkmalen: F31.2; teilremittiert: F31.73; vollremittiert: F31.73;\n             NNB: F31.9\n                 Bipolar-I-Störung, aktuelle oder letzte Episode depressiv:\n                    leichtgradig: F31.31; mittelgradig: F31.32; schwergradig: F31.4; mit psychotischen\n                Merkmalen: F31.5; teilremittiert: F31.75; vollremittiert: F31.76; NNB: F31.9\n                 Bipolar-II-Störung: F31.81\n\n\n\n\nManische Episode                                                           Ja     Nein\nGehobene/reizbare Stimmung/zielgerichtete Aktivität oder Energie\nMind. 3 Symptome, signifikante Veränderung des gewöhnlichen Verhaltens\nDauer: mind. 1 Woche\nStörung ausreichend schwer um Leiden oder Beeinträchtigungen zu verursachen\n     -   klinisch-stationären Aufenthalt notwendig zu machen\n     -   oder psychotische Syptome\n\n\n\nHypomane Episode                                                          Ja     Nein\nGehobene/reizbare Stimmung/zielgerichtete Aktivität oder Energie\nMind. 3 Symptome\nUncharakteristische Veränderung des Funktionsniveaus\nDurch andere beobachtbar\nDauer: mind. 4 Tage\nStörung ist nicht schwer genug um Leiden oder Beeinträchtigungen zu\nverursachen\n     -   kein klinisch-stationären Aufenthalt notwendig,\n     -   keine psychotischen Syptome\n\n17                     Copyright © 2017 Margraf & Cwik"},{"page":18,"name":"p18","pdfPage":10,"side":1,"text":"      MANISCHE/HYPOMANISCHE EPISODE (ME/HME)\n\nErlebten Sie während der Zeit, als Sie extrem hochgestimmt oder reizbar waren, Dinge wie...\n\n... das Gefühl, eine Person mit besonderen Fähigkeiten zu sein?             JA____ NEIN____\n\n... das Gefühl, mit weniger Schlaf als üblich auszukommen?                JA____ NEIN____\n\n... das Gefühl, gesprächiger als sonst zu sein?                           JA____ NEIN____\n\n... das Gefühl, dass Sie voller neuer Ideen steckten?                      JA____ NEIN____\n\n... leichte Ablenkbarkeit?                                           JA____ NEIN____\n\n... ungewöhnliche Aktivität oder Ruhelosigkeit?                          JA____ NEIN____\n... für Sie unübliche sexuelle Aktivität, übertriebenes Einkaufen oder\nandere übermäßige Aktivitäten?                                      JA____ NEIN____\n\nHaben Sie in dieser Zeit sich selbst oder andere in ernsthafte Schwierigkeiten gebracht oder wurden\nSie in eine Klinik eingeliefert?\n                                                              JA____ NEIN____\n\nWie lange dauerten diese Symptome an (Tage)?                         Dauer:_______\n\nGab es in Ihrem Leben, unmittelbar bevor diese Gefühle auftraten, besondere Ereignisse, die Ihr\nBefinden erklären könnten?\n                                                              JA____ NEIN____\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        18"},{"page":19,"name":"p19","pdfPage":11,"side":0,"text":"Major Depression (F32.xx; F33.xx)\n\nHauptmerkmal:  Depressive Stimmung oder massiver Interesseverlust (keine äußeren Ursachen oder\n                   deutlich übermäßige Reaktion)\nWichtig:           Suizidalität abklären\nVerlauf:          häufig episodisch, typischerweise eher kurze, intensive Episoden\nZeitkriterium:   Symptome mindestens 2 Wochen nahezu jeden Tag für die meiste Zeit des Tages\nAbgrenzung:     bei der PDS längere aber weniger intensive) Phase depressiver Stimmung,\n                    Interesseverlust und psychomotorische Hemmung keine eigenen Symptome, wohl\n                  aber Hoffnungslosigkeit und geringer Selbstwert\nCodierungen:    Einzelne Episode:\n                    leichtgradig: F32.0; mittelgradig: F32.1; schwergradig: F32.2; mit psychotischen\n                Merkmalen: F32.3; teilremittiert: F32.4; vollremittiert: F32.5; NNB: F32.9\n                 Rezidivierende Depression:\n                    leichtgradig: F33.0; mittelgradig: F33.1; schwergradig: F33.2; mit psychotischen\n                Merkmalen: F33.3; teilremittiert: F33.41; vollremittiert: F33.42; NNB: F33.9\n\n\n\n\n\nMajor Depression                                                           Ja     Nein\nMind. 5 Symptome, mind. entweder (1) depressive Stimmung oder (2) Verlust an\nInteresse/Freude\nDauer: mind. 2 Wochen\nLeiden oder Beeinträchtigungen\n\n\n19                     Copyright © 2017 Margraf & Cwik"},{"page":20,"name":"p20","pdfPage":11,"side":1,"text":"             MAJOR DEPRESSION (MD)\n\nFalls depressive Stimmung bzw. Interesseverlust:\nWelche der folgenden Beschwerden trafen während der Zeit, in der Sie sich traurig oder interesselos\nfühlten auf Sie zu?\n\n... Hat sich Ihr Gewicht oder Ihr Appetit stark verändert?                  JA____ NEIN____\n\n... Hat sich Ihr Schlaf geändert?                                     JA____ NEIN____\n\n... Waren Sie unfähig, still zu sitzen oder völlig verlangsamt? (Nur MD)       JA____ NEIN____\n\n... Waren Sie ständig müde oder hatten keine Energie?                    JA____ NEIN____\n\n... Dachten Sie schlecht über sich oder fühlten sich schuldig?               JA____ NEIN____\n\n... Hatten Sie Probleme mit Entscheidungen oder der Konzentration?         JA____ NEIN____\n\n... Fühlten Sie sich hoffnungslos und sahen alles schwarz?                 JA____ NEIN____\n\n... Dachten Sie an den Tod oder daran, sich selbst etwas anzutun?           JA____ NEIN____\n\n\nWie lange haben diese Symptome angehalten? Gab es Unterbrechungen?\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\nHat es mehrere solcher Phasen gegeben?                              JA____ NEIN____\n\n                       Falls zusätzlich ME/HME, BIPOLARE STÖRUNG I/II\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        20"},{"page":21,"name":"p21","pdfPage":12,"side":0,"text":"Persistierende Depressive Störung (F34.1)\n\nHauptmerkmal:  lange depressive Verstimmung (keine oder unzureichende äußere Ursachen)\nWichtig:           Suizidalität abklären\nVerlauf:          längere, aber nicht notwendigerweise intensive Phasen\nZeitkriterium:   Symptome mindestens 2 Jahre, Mehrzahl aller Tage, maximal 2 Monate\n                  beschwerdefrei\nAbgrenzung:     bei der MD kürzere (aber intensivere) Phasen, Interesseverlust und\n                 psychomotorische Hemmung eigene Symptome, nicht aber Hoffnungslosigkeit\n\n\n\n\n\nPerstierende Depressive Störung                                               Ja     Nein\nDepressive Stimmung\nMind. 2 Symptome\nKein Aussetzten der Symptome für mehr als 2 Monate\nKriterien für Major Depression können 2 Jahre durchgehend bestehen\nDauer: mind. 2 Jahre\nLeiden oder Beeinträchtigungen\n\n21                     Copyright © 2017 Margraf & Cwik"},{"page":22,"name":"p22","pdfPage":12,"side":1,"text":"       PERSISTIERENDE DEPRESSIVE STÖRUNG (PDS)\n\nGab es Phasen, in denen Sie sich nicht depressiv fühlten?                  JA____ NEIN____\n\nWie lange dauerte die längste Zeitspanne, in der Sie sich nicht depressiv oder interesselos fühlten?\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\n             Falls >2 Monate, REZIDIVIERENDE MAJOR DEPRESSION überprüfen\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        22"},{"page":23,"name":"p23","pdfPage":13,"side":0,"text":"23                     Copyright © 2017 Margraf & Cwik"},{"page":24,"name":"p24","pdfPage":13,"side":1,"text":"             SCREENING: ZWANGSSPEKTRUM\n\nIch werde Ihnen nun einige Fragen zu immer wieder auftretenden Gedanken oder Handlungen stellen.\nGab es schon mal Zeiten, in denen Sie...\n\nZG:        ... unangenehme oder vielleicht auch unsinnige Gedanken, Impulse oder Vorstellungen bei\n          sich beobachteten, die plötzlich oder immer wieder auftraten und die Angst auslösten oder\n          Sie belasteten? Kommt das aktuell vor?\n                                                    JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 26\n\nZH:        ... einen Drang verspürt haben, Handlungen oder gedankliche Vorgänge zu wiederholen\n            (z. B. beten, zählen, Wörter wiederholen) auszuführen? Kommt das aktuell vor?\n\n                                                    JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 26\n\nKDS:      ... sich wiederholt mit einem oder mehreren Körperbereichen beschäftigt haben, da Sie diese\n          als Mangel Ihres körperlichen Erscheinungsbildes wahrgenommen haben? Kommt das\n          aktuell vor?                                    JA (a/f) ____    NEIN____\n\n                                                          ⎣ S. 28\n\n\n            Falls NEIN, weiter zu SCREENING: TRAUMAFOLGESPEKTRUM (S. 30)\n\n\n\n\n\n                       Copyright © 2017 Margraf & Cwik                        24"},{"page":25,"name":"p25","pdfPage":14,"side":0,"text":"Zwangsgedanken (Ideen, Impusle) (F42)\n\nHauptmerkmal:  anhaltend/wiederholt, aufdringlich, zumindest anfangs lästig, unsinnig oder\n                   persönlichkeitsfremd, Ignorierungsversuche, „neutralisierende“ Rituale\nBeispiele:       Gedanken eine geliebte Person zu verletzen oder zu töten, Blashphemien,\n                 Krankheiten\nAbgrenzung:     Grübeln bei MD (Stimmungskongruent, nicht intrusiv), Sorgen bei GAS (Sorgen\n                  des „Alltags“, z. B. Finanzen, Gesundheit, Partnerschaft)\nZwangshandlungen:\nHauptmerkmal:  wiederholt, absichtlich, geregelt/stereotyp, ich-fremd, nicht lustvoll,\n                    (unrealistische) Katastrophenverhinderung, Reaktionsverhinderung bewirkt\n                Angst/Unbehagen\nHäufigste Inhalte:Säubern, Kontrollieren, Aggressionen\nBeispiele:         häufiges Händewaschen gegen Infektion, „gute“ Gedanken gegen Autounfall des\n                Ehemannes, häufiges Kontrollieren des Herdes\nVerlauf:          längere, aber nicht notwendigerweise intensive Phasen\nZeitaufwand:     bei Gedanken und Handlungen meist hoch (z. B. mindestens 1 Stunden/Tag)\nWichtig:        Abrgenzung zu Psychosen\nBestimme, ob:   Zusammenhang mit Tics, mit guter/angemessener Einsicht, wenig Einsicht oder\n                ohne Einsicht/wahnhaften Überzeugungen\n\n\n\n\n\nZwangsstörung                                                             Ja     Nein\nZwangsgedanken:\n     -   aufdringliche, ungewollte Gedanken/Impulse/Vorstellungen rufen\n      Angst/Unbehagen hervor\n     -   Versuch Gedanken/Impulse/Bilder zu ignorieren/unterdrücken oder\n      durch andere Gedanken zu neutralisieren\nZwangshandlungen:\n     -   Verhaltensweisen/mentale Handlungen, als Reaktion auf\n      Zwangsgedanken/Regeln\n     -   Verhalten/mentale Handlungen sollen Angst/Unbehagen/gefürchtete\n       Situationen vorbeugen oder reduzieren\nZeitintensiv oder Leiden oder Beeinträchtigungen\n\n25                     Copyright © 2017 Margraf & Cwik"},{"page":26,"name":"p26","pdfPage":14,"side":1,"text":"                ZWANGSSTÖRUNG\n\nWelchen Inhalt und Zweck haben diese Gedanken oder Handlungen?\n\nBeschreiben:  _____________________________________________________________________\n\n             _____________________________________________________________________\n\n\nRufen diese Gedanken oder Handlungen ausgeprägte Angst oder großes Unwohlsein hervor?\n\n                                                              JA____ NEIN____\n\n                                      (Falls NEIN,
